name: Run TLX core tests
description: >
  Collect the platform's TLX core test files, narrow them to the kernel-affected
  ones on kernel-only PRs (see select-kernel-tests), and run them across pytest-xdist
  workers that share the runner's single GPU. Writes JUnit XML for parse-test-failures.
inputs:
  platform:
    description: Name printed with the collected files, e.g. b200
    required: true
  files:
    description: Test file globs, one per line, relative to the checkout
    required: true
  kernel-only:
    description: "steps.<select-kernel-tests>.outputs.kernel_only"
    required: false
    default: ""
  setup-script:
    description: Environment activation script to source first, if the runner needs one
    required: false
    default: ""
  workers:
    description: pytest-xdist worker count
    required: false
    default: "4"
  junit:
    description: JUnit XML output path
    required: false
    default: /tmp/tlx-core.xml
runs:
  using: composite
  steps:
    - name: Run TLX core tests
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        PATTERNS: ${{ inputs.files }}
        KERNEL_ONLY: ${{ inputs.kernel-only }}
        SETUP_SCRIPT: ${{ inputs.setup-script }}
        WORKERS: ${{ inputs.workers }}
        JUNIT: ${{ inputs.junit }}
      run: |
        # Activation scripts are not written for set -u, so source before it.
        # shellcheck source=/dev/null
        [ -z "${SETUP_SCRIPT}" ] || . "${SETUP_SCRIPT}"
        set -eux
        shopt -s nullglob
        FILES=()
        while read -r pattern; do
          # shellcheck disable=SC2206  # expand the glob
          [ -z "${pattern}" ] || FILES+=(${pattern})
        done <<< "${PATTERNS}"
        # TorchTLX depends on floating PyTorch Inductor APIs and runs in its
        # own job, not this pinned-PyTorch one.
        TLX_FILES=()
        for file in "${FILES[@]}"; do
          [[ "${file}" == */test_torchtlx_* ]] || TLX_FILES+=("${file}")
        done
        FILES=("${TLX_FILES[@]}")
        [ ${#FILES[@]} -gt 0 ] || { echo "no TLX core test files matched"; exit 1; }
        if [ "${KERNEL_ONLY}" = "true" ]; then
          mapfile -t FILES < <(printf '%s\n' "${FILES[@]}" | grep -Fxf /tmp/affected.txt || true)
          echo "kernel-only PR: ${#FILES[@]} TLX core file(s) touch the changed kernel(s)"
          [ ${#FILES[@]} -gt 0 ] || { echo "no affected TLX core tests; skipping"; exit 0; }
        fi
        echo "${PLATFORM} collects:" "${FILES[@]}"
        # Log runner size and the pod's memory peak, pass or fail, to size -n.
        trap 'echo "runner: nproc=$(nproc) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null) memory.peak_mib=$(( $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0) / 1048576 ))"' EXIT
        # Forkserver children must import the test module by its importlib
        # name (python.test.unit.tlx_ops.*), not just its helpers from tlx_ops.
        # Kernel compilation dominates these tests (a cold Triton cache was
        # ~4x slower than a warm one on a 343-test subset on MI350), so overlap
        # compiles across workers sharing the GPU. worksteal rebalances the few
        # multi-minute cases instead of stranding them behind a static split.
        PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/python/test/unit/tlx_ops${PYTHONPATH:+:${PYTHONPATH}}" \
          python -m pytest "${FILES[@]}" --import-mode=importlib -v -n "${WORKERS}" --dist worksteal \
          --durations=25 --junitxml="${JUNIT}"
