name: Run TLX tutorial correctness tests
description: >
  Run third_party/tlx/tutorials/testing/test_correctness.py across pytest-xdist
  workers, narrowed to the kernel-affected tests on kernel-only PRs (see
  select-kernel-tests). Writes JUnit XML for parse-test-failures.
inputs:
  kernel-only:
    description: "steps.<select-kernel-tests>.outputs.kernel_only"
    required: false
    default: ""
  correctness-mode:
    description: "steps.<select-kernel-tests>.outputs.correctness_mode"
    required: false
    default: ""
  correctness-k:
    description: "steps.<select-kernel-tests>.outputs.correctness_k"
    required: false
    default: ""
  setup-script:
    description: Environment activation script to source first, if the runner needs one
    required: false
    default: ""
  workers:
    description: pytest-xdist worker count
    required: false
    default: "4"
  junit:
    description: JUnit XML output path
    required: false
    default: /tmp/tlx-correctness.xml
runs:
  using: composite
  steps:
    - name: Run TLX tutorial correctness tests
      shell: bash
      env:
        KERNEL_ONLY: ${{ inputs.kernel-only }}
        CORRECTNESS_MODE: ${{ inputs.correctness-mode }}
        CORRECTNESS_K: ${{ inputs.correctness-k }}
        SETUP_SCRIPT: ${{ inputs.setup-script }}
        WORKERS: ${{ inputs.workers }}
        JUNIT: ${{ inputs.junit }}
      run: |
        # Activation scripts are not written for set -u, so source before it.
        # shellcheck source=/dev/null
        [ -z "${SETUP_SCRIPT}" ] || . "${SETUP_SCRIPT}"
        set -eux
        K=()
        if [ "${KERNEL_ONLY}" = true ]; then
          case "${CORRECTNESS_MODE}" in
            skip) echo "kernel-only PR: no tutorial correctness tests touch the changed kernel(s); skipping"; exit 0 ;;
            filtered) K=(-k "${CORRECTNESS_K}") ;;
          esac
        fi
        python -m pytest third_party/tlx/tutorials/testing/test_correctness.py ${K[@]+"${K[@]}"} \
          -v -n "${WORKERS}" --dist worksteal --durations=25 --junitxml="${JUNIT}"
