name: Set up CUTracer
description: >
  Install NVIDIA Compute Sanitizer and put it on PATH for later steps, then
  install the cutracer CLI from PyPI into the active venv (see
  setup-test-env). The runner images ship no CUDA toolkit, so the sanitizer
  comes from the same apt source CUTracer's own CI uses on these runners
  (.ci/setup-gpu.sh in facebookexperimental/CUTracer).
inputs:
  cuda-version:
    description: "CUDA toolkit version providing compute-sanitizer, e.g. 13.0"
    required: false
    default: "13.0"
  cutracer-version:
    description: cutracer version on PyPI
    required: true
runs:
  using: composite
  steps:
    - name: Install Compute Sanitizer
      shell: bash
      env:
        CUDA_VERSION: ${{ inputs.cuda-version }}
      run: |
        set -euo pipefail
        KEYRING_DEB="${RUNNER_TEMP}/cuda-keyring.deb"
        curl -fsSL -o "${KEYRING_DEB}" https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i "${KEYRING_DEB}"
        sudo apt-get update -y
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "cuda-toolkit-${CUDA_VERSION//./-}"
        CUDA_BIN="/usr/local/cuda-${CUDA_VERSION}/bin"
        "${CUDA_BIN}/compute-sanitizer" --version
        echo "${CUDA_BIN}" >> "${GITHUB_PATH}"
    - name: Install CUTracer
      shell: bash
      env:
        CUTRACER_VERSION: ${{ inputs.cutracer-version }}
      run: |
        set -euo pipefail
        uv pip install "cutracer==${CUTRACER_VERSION}"
        cutracer --help > /dev/null
