name: Meta LLVM branch bundles

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - cmake/meta-llvm-build-info.json
      - cmake/meta-amd-llvm-build-info.json
  workflow_dispatch:
    inputs:
      kind:
        description: LLVM kinds to check
        type: choice
        default: all
        options: [all, core, amd]
      request_source:
        description: Track source branches or read explicit build manifests
        type: choice
        default: branches
        options: [branches, manifests]
      publish:
        description: Publish validated immutable bundle assets
        type: boolean
        default: true
      candidate_base_sha:
        description: Full Triton main commit for a new candidate PR (blank uses the current main)
        type: string
        default: ''
  pull_request:
    paths:
      - .github/scripts/select_meta_llvm_builds.py
      - .github/scripts/meta_llvm_assets.py
      - .github/scripts/meta_llvm_ready.py
      - .github/scripts/meta_llvm_bump.py
      - .github/scripts/test_meta_llvm_bump.py
      - .github/workflows/meta-llvm-branch-bundles.yml
      - .github/workflows/meta-llvm-build.yml
      - .github/workflows/llvm-build.yml

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python3 -m pip install pytest
      - run: python3 -m pytest -s --tb=short .github/scripts/test_meta_llvm_bump.py

  select:
    if: github.event_name != 'pull_request' && github.repository == 'facebookexperimental/triton'
    runs-on: ubuntu-latest
    outputs:
      requests: ${{ steps.requests.outputs.requests }}
      candidates: ${{ steps.requests.outputs.candidates }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python3 -m pip install PyYAML
      - name: Select unpublished branch bundles
        id: requests
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          KIND: ${{ inputs.kind || 'all' }}
          REQUEST_SOURCE: ${{ inputs.request_source || 'branches' }}
          CANDIDATE_BASE_SHA: ${{ inputs.candidate_base_sha }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: python3 .github/scripts/select_meta_llvm_builds.py

  build:
    name: Build ${{ matrix.request.kind }} branch bundle
    needs: select
    if: needs.select.outputs.requests != '[]'
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        request: ${{ fromJSON(needs.select.outputs.requests) }}
    uses: ./.github/workflows/meta-llvm-build.yml
    with:
      kind: ${{ matrix.request.kind }}
      llvm_sha: ${{ matrix.request.llvm_sha }}
      build_number: ${{ matrix.request.build_number }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

  handoff:
    name: Propose candidate PRs and file readiness issues
    needs: [select, build]
    if: ${{ !cancelled() && needs.select.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: meta-llvm-candidate-handoff
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python3 -m pip install PyYAML
      - name: Create or reuse each draft PR, then its readiness issue
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATES: ${{ needs.select.outputs.candidates }}
          CANDIDATE_BASE_SHA: ${{ inputs.candidate_base_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/meta_llvm_ready.py handoff
