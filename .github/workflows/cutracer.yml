name: CUTracer Sanitizer
# Runs TLX kernel tests under NVIDIA Compute Sanitizer through CUTracer and
# reports the result in the job summary. Findings do not fail the job; a
# sanitizer run that produced no summary (timeout, crash, missing binary) does,
# because then the job checked nothing. A pull request checks each TLX kernel
# it changes on the NVIDIA GPU it targets (B200 for sm100, H100 for sm90), or a
# self-test on each GPU when it changes this pipeline (see select_tests.py); a
# manual run checks the test it names on the GPU it names. CUTracer instruments
# through NVBit, so AMD kernels are not checked. A manual run on main
# files each finding as an issue, one per GPU, kernel and source file, labeled
# cutracer, and closes the issues of kernels it checked that came back clean.
# It also files one issue per test function that passes without CUTracer but
# fails twice under random delay; those stay open until closed by hand. Every run
# but a pull request reduces each such failure with cutracer reduce to the few
# delayed instructions that still trigger it.
# Pull requests report in the job summary only, and fail only on such a race
# in a test function that has no open issue yet.
#
# Racecheck is opt-in through the tools input: it reports false-positive
# shared-memory hazards on mbarrier-synchronized warp-specialized kernels (see
# .llms/rules/partition-scheduler-bugs.md #9) and did not finish within 30
# minutes on the default flash-attention test.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to test (defaults to the dispatched ref)
        required: false
        type: string
      test:
        description: Pytest node id or test file that launches the kernel
        required: true
        type: string
      gpu:
        description: GPU to run the test on
        required: false
        type: choice
        options: [b200, h100]
        default: b200
      kernel:
        description: Kernel name, used to attribute racecheck findings
        required: false
        type: string
      tools:
        description: Comma-separated compute-sanitizer tools (racecheck is opt-in)
        required: false
        type: string
      cutracer_version:
        description: cutracer version on PyPI
        required: false
        type: string
      delay_ns:
        description: Random-delay length in nanoseconds
        required: false
        type: string
  # The select job decides what these changes need checked.
  pull_request:
    paths:
      - third_party/tlx/ops/**
      - third_party/tlx/tutorials/**
      - python/test/unit/tlx_ops/**
      - .github/workflows/cutracer.yml
      - .github/workflows/cutracer-gpu.yml
      - .github/scripts/cutracer_ci/**
      - .github/scripts/gpu_test_selection.py
      - .github/scripts/kernel_test_selection.py
      - .github/actions/setup-cutracer/**

permissions:
  contents: read

concurrency:
  group: cutracer-sanitizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The jobs below need this repo's GPU runners and build credentials, so in a
  # fork this job is skipped and everything that depends on it with it.
  select:
    if: github.repository_owner == 'facebookexperimental'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      b200: ${{ steps.select.outputs.b200 }}
      h100: ${{ steps.select.outputs.h100 }}
      known_b200: ${{ steps.known.outputs.b200 }}
      known_h100: ${{ steps.known.outputs.h100 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A pull request's merge commit and both its parents.
          fetch-depth: 2
      - name: Select tests
        id: select
        env:
          TEST: ${{ inputs.test }}
          GPU: ${{ inputs.gpu }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            git diff --name-only HEAD^1 HEAD > "${RUNNER_TEMP}/changed.txt"
            python3 .github/scripts/cutracer_ci/select_tests.py --changed-files "${RUNNER_TEMP}/changed.txt"
          else
            python3 .github/scripts/cutracer_ci/select_tests.py --test "${TEST}" --gpu "${GPU}"
          fi
      # Races already on main have an open issue; they must not fail this run.
      - name: Find known races
        id: known
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issues=$(gh issue list --repo "${GITHUB_REPOSITORY}" --label cutracer --state open --limit 500 --json number,title)
          for gpu in b200 h100; do
            prefix="[CUTracer][${gpu^^}] random delay: "
            races=$(jq -c --arg prefix "${prefix}" 'map(select(.title | startswith($prefix))
              | {key: (.title | ltrimstr($prefix)), value: .number}) | from_entries' <<< "${issues}")
            echo "${gpu}=${races}" >> "${GITHUB_OUTPUT}"
          done

  build:
    needs: select
    # Empty lists mean this pull request changes nothing CUTracer checks.
    if: needs.select.outputs.b200 != '[]' || needs.select.outputs.h100 != '[]'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

  # Each GPU runs its tests, files its issues and closes its issues on its own.
  b200:
    needs: [select, build]
    if: needs.select.outputs.b200 != '[]'
    permissions:
      id-token: write
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/cutracer-gpu.yml
    with:
      gpu: b200
      runner: nvidia-dgx-b200
      cuda_arch: sm_100
      tests: ${{ needs.select.outputs.b200 }}
      known_races: ${{ needs.select.outputs.known_b200 }}
      # The one place that decides whether this run files and closes issues:
      # only a run of main's code speaks for main. It closes only the issues
      # of kernels it checked (see findings.py).
      file_issues: ${{ github.ref == 'refs/heads/main' && inputs.ref == '' }}
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      kernel: ${{ inputs.kernel || '' }}
      tools: ${{ inputs.tools || 'synccheck,memcheck' }}
      cutracer_version: ${{ inputs.cutracer_version || '0.4.0' }}
      delay_ns: ${{ inputs.delay_ns || '10000' }}
      wheel_url: ${{ needs.build.outputs.wheel_url }}
      wheel_filename: ${{ needs.build.outputs.wheel_filename }}
      wheel_sha256: ${{ needs.build.outputs.wheel_sha256 }}

  h100:
    needs: [select, build]
    if: needs.select.outputs.h100 != '[]'
    permissions:
      id-token: write
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/cutracer-gpu.yml
    with:
      gpu: h100
      runner: linux-gcp-h100
      cuda_arch: sm_90
      tests: ${{ needs.select.outputs.h100 }}
      known_races: ${{ needs.select.outputs.known_h100 }}
      file_issues: ${{ github.ref == 'refs/heads/main' && inputs.ref == '' }}
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      kernel: ${{ inputs.kernel || '' }}
      tools: ${{ inputs.tools || 'synccheck,memcheck' }}
      cutracer_version: ${{ inputs.cutracer_version || '0.4.0' }}
      delay_ns: ${{ inputs.delay_ns || '10000' }}
      wheel_url: ${{ needs.build.outputs.wheel_url }}
      wheel_filename: ${{ needs.build.outputs.wheel_filename }}
      wheel_sha256: ${{ needs.build.outputs.wheel_sha256 }}
