name: Meta LLVM Build
run-name: ${{ inputs.kind }} LLVM ${{ inputs.llvm_sha }} build ${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      llvm_sha:
        description: Full LLVM commit SHA to package
        required: true
        type: string
      build_number:
        description: Packaging revision for this LLVM commit
        required: true
        default: '1'
        type: string
      kind:
        description: LLVM SDK to build
        required: true
        default: core
        type: choice
        options: [core, amd]
      publish:
        description: Publish immutable GitHub Release assets
        default: true
        type: boolean
  workflow_call:
    inputs:
      llvm_sha:
        required: true
        type: string
      build_number:
        default: '1'
        type: string
      kind:
        default: core
        type: string
      publish:
        default: true
        type: boolean

env:
  LLVM_RELEASE_TAG: meta-llvm

permissions:
  contents: read

concurrency:
  group: triton-llvm-bundles-${{ inputs.kind }}-${{ inputs.llvm_sha }}-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve LLVM revision
    runs-on: ubuntu-24.04
    outputs:
      llvm_sha: ${{ steps.revision.outputs.llvm_sha }}
      llvm_tree: ${{ steps.revision.outputs.llvm_tree }}
      short_sha: ${{ steps.revision.outputs.short_sha }}
      prefix: ${{ steps.revision.outputs.prefix }}
      platforms: ${{ steps.missing.outputs.platforms }}
      validation_platforms: ${{ steps.missing.outputs.validation_platforms }}
      repairs: ${{ steps.missing.outputs.repairs }}
      source_needed: ${{ steps.missing.outputs.source_needed }}
      source_json: ${{ steps.source.outputs.content }}
      source_name: ${{ steps.revision.outputs.source_name }}
      llvm_build_info: ${{ steps.build_call.outputs.llvm_build_info }}
      matrix_exclude: ${{ steps.build_call.outputs.matrix_exclude }}
    steps:
      - name: Validate LLVM commit
        env:
          LLVM_REF: ${{ inputs.llvm_sha }}
        shell: bash
        run: '[[ "$LLVM_REF" =~ ^[0-9a-f]{40}$ ]]'

      - name: Resolve commit
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_REF: ${{ inputs.llvm_sha }}
          KIND: ${{ inputs.kind }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          case "$KIND" in
            core) prefix=llvm ;;
            amd) prefix=amd-llvm ;;
            *) echo 'kind must be core or amd' >&2; exit 1 ;;
          esac
          [[ "$BUILD_NUMBER" =~ ^(0|[1-9][0-9]*)$ ]]
          commit="$(gh api "repos/facebookexperimental/llvm-project/git/commits/${LLVM_REF}")"
          llvm_sha="$(jq -r '.sha' <<< "$commit")"
          [[ "$llvm_sha" == "$LLVM_REF" ]]
          {
            echo "llvm_sha=${llvm_sha}"
            echo "llvm_tree=$(jq -r '.tree.sha' <<< "$commit")"
            echo "short_sha=${llvm_sha:0:8}"
            echo "prefix=${prefix}"
            echo "source_name=${prefix}-${llvm_sha:0:8}-${BUILD_NUMBER}.source.json"
          } >> "$GITHUB_OUTPUT"

      - name: Define LLVM source provenance
        id: source
        env:
          KIND: ${{ inputs.kind }}
          LLVM_SHA: ${{ steps.revision.outputs.llvm_sha }}
          LLVM_TREE: ${{ steps.revision.outputs.llvm_tree }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        shell: python
        run: |
          import hashlib, json, os
          source = {
              "schema_version": 1,
              "kind": os.environ["KIND"],
              "llvm_repository": "facebookexperimental/llvm-project",
              "llvm_sha": os.environ["LLVM_SHA"],
              "llvm_tree": os.environ["LLVM_TREE"],
              "build_number": int(os.environ["BUILD_NUMBER"]),
          }
          content = json.dumps(source, sort_keys=True, separators=(",", ":"))
          digest = hashlib.sha256((content + "\n").encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"content={content}\n")
              output.write(f"digest=sha256:{digest}\n")

      - name: Checkout build workflow
        uses: actions/checkout@v6.0.2
        with:
          path: .llvm-workflow
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            .github/scripts

      - name: Set up workflow parser Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install workflow parser
        run: python3 -m pip install PyYAML

      - name: Read upstream platform matrix
        id: recipe
        shell: python
        run: |
          import json, os, yaml
          with open('.llvm-workflow/.github/workflows/llvm-build.yml') as source:
              workflow = yaml.safe_load(source)
          configs = workflow['jobs']['build']['strategy']['matrix']['config']
          linux = [config for config in configs if config['target-os'] in ('ubuntu', 'almalinux')]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('configs=' + json.dumps(linux) + '\n')
              output.write('all_configs=' + json.dumps(configs) + '\n')

      - name: Select missing platforms
        id: missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ steps.revision.outputs.prefix }}
          SHORT_SHA: ${{ steps.revision.outputs.short_sha }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
          SOURCE_NAME: ${{ steps.revision.outputs.source_name }}
          BUILD_CONFIGS: ${{ steps.recipe.outputs.configs }}
        shell: python
        run: |
          import json, os, re, sys
          sys.path.insert(0, '.llvm-workflow/.github/scripts')
          from meta_llvm_assets import published_assets, release_assets

          _, raw_assets = release_assets(os.environ['GH_REPO'], os.environ['LLVM_RELEASE_TAG'])
          assets = published_assets(raw_assets)
          configs = json.loads(os.environ['BUILD_CONFIGS'])
          source_name = os.environ['SOURCE_NAME']
          stem = f"{os.environ['PREFIX']}-{os.environ['SHORT_SHA']}"
          number = os.environ['BUILD_NUMBER']
          names = {source_name}
          for config in configs:
              name = f"{stem}-{config['target-os']}-{config['arch']}-{number}.tar.gz"
              names.update((name, name + '.sha256'))
          for name in names:
              if name in assets and re.fullmatch(r'sha256:[0-9a-f]{64}', assets[name].get('digest') or '') is None:
                  raise RuntimeError(f'{name}: published asset is missing a GitHub digest')
          source = assets.get(source_name)
          if source is not None and source['digest'] != os.environ['SOURCE_DIGEST']:
              raise RuntimeError('Existing LLVM source provenance differs')
          platforms, repairs = [], []
          for config in configs:
              name = f"{stem}-{config['target-os']}-{config['arch']}-{number}.tar.gz"
              if name not in assets:
                  platforms.append(config)
              elif name + '.sha256' not in assets:
                  repairs.append({'name': name, 'digest': assets[name]['digest']})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_needed=' + str(source is None).lower() + '\n')
              output.write('platforms=' + json.dumps(platforms) + '\n')
              output.write('repairs=' + json.dumps(repairs) + '\n')
              validation = []
              for config in configs:
                  name = f"{stem}-{config['target-os']}-{config['arch']}-{number}.tar.gz"
                  digest = assets[name]['digest'] if name in assets else ''
                  validation.append(dict(config, archive_digest=digest))
              output.write('validation_platforms=' + json.dumps(validation) + '\n')

      - name: Define worker inputs
        id: build_call
        env:
          LLVM_SHA: ${{ steps.revision.outputs.llvm_sha }}
          PREFIX: ${{ steps.revision.outputs.prefix }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          ALL_CONFIGS: ${{ steps.recipe.outputs.all_configs }}
          PLATFORMS: ${{ steps.missing.outputs.platforms }}
        shell: python
        run: |
          import json, os
          platforms = json.loads(os.environ['PLATFORMS'])
          exclude = [{'package': os.environ['PREFIX'], 'config': config}
                     for config in json.loads(os.environ['ALL_CONFIGS']) if config not in platforms]
          info = {'repository': 'facebookexperimental/llvm-project',
                  'llvm_hash': os.environ['LLVM_SHA'], 'build_number': int(os.environ['BUILD_NUMBER'])}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('llvm_build_info=' + json.dumps(info) + '\n')
              output.write('matrix_exclude=' + json.dumps(exclude) + '\n')

  build:
    name: Build ${{ needs.prepare.outputs.short_sha }}
    needs: prepare
    if: needs.prepare.outputs.platforms != '[]'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/llvm-build.yml
    with:
      package: ${{ needs.prepare.outputs.prefix }}
      llvm_build_info: ${{ needs.prepare.outputs.llvm_build_info }}
      matrix_exclude: ${{ needs.prepare.outputs.matrix_exclude }}
      ninja_args: -j4
      cmake_args: ${{ inputs.kind == 'amd' && '-DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_DOCS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF' || '' }}

  validate:
    name: Validate ${{ matrix.config['target-os'] }}-${{ matrix.config.arch }} SDK
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ${{ matrix.config.runs_on }}
    container: ${{ matrix.config.container }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.prepare.outputs.validation_platforms) }}
    env:
      LLVM_PACKAGE: ${{ needs.prepare.outputs.prefix }}
      LLVM_INSTALL_DIR: ${{ needs.prepare.outputs.prefix }}-${{ needs.prepare.outputs.short_sha }}-${{ matrix.config['target-os'] }}-${{ matrix.config.arch }}-${{ inputs.build_number }}
      SOURCE_JSON: ${{ needs.prepare.outputs.source_json }}
      SDK_PLATFORM: ${{ matrix.config['target-os'] }}-${{ matrix.config.arch }}
    steps:
      - name: Install validation toolchain on AlmaLinux
        if: matrix.config.target-os == 'almalinux'
        run: |
          dnf install --assumeyes llvm-toolset-20.1.8 python38-pip git tar gzip
          alternatives --set python3 /usr/bin/python3.8

      - name: Checkout SDK checks
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Install validation toolchain on Ubuntu
        if: matrix.config.target-os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Set up validation Python
        if: matrix.config.target-os == 'ubuntu'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install consumer build tools
        run: python3 -m pip install cmake ninja

      - name: Select SDK download source
        id: sdk
        env:
          BUILD_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          TARGET_OS: ${{ matrix.config['target-os'] }}
          ARCH: ${{ matrix.config.arch }}
        shell: 'python3 {0}'
        run: |
          import json, os
          built = any(c['target-os'] == os.environ['TARGET_OS'] and c['arch'] == os.environ['ARCH']
                      for c in json.loads(os.environ['BUILD_PLATFORMS']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('built=' + str(built).lower() + '\n')

      - name: Download new SDK
        if: steps.sdk.outputs.built == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.prepare.outputs.prefix }}-${{ matrix.config['target-os'] }}-${{ matrix.config.arch }}
          path: dist

      - name: Download published SDK
        if: steps.sdk.outputs.built != 'true'
        shell: 'python3 {0}'
        run: |
          import os, shutil, urllib.request
          from pathlib import Path
          archive = os.environ['LLVM_INSTALL_DIR'] + '.tar.gz'
          Path('dist').mkdir(exist_ok=True)
          url = 'https://github.com/facebookexperimental/triton/releases/download/meta-llvm/' + archive
          with urllib.request.urlopen(url, timeout=300) as response, open('dist/' + archive, 'wb') as output:
              shutil.copyfileobj(response, output)

      - name: Verify published SDK download
        if: steps.sdk.outputs.built != 'true'
        env:
          ARCHIVE_DIGEST: ${{ matrix.config.archive_digest }}
        shell: 'python3 {0}'
        run: |
          import hashlib, os
          digest = hashlib.sha256()
          with open('dist/' + os.environ['LLVM_INSTALL_DIR'] + '.tar.gz', 'rb') as file:
              for block in iter(lambda: file.read(1024 * 1024), b''):
                  digest.update(block)
          if 'sha256:' + digest.hexdigest() != os.environ['ARCHIVE_DIGEST']:
              raise RuntimeError('Published SDK download digest differs')

      - name: Check relocated SDK consumer
        shell: bash
        run: |
          cd dist
          tar xzf "${LLVM_INSTALL_DIR}.tar.gz"
          bash "$GITHUB_WORKSPACE/.github/scripts/validate_llvm_sdk.sh"
          sha256sum "${LLVM_INSTALL_DIR}.tar.gz" > "${LLVM_INSTALL_DIR}.tar.gz.sha256"

      - name: Record SDK validation provenance
        shell: 'python3 {0}'
        run: |
          import json, os
          from pathlib import Path
          archive = os.environ['LLVM_INSTALL_DIR'] + '.tar.gz'
          checksum = Path('dist/' + archive + '.sha256').read_text().split()[0]
          record = {'schema_version': 1, 'source': json.loads(os.environ['SOURCE_JSON']),
                    'platform': os.environ['SDK_PLATFORM'], 'sha256': checksum,
                    'run': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
                    'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'workflow_sha': os.environ['GITHUB_SHA']}
          Path('dist/' + archive + '.validation.json').write_text(json.dumps(record, sort_keys=True) + '\n')

      - name: Upload validation checksum
        uses: actions/upload-artifact@v7
        with:
          name: validated-${{ needs.prepare.outputs.prefix }}-${{ matrix.config['target-os'] }}-${{ matrix.config.arch }}
          path: |
            dist/*.tar.gz.sha256
            dist/*.validation.json
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build, validate]
    if: ${{ inputs.publish && !cancelled() && needs.prepare.result == 'success' && needs.validate.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release helpers
        uses: actions/checkout@v6.0.2
        with:
          path: .llvm-release
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/workflows

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download build archives
        if: needs.prepare.outputs.platforms != '[]'
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ${{ needs.prepare.outputs.prefix }}-*
          path: dist
          merge-multiple: true

      - name: Download validation checksums
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: validated-${{ needs.prepare.outputs.prefix }}-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LLVM_SHA: ${{ needs.prepare.outputs.llvm_sha }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          PREFIX: ${{ needs.prepare.outputs.prefix }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          REPAIRS: ${{ needs.prepare.outputs.repairs }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          SOURCE_JSON: ${{ needs.prepare.outputs.source_json }}
          SOURCE_NAME: ${{ needs.prepare.outputs.source_name }}
          TRITON_SHA: ${{ github.sha }}
        shell: bash
        run: |
          mkdir -p dist validated
          cp dist/*.tar.gz.sha256 dist/*.validation.json validated/
          while IFS=$'\t' read -r name digest; do
            printf '%s  %s\n' "${digest#sha256:}" "$name" > "dist/${name}.sha256"
          done < <(jq -r '.[] | [.name, .digest] | @tsv' <<< "$REPAIRS")
          shopt -s nullglob
          sidecars=(dist/*.tar.gz.sha256)
          ((${#sidecars[@]} > 0)) || [[ "$PLATFORMS" == '[]' ]]
          printf '%s\n' "$SOURCE_JSON" > "dist/$SOURCE_NAME"
          tag="$LLVM_RELEASE_TAG"
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.llvm-release/.github/scripts')
          from meta_llvm_assets import release_assets
          release, assets = release_assets(os.environ['GH_REPO'], os.environ['LLVM_RELEASE_TAG'])
          state = {'exists': release is not None, 'assets': assets}
          Path('.llvm-release-assets.json').write_text(json.dumps(state))
          PY
          exists="$(jq -r '.exists' .llvm-release-assets.json)"
          for sidecar in "${sidecars[@]}"; do
            archive="${sidecar%.sha256}"
            if [[ -f "$archive" ]]; then
              (cd dist && sha256sum --check "${sidecar##*/}")
            fi
          done
          python3 - "$SOURCE_NAME" "${sidecars[@]}" <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.llvm-release/.github/scripts')
          from meta_llvm_assets import published_assets, recover_starters
          names = {sys.argv[1]}
          for path in map(Path, sys.argv[2:]):
              names.add(path.name)
              archive = path.with_suffix('')
              if archive.is_file():
                  names.add(archive.name)
          state_file = Path('.llvm-release-assets.json')
          state = json.loads(state_file.read_text())
          assets = recover_starters(os.environ['GH_REPO'], state['assets'], names)
          state['published'] = list(published_assets(assets).values())
          state_file.write_text(json.dumps(state))
          PY
          existing_assets="$(jq -c '.published' .llvm-release-assets.json)"
          for sidecar in "${sidecars[@]}"; do
            archive="${sidecar%.sha256}"
            name="${archive##*/}"
            if jq -e --arg name "$name" 'any(.[]; .name == $name)' <<< "$existing_assets" >/dev/null; then
              digest="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .digest // empty' <<< "$existing_assets")"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              printf '%s  %s\n' "${digest#sha256:}" "$name" > "$sidecar"
            else
              test -f "$archive"
            fi
            checksum_name="${sidecar##*/}"
            existing="$(jq -r --arg name "$checksum_name" '.[] | select(.name == $name) | .digest // empty' <<< "$existing_assets")"
            if [[ -n "$existing" ]]; then
              [[ "$existing" == "sha256:$(sha256sum "$sidecar" | cut -d ' ' -f 1)" ]] || {
                echo "Existing immutable checksum differs: ${checksum_name}" >&2
                exit 1
              }
            elif jq -e --arg name "$checksum_name" 'any(.[]; .name == $name)' <<< "$existing_assets" >/dev/null; then
              echo "Missing GitHub digest: ${checksum_name}" >&2
              exit 1
            fi
          done
          existing_source="$(jq -r --arg name "$SOURCE_NAME" '.[] | select(.name == $name) | .digest // empty' <<< "$existing_assets")"
          if jq -e --arg name "$SOURCE_NAME" 'any(.[]; .name == $name)' <<< "$existing_assets" >/dev/null; then
            [[ "$existing_source" == "sha256:$(sha256sum "dist/$SOURCE_NAME" | cut -d ' ' -f 1)" ]] || {
              echo 'Existing immutable LLVM provenance differs' >&2
              exit 1
            }
          fi
          if [[ "$exists" == false ]]; then
            gh release create "$tag" --target "$TRITON_SHA" --latest=false \
              --title "fbtriton LLVM SDKs" \
              --notes "Immutable core and AMD LLVM SDK bundles for fbtriton." \
              || gh release view "$tag" >/dev/null
          fi
          if [[ -z "$existing_source" ]]; then
            gh release upload "$tag" "dist/$SOURCE_NAME"
          fi
          for sidecar in "${sidecars[@]}"; do
            for file in "${sidecar%.sha256}" "$sidecar"; do
              name="${file##*/}"
              if jq -e --arg name "$name" 'any(.[]; .name == $name)' <<< "$existing_assets" >/dev/null; then
                echo "Keeping existing immutable asset ${name}"
              else
                gh release upload "$tag" "$file"
              fi
            done
          done
          gh release view "$tag" --json url --jq '.url'

      - name: Publish validated bundle completion record
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_JSON: ${{ needs.prepare.outputs.source_json }}
          VALIDATED_DIR: ${{ github.workspace }}/validated
        shell: bash
        run: |
          cd .llvm-release
          python3 -m pip install PyYAML
          python3 .github/scripts/meta_llvm_ready.py publish
