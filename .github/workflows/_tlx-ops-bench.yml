name: tlx-ops-bench
# One platform of nightly-tlx-ops-bench.yml: install a commit's build.yml wheel
# into a clean venv, run the tlx.ops perf suite, and file/close nightly issues
# from it.
on:
  workflow_call:
    inputs:
      platform:
        description: "b200 | h100 | mi350; scopes artifact names and issue titles"
        required: true
        type: string
      runner:
        description: "runs-on label"
        required: true
        type: string
      torch_index:
        description: "PyTorch wheel index matching the runner's GPU stack"
        required: true
        type: string
      version:
        description: "fbtriton nightly version; names the artifact"
        required: true
        type: string
      wheel_url:
        description: "URL of the wheel build.yml made for sha"
        required: true
        type: string
      wheel_filename:
        description: "File name of that wheel"
        required: true
        type: string
      wheel_sha256:
        description: "SHA256 of that wheel"
        required: true
        type: string
      sha:
        description: "Commit the wheel was built from; the suite is checked out at it"
        required: true
        type: string

permissions:
  contents: read

env:
  TORCH_VERSION: "2.14.0"

jobs:
  bench:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 150
    permissions:
      id-token: write
      contents: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      # The setup actions come from this workflow's own revision, not from the
      # benched commit, so every commit is benched in the same environment.
      - name: Checkout CI actions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/actions
      - name: Set up test environment
        uses: ./.ci/.github/actions/setup-test-env
        with:
          backend: ${{ contains(inputs.torch_index, 'rocm') && 'rocm' || 'cuda' }}
          arch: ${{ inputs.platform == 'mi350' && 'gfx950' || '' }}
          torch: torch==${{ env.TORCH_VERSION }}
          torch-index-url: ${{ inputs.torch_index }}
          # torchao: flash_attn_mxfp8 quantizes its inputs with it.
          packages: numpy pytest pytest-timeout torchao
          # Keep the release torch on its bundled ROCm libraries.
          rocm-lib-path: ""
      # Triton finds libcuda through the linker cache, which is stale on the
      # linux-gcp-h100 runners until refreshed; h100.yml and b200.yml do the same.
      - name: Refresh the linker cache
        if: ${{ !contains(inputs.torch_index, 'rocm') }}
        run: sudo ldconfig
      - name: Install prebuilt Triton
        uses: ./.ci/.github/actions/install-prebuilt-triton
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Run tlx.ops perf suite
        id: run_bench
        timeout-minutes: 120
        run: |
          # The harness writes its JSON to a fixed path that outlives the job on
          # a self-hosted runner.
          rm -rf /tmp/tlx_benchmark
          # TorchTLX benches need Meta's Inductor patches; the per-platform
          # *-torchtlx-test jobs already run them.
          # --timeout caps each bench, so one slow bench fails on its own and
          # the benches after it still run. The longest healthy bench takes
          # about 15 minutes (mm on B200).
          python -m pytest python/test/tlx_benchmark/test_ops_perf.py --import-mode=importlib \
            -k "not torchtlx" -v -s --timeout=2700 --junitxml="${RUNNER_TEMP}/tlx-ops-bench.xml"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlx-ops-bench-${{ inputs.platform }}-${{ inputs.version }}
          path: |
            /tmp/tlx_benchmark/*.json
            ${{ runner.temp }}/tlx-ops-bench.xml
          if-no-files-found: ignore
          retention-days: 90
      - name: Parse test failures
        id: parse
        if: always()
        uses: ./.ci/.github/actions/parse-test-failures
        with:
          workflow: ${{ github.workflow }}
          job: ${{ inputs.platform }}-tlx-ops-bench
          failed: ${{ steps.run_bench.outcome != 'success' }}
          bucket: ${{ inputs.platform }}-tlx-ops-bench-job-failed
          junit: ${{ runner.temp }}/tlx-ops-bench.xml
          budget: ${{ runner.temp }}/tlx-ops-bench.xml=120

  # Feeds the /bench/ dashboard that pages.yml renders from this release. Kept
  # off the GPU runner so it never holds a write token.
  publish:
    needs: bench
    if: always() && (needs.bench.result == 'success' || needs.bench.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tlx-ops-bench-${{ inputs.platform }}-${{ inputs.version }}
          path: raw
      - name: Upload summary to the tlx-ops-bench release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          DATE=$(sed -nE 's/.*\.dev([0-9]{8}).*/\1/p' <<< "${VERSION}")
          [[ -n "${DATE}" ]] || { echo "no .devYYYYMMDD in ${VERSION}"; exit 1; }
          SUMMARY="${DATE}.${{ inputs.platform }}.json"
          python3 .github/scripts/tlx_ops_bench_dashboard.py summarize raw \
            --platform "${{ inputs.platform }}" --version "${VERSION}" --sha "${{ inputs.sha }}" --out "${SUMMARY}"
          # The three platforms publish concurrently; whichever loses the create race finds it made.
          gh release view tlx-ops-bench >/dev/null 2>&1 \
            || gh release create tlx-ops-bench --prerelease --latest=false --title "tlx.ops nightly perf" \
                 --notes "Per-night tlx.ops perf summaries behind the /bench/ dashboard." \
            || gh release view tlx-ops-bench >/dev/null
          gh release upload tlx-ops-bench "${SUMMARY}" --clobber

  report:
    needs: bench
    if: always() && needs.bench.outputs.failures != '' && needs.bench.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.bench.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: ${{ github.workflow }}
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: refs/heads/main
      sha: ${{ inputs.sha }}
      event_name: ${{ github.event_name }}
      run_attempt: ${{ github.run_attempt }}
      summary: ${{ matrix.item.summary }}
      repro: ${{ matrix.item.repro }}
      external_dep: ${{ matrix.item.external_dep }}
      external_dep_reason: ${{ matrix.item.external_dep_reason }}

  reconcile:
    needs: bench
    if: always() && (needs.bench.result == 'success' || needs.bench.result == 'failure')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/reconcile-nightly-issues.yml
    with:
      workflow_name: ${{ github.workflow }}
      job_name: ${{ inputs.platform }}-tlx-ops-bench
      failures: ${{ needs.bench.outputs.failures }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
