name: Build Triton wheel

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (defaults to the selected workflow ref)
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      repository:
        description: Triton repository to build (owner/repo; defaults to this repository)
        type: string
        required: false
        default: ''
      ref:
        description: Git ref to build
        type: string
        required: false
        default: ''
      build_id:
        description: Unique identifier for multiple wheel builds in one workflow run
        type: string
        required: false
        default: ''
      skip_cache_save:
        description: Skip cache-save steps when the caller restricts cache access
        type: boolean
        required: false
        default: false
    outputs:
      commit:
        description: Resolved Git commit used to build the wheel
        value: ${{ jobs.build.outputs.commit }}
      wheel_url:
        description: URL-encoded HTTPS URL of the uploaded wheel
        value: ${{ jobs.build.outputs.wheel_url }}
      wheel_filename:
        description: Original wheel filename
        value: ${{ jobs.build.outputs.wheel_filename }}
      wheel_sha256:
        description: SHA256 of the validated wheel
        value: ${{ jobs.build.outputs.wheel_sha256 }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: 32-core-ubuntu
    # Up to 90 minutes waiting for another producer, then 90 minutes to build.
    timeout-minutes: 180
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
      wheel_url: ${{ steps.cache.outputs.wheel_url || steps.wheel_url.outputs.wheel_url }}
      wheel_filename: ${{ steps.cache.outputs.wheel_filename || steps.wheel.outputs.filename }}
      wheel_sha256: ${{ steps.cache.outputs.wheel_sha256 || steps.wheel.outputs.sha256 }}
    env:
      MAX_JOBS: 32
      CCACHE_DIR: /tmp/fbtriton-ccache
      CCACHE_MAXSIZE: 2G
      TRITON_BUILD_WITH_CCACHE: "1"
      TRITON_BUILD_WITH_CLANG_LLD: "1"
      TRITON_WHEEL_NAME: fbtriton
      LDFLAGS: -Wl,--strip-all
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      WHEEL_CACHE_ENABLED: ${{ !inputs.skip_cache_save && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      TRITON_BUILD_REPOSITORY: ${{ inputs.repository || github.repository }}
    steps:
      - name: Checkout build tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          # Keep sparse-checkout state out of the full source checkout below.
          path: .wheel-ci-tooling
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/wheel_cache.py
            .github/workflows/build.yml

      - name: Preserve build tooling outside the source checkout
        run: |
          mkdir -p "${RUNNER_TEMP}/wheel-ci/scripts" "${RUNNER_TEMP}/wheel-ci/workflows"
          cp .wheel-ci-tooling/.github/scripts/wheel_cache.py "${RUNNER_TEMP}/wheel-ci/scripts/"
          cp .wheel-ci-tooling/.github/workflows/build.yml "${RUNNER_TEMP}/wheel-ci/workflows/"
          echo "WHEEL_CACHE_SCRIPT=${RUNNER_TEMP}/wheel-ci/scripts/wheel_cache.py" >> "$GITHUB_ENV"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install wheel cache tools
        run: |
          python3 -m pip install 'boto3>=1.36.0' uv
          echo "WHEEL_CACHE_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      - name: Authenticate with AWS
        if: env.IS_FORK_PR != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::308535385114:role/gha_workflow_triton_artifacts
          role-duration-seconds: 18000
          aws-region: us-east-1

      - name: Reuse a wheel or acquire its build lease
        if: env.WHEEL_CACHE_ENABLED == 'true'
        id: cache
        run: '"${WHEEL_CACHE_PYTHON}" "${WHEEL_CACHE_SCRIPT}" acquire'

      - name: Install build tools
        if: steps.cache.outputs.hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ccache

      - name: Restore ccache
        if: steps.cache.outputs.hit != 'true'
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/fbtriton-ccache
          key: ccache-build-wheel-${{ runner.os }}-${{ runner.arch }}-${{ inputs.repository || github.repository }}-${{ steps.checkout.outputs.commit }}
          restore-keys: |
            ccache-build-wheel-${{ runner.os }}-${{ runner.arch }}-${{ inputs.repository || github.repository }}-
            ccache-build-wheel-${{ runner.os }}-${{ runner.arch }}-

      - name: Compute build dependency cache keys
        if: steps.cache.outputs.hit != 'true'
        id: cache-key
        run: |
          llvm_file="cmake/llvm-info.json"
          amd_file="cmake/amd-llvm-info.json"

          # Upstream Triton uses llvm-hash.txt and has no separate AMD LLVM.
          if [[ ! -f "$llvm_file" ]]; then
            llvm_file="cmake/llvm-hash.txt"
          fi
          if [[ ! -f "$llvm_file" ]]; then
            echo "Error: LLVM dependency manifest is missing."
            exit 1
          fi

          echo "llvm=$(sha256sum "$llvm_file" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          if [[ -f "$amd_file" ]]; then
            echo "amd=$(sha256sum "$amd_file" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          else
            echo "amd=none" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Restore build dependencies
        if: steps.cache.outputs.hit != 'true'
        id: restore-build-deps-cache
        uses: actions/cache/restore@v4
        with:
          # Prebuilt outputs of llvm-build.yml and amd-codegen-llvm-build.yml,
          # downloaded into the Triton cache dir by build_helpers during the
          # wheel build. Meta builds need both trees; upstream only needs LLVM.
          path: |
            ~/.triton/llvm
            ~/.triton/amd
          key: ${{ runner.os }}-${{ runner.arch }}-llvm-${{ steps.cache-key.outputs.llvm }}-amd-${{ steps.cache-key.outputs.amd }}

      - name: Set up build environment
        if: steps.cache.outputs.hit != 'true'
        env:
          VIRTUAL_ENV: ${{ runner.temp }}/triton-build-venv
        run: |
          uv venv --python 3.12 "${VIRTUAL_ENV}"
          uv pip install -r python/requirements.txt
          echo "VIRTUAL_ENV=${VIRTUAL_ENV}" >> "$GITHUB_ENV"
          echo "${VIRTUAL_ENV}/bin" >> "$GITHUB_PATH"

      - name: Build wheel
        if: steps.cache.outputs.hit != 'true'
        run: |
          uv build --wheel --no-build-isolation --out-dir dist/
          ls -lh dist/

      - name: Save build dependencies
        if: ${{ steps.cache.outputs.hit != 'true' && !inputs.skip_cache_save && steps.restore-build-deps-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.triton/llvm
            ~/.triton/amd
          key: ${{ steps.restore-build-deps-cache.outputs.cache-primary-key }}

      - name: Validate wheel and prepare artifact
        if: steps.cache.outputs.hit != 'true'
        id: wheel
        shell: bash
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one Triton wheel, found ${#wheels[@]}"
            exit 1
          fi
          python3 - "${wheels[0]}" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as wheel:
              bad_file = wheel.testzip()
              if bad_file is not None:
                  sys.exit(f"Corrupt wheel member: {bad_file}")
          PY
          uv pip install --no-deps "${wheels[0]}"
          python3 -I -c 'import triton; print("OK", triton.__version__)'

          artifact_name="run_${GITHUB_RUN_ID}"
          if [[ "${IS_FORK_PR}" != "true" ]]; then
            artifact_name+="_${GITHUB_RUN_ATTEMPT}"
          fi
          if [[ -n "${BUILD_ID}" ]]; then
            artifact_name+="_${BUILD_ID}"
          fi
          echo "filename=${wheels[0]##*/}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${wheels[0]}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          # An explicit S3 prefix overrides the action's name input. Preserve
          # the artifact name as a directory under that prefix.
          mkdir -p "s3-artifacts/${artifact_name}"
          mv "${wheels[0]}" "s3-artifacts/${artifact_name}/"
          echo "name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Upload wheel to GitHub artifacts
        if: env.IS_FORK_PR == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.wheel.outputs.name }}
          path: s3-artifacts/${{ steps.wheel.outputs.name }}/*.whl
          retention-days: 14
          overwrite: true
          if-no-files-found: error

      - name: Upload wheel to S3
        if: steps.cache.outputs.hit != 'true' && env.IS_FORK_PR != 'true'
        id: upload
        uses: pytorch/test-infra/.github/actions/upload-artifact-s3@main
        with:
          name: ${{ steps.wheel.outputs.name }}
          path: s3-artifacts/*/*.whl
          s3-bucket: gha-artifacts
          s3-prefix: tritonci-artifacts
          retention-days: 14
          overwrite: "true"
          if-no-files-found: error

      - name: Publish validated wheel manifest or export wheel URL
        if: steps.cache.outputs.hit != 'true' && env.IS_FORK_PR != 'true'
        id: wheel_url
        env:
          UPLOADED_OBJECTS: ${{ steps.upload.outputs.uploaded-objects }}
        run: |
          if [[ "${WHEEL_CACHE_ENABLED}" == "true" ]]; then
            "${WHEEL_CACHE_PYTHON}" "${WHEEL_CACHE_SCRIPT}" publish --wheel s3-artifacts/*/*.whl
          else
            python3 - <<'PYTHON'
          import json
          import os
          from urllib.parse import quote

          uploaded_objects = json.loads(os.environ["UPLOADED_OBJECTS"])
          if len(uploaded_objects) != 1:
              raise RuntimeError(f"Expected exactly one uploaded wheel, found {len(uploaded_objects)}")
          key = next(iter(uploaded_objects))
          url = f"https://gha-artifacts.s3.us-east-1.amazonaws.com/{quote(key, safe='/')}"
          print(url)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"wheel_url={url}\n")
          PYTHON
          fi

      - name: Save ccache
        if: ${{ steps.cache.outputs.hit != 'true' && !inputs.skip_cache_save && steps.restore-ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/fbtriton-ccache
          key: ${{ steps.restore-ccache.outputs.cache-primary-key }}

      - name: Release wheel build lease
        if: always() && steps.cache.outputs.hit == 'false'
        run: '"${WHEEL_CACHE_PYTHON}" "${WHEEL_CACHE_SCRIPT}" release'
