name: Build Triton wheel

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: build-wheel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/wheels_fb.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      pythons: '["cp312"]'
      arches: '["x86_64"]'

  upload:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: docker-s3-upload
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v6
        with:
          name: wheels-cp312-manylinux_2_28_x86_64
          path: wheelhouse

      - name: Get wheel artifact name
        id: wheel
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one Triton wheel, found ${#wheels[@]}"
            exit 1
          fi
          wheel_name=$(basename "${wheels[0]}")
          # With an explicit S3 prefix the action ignores 'name', so the
          # wheel filename itself must retain setup.py's +git<sha> version.
          if [[ "$wheel_name" != *"+git${COMMIT_SHA:0:8}"* ]]; then
            echo "::error::Wheel filename does not contain the built commit hash"
            exit 1
          fi
          echo "name=${wheel_name}-${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "path=${wheels[0]}" >> "$GITHUB_OUTPUT"

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::308535385114:role/gha_workflow_upload-benchmark-results
          role-duration-seconds: 18000
          aws-region: us-east-1

      - name: Upload wheel to S3
        uses: pytorch/test-infra/.github/actions/upload-artifact-s3@main
        with:
          name: ${{ steps.wheel.outputs.name }}
          path: ${{ steps.wheel.outputs.path }}
          s3-bucket: tritonci-artifacts
          s3-prefix: build-artifacts
          overwrite: "true"
          if-no-files-found: error
