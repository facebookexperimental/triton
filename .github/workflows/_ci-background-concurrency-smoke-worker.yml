name: Reusable background concurrency probe
on:
  workflow_call:
    inputs:
      fail_assign:
        type: boolean
        default: false
      forced_group:
        type: string
        default: ''
      hold_seconds:
        type: number
        default: 20
permissions:
  contents: read
jobs:
  assign:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.matrix.outputs.groups }}
      slots: ${{ steps.matrix.outputs.slots }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fail assignment
        if: inputs.fail_assign
        run: exit 1
      - id: groups
        run: python3 .github/scripts/b200_background_groups.py
      - id: matrix
        env:
          TLX: ${{ steps.groups.outputs.tlx_group }}
          TORCHTLX: ${{ steps.groups.outputs.torchtlx_group }}
          GLUON: ${{ steps.groups.outputs.gluon_group }}
          FORCED_GROUP: ${{ inputs.forced_group }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, '.github/scripts')
          from b200_background_groups import assign_groups
          workers = ('tlx', 'torchtlx', 'gluon', 'probe3', 'probe4', 'probe5', 'probe6')
          assigned = assign_groups(os.environ['GITHUB_RUN_ID'], int(os.environ['GITHUB_RUN_ATTEMPT']), workers)
          assert [assigned[w] for w in workers[:3]] == [os.environ[k] for k in ('TLX', 'TORCHTLX', 'GLUON')]
          groups = ([os.environ['FORCED_GROUP']] if os.environ['FORCED_GROUP']
                    else ['prototype-' + group for group in assigned.values()])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('groups=' + json.dumps(groups) + '\n')
              output.write('slots=' + json.dumps(list(range(len(groups)))) + '\n')
          PY
  background:
    name: background slot ${{ fromJSON(needs.assign.outputs.groups)[matrix.slot] }} copy ${{ matrix.copy }}
    needs: assign
    if: ${{ !cancelled() && needs.assign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(needs.assign.outputs.slots) }}
        copy: [1, 2]
    concurrency:
      group: ${{ fromJSON(needs.assign.outputs.groups)[matrix.slot] }}
      queue: max
      cancel-in-progress: false
    env:
      HOLD: ${{ inputs.hold_seconds }}
    steps:
      - name: Background workload
        run: python3 -c 'import os, time; print("background probe", flush=True); time.sleep(float(os.environ["HOLD"]))'
  fast:
    name: fast without background group
    needs: assign
    if: ${{ !cancelled() && needs.assign.result == 'success' && inputs.forced_group == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fast workload
        run: python3 -c 'import time; print("fast probe", flush=True); time.sleep(45)'
