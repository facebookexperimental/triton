name: Meta Triton H100 Tests
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit used to build the wheel
        required: true
        type: string
      wheel_url:
        required: true
        type: string
      wheel_filename:
        required: true
        type: string
      wheel_sha256:
        required: true
        type: string

env:
  GPU_WORKFLOW_NAME: Meta Triton H100 Tests
  MAX_JOBS: 16
  TORCHINDUCTOR_TLX_MODE: "off"
  CCACHE_DIR: /tmp/fbtriton-ccache
  CCACHE_MAXSIZE: 2G

jobs:
  h100-tlx-test:
    if: "!cancelled() && github.repository_owner == 'facebookexperimental'"
    runs-on: linux-gcp-h100
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Install test dependencies
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install pytest pytest-xdist
      - name: Install torchao
        timeout-minutes: 10
        uses: ./.github/actions/install-torchao
        with:
          platform: h100
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        env:
          # Activate the runner environment in each composite-action shell.
          BASH_ENV: ${{ env.SETUP_SCRIPT }}
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Select kernel-affected tests
        id: select
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/select-kernel-tests
      - name: Run TLX core tests
        id: run_core_tests
        timeout-minutes: 60
        uses: ./.github/actions/run-tlx-core-tests
        with:
          platform: h100
          files: |
            python/test/unit/language/test_tlx_*_any.py
            python/test/unit/language/test_tlx_*sm90up*.py
            python/test/unit/language/test_tlx_*sm90.py
            python/test/unit/tlx_ops/test_*_sm90.py
          kernel-only: ${{ steps.select.outputs.kernel_only }}
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Run TLX tutorial correctness tests
        id: run_correctness_tests
        timeout-minutes: 30
        uses: ./.github/actions/run-tlx-correctness-tests
        with:
          kernel-only: ${{ steps.select.outputs.kernel_only }}
          correctness-mode: ${{ steps.select.outputs.correctness_mode }}
          correctness-k: ${{ steps.select.outputs.correctness_k }}
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Parse test failures (TLX)
        id: parse
        if: always() && github.event_name == 'schedule'
        uses: ./.github/actions/parse-test-failures
        with:
          workflow: ${{ env.GPU_WORKFLOW_NAME }}
          job: h100-tlx-test
          failed: ${{ steps.run_core_tests.outcome != 'success' || steps.run_correctness_tests.outcome != 'success' }}
          bucket: h100-tlx-job-failed
          junit: /tmp/tlx-core.xml /tmp/tlx-correctness.xml
          budget: /tmp/tlx-core.xml=60 /tmp/tlx-correctness.xml=30
          setup-script: ${{ env.SETUP_SCRIPT }}

  h100-runtime-test:
    if: "!cancelled() && github.repository_owner == 'facebookexperimental'"
    runs-on: linux-gcp-h100
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Install test dependencies
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install pytest cloudpickle
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        env:
          # Activate the runner environment in each composite-action shell.
          BASH_ENV: ${{ env.SETUP_SCRIPT }}
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Select kernel-affected tests
        id: select
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/select-kernel-tests
      - name: Run runtime unit tests
        id: run_runtime_tests
        timeout-minutes: 30
        run: |
          . "${SETUP_SCRIPT}"
          . ./.ci/tritonbench/setup-ld-library.sh
          if [ "${{ steps.select.outputs.kernel_only }}" = "true" ] && ! grep -q "^python/test/unit/runtime/" /tmp/affected.txt; then
            echo "kernel-only PR: no runtime tests touch the changed kernel(s); skipping"
            exit 0
          fi
          python -m pytest python/test/unit/runtime/ --import-mode=importlib -v --junitxml=/tmp/runtime-unit.xml
      - name: Parse test failures (runtime)
        id: parse
        if: always() && github.event_name == 'schedule'
        uses: ./.github/actions/parse-test-failures
        with:
          workflow: ${{ env.GPU_WORKFLOW_NAME }}
          job: h100-runtime-test
          failed: ${{ steps.run_runtime_tests.outcome != 'success' }}
          bucket: h100-runtime-job-failed
          junit: /tmp/runtime-unit.xml
          budget: /tmp/runtime-unit.xml=30
          setup-script: ${{ env.SETUP_SCRIPT }}

  report-h100-tlx:
    needs: h100-tlx-test
    if: always() && github.event_name == 'schedule' && needs.h100-tlx-test.outputs.failures != '' && needs.h100-tlx-test.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.h100-tlx-test.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: Meta Triton H100 Tests
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: ${{ github.ref }}
      sha: ${{ inputs.ref }}
      event_name: ${{ github.event_name }}
      run_attempt: ${{ github.run_attempt }}
      summary: ${{ matrix.item.summary }}
      repro: ${{ matrix.item.repro }}
      external_dep: ${{ matrix.item.external_dep }}
      external_dep_reason: ${{ matrix.item.external_dep_reason }}
      platform: h100

  report-h100-runtime:
    needs: h100-runtime-test
    if: always() && github.event_name == 'schedule' && needs.h100-runtime-test.outputs.failures != '' && needs.h100-runtime-test.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.h100-runtime-test.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: Meta Triton H100 Tests
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: ${{ github.ref }}
      sha: ${{ inputs.ref }}
      event_name: ${{ github.event_name }}
      run_attempt: ${{ github.run_attempt }}
      summary: ${{ matrix.item.summary }}
      repro: ${{ matrix.item.repro }}
      external_dep: ${{ matrix.item.external_dep }}
      external_dep_reason: ${{ matrix.item.external_dep_reason }}
      platform: h100

  reconcile-h100-tlx:
    needs: h100-tlx-test
    if: always() && github.event_name == 'schedule' && (needs.h100-tlx-test.result == 'success' || needs.h100-tlx-test.result == 'failure')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/reconcile-nightly-issues.yml
    with:
      workflow_name: Meta Triton H100 Tests
      job_name: h100-tlx-test
      failures: ${{ needs.h100-tlx-test.outputs.failures }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  reconcile-h100-runtime:
    needs: h100-runtime-test
    if: always() && github.event_name == 'schedule' && (needs.h100-runtime-test.result == 'success' || needs.h100-runtime-test.result == 'failure')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/reconcile-nightly-issues.yml
    with:
      workflow_name: Meta Triton H100 Tests
      job_name: h100-runtime-test
      failures: ${{ needs.h100-runtime-test.outputs.failures }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
