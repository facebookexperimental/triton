name: Meta Triton H100 Tests
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit used to build the wheel
        required: true
        type: string
      plan:
        description: Explicit test work selected by the CPU planner
        required: true
        type: string
      wheel_url:
        required: true
        type: string
      wheel_filename:
        required: true
        type: string
      wheel_sha256:
        required: true
        type: string

env:
  # Scopes the issue titles. Off main it names the branch, as ci-issues.yml does.
  GPU_WORKFLOW_NAME: Meta Triton H100 Tests${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
  MAX_JOBS: 16
  TORCHINDUCTOR_TLX_MODE: "off"
  CCACHE_DIR: /tmp/fbtriton-ccache
  CCACHE_MAXSIZE: 2G

jobs:
  h100-tlx-test:
    if: ${{ !cancelled() && github.repository_owner == 'facebookexperimental' && (fromJSON(inputs.plan).core.files[0] != null || fromJSON(inputs.plan).correctness.files[0] != null || fromJSON(inputs.plan).codegen.files[0] != null) }}
    runs-on: linux-gcp-h100
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Install test dependencies
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install pytest pytest-xdist
      - name: Install torchao
        timeout-minutes: 10
        uses: ./.github/actions/install-torchao
        with:
          platform: h100
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        env:
          # Activate the runner environment in each composite-action shell.
          BASH_ENV: ${{ env.SETUP_SCRIPT }}
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Run TLX core tests
        id: run_core_tests
        if: fromJSON(inputs.plan).core.files[0] != null
        timeout-minutes: 60
        uses: ./.github/actions/run-selected-tests
        with:
          suite: ${{ toJSON(fromJSON(inputs.plan).core) }}
          workers: "4"
          junit: /tmp/tlx-core.xml
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Run TLX tutorial correctness tests
        id: run_correctness_tests
        if: fromJSON(inputs.plan).correctness.files[0] != null
        timeout-minutes: 30
        uses: ./.github/actions/run-selected-tests
        with:
          suite: ${{ toJSON(fromJSON(inputs.plan).correctness) }}
          workers: "4"
          junit: /tmp/tlx-correctness.xml
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Parse test failures (TLX)
        id: parse
        if: always()
        uses: ./.github/actions/parse-test-failures
        with:
          workflow: ${{ env.GPU_WORKFLOW_NAME }}
          job: h100-tlx-test
          failed: ${{ job.status != 'success' }}
          bucket: h100-tlx-job-failed
          junit: ${{ fromJSON(inputs.plan).core.files[0] != null && '/tmp/tlx-core.xml' || '' }} ${{ fromJSON(inputs.plan).correctness.files[0] != null && '/tmp/tlx-correctness.xml' || '' }}
          budget: /tmp/tlx-core.xml=60 /tmp/tlx-correctness.xml=30
          setup-script: ${{ env.SETUP_SCRIPT }}

  h100-runtime-test:
    if: ${{ !cancelled() && github.repository_owner == 'facebookexperimental' && (fromJSON(inputs.plan).runtime.files[0] != null) }}
    runs-on: linux-gcp-h100
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Install test dependencies
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install pytest cloudpickle
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        env:
          # Activate the runner environment in each composite-action shell.
          BASH_ENV: ${{ env.SETUP_SCRIPT }}
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Run runtime unit tests
        id: run_runtime_tests
        if: fromJSON(inputs.plan).runtime.files[0] != null
        timeout-minutes: 30
        env:
          TEST_SUITE: ${{ toJSON(fromJSON(inputs.plan).runtime) }}
        run: |
          . "${SETUP_SCRIPT}"
          . ./.ci/tritonbench/setup-ld-library.sh
          python .github/scripts/run_selected_tests.py --junit /tmp/runtime-unit.xml
      - name: Parse test failures (runtime)
        id: parse
        if: always()
        uses: ./.github/actions/parse-test-failures
        with:
          workflow: ${{ env.GPU_WORKFLOW_NAME }}
          job: h100-runtime-test
          failed: ${{ job.status != 'success' }}
          bucket: h100-runtime-job-failed
          junit: /tmp/runtime-unit.xml
          budget: /tmp/runtime-unit.xml=30
          setup-script: ${{ env.SETUP_SCRIPT }}

  # File and close failure issues; ci-issues.yml decides which runs file.
  issues-h100-tlx:
    needs: h100-tlx-test
    if: always()
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/ci-issues.yml
    with:
      workflow: Meta Triton H100 Tests
      job: h100-tlx-test
      result: ${{ needs.h100-tlx-test.result }}
      failures: ${{ needs.h100-tlx-test.outputs.failures }}
      sha: ${{ inputs.ref }}
      platform: h100

  issues-h100-runtime:
    needs: h100-runtime-test
    if: always()
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/ci-issues.yml
    with:
      workflow: Meta Triton H100 Tests
      job: h100-runtime-test
      result: ${{ needs.h100-runtime-test.result }}
      failures: ${{ needs.h100-runtime-test.outputs.failures }}
      sha: ${{ inputs.ref }}
      platform: h100
