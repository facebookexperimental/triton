name: Meta Triton H100 Tests
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit used to build the wheel
        required: true
        type: string
      wheel_url:
        required: true
        type: string
      wheel_filename:
        required: true
        type: string
      wheel_sha256:
        required: true
        type: string

env:
  NIGHTLY_WORKFLOW_NAME: Meta Triton H100 Tests
  MAX_JOBS: 16
  TORCHINDUCTOR_TLX_MODE: "off"
  CCACHE_DIR: /tmp/fbtriton-ccache
  CCACHE_MAXSIZE: 2G

jobs:
  h100-meta-triton-test:
    if: "!cancelled() && github.repository_owner == 'facebookexperimental'"
    runs-on: linux-gcp-h100
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.collect.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Download prebuilt Triton wheel from S3
        env:
          WHEEL_URL: ${{ inputs.wheel_url }}
          WHEEL_FILENAME: ${{ inputs.wheel_filename }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
        run: |
          mkdir -p "${RUNNER_TEMP}/prebuilt-wheel"
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/prebuilt-wheel/${WHEEL_FILENAME}" "${WHEEL_URL}"
          printf '%s  %s\n' "${WHEEL_SHA256}" "${RUNNER_TEMP}/prebuilt-wheel/${WHEEL_FILENAME}" | sha256sum --check
      - name: Install Triton
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install --force-reinstall --no-deps ${RUNNER_TEMP}/prebuilt-wheel/*.whl
      - name: Export TritonBench env
        run: |
          . "${SETUP_SCRIPT}"
          set -x
          TRITONBENCH_TRITON_COMMIT_HASH=$(git rev-parse --verify HEAD)
          TRITONBENCH_TRITON_REPO=$(git config --get remote.origin.url | sed -E 's|.*github.com[:/](.+)\.git|\1|')
          TRITONBENCH_TRITON_COMMIT=${GITHUB_REF_NAME}
          TRITONBENCH_INSTALL_DIR=${PWD}
          cat <<EOF >> "${SETUP_SCRIPT}"
          if [ \${CONDA_ENV} == "${CONDA_ENV}" ] ; then
              export TRITONBENCH_TRITON_COMMIT_HASH="${TRITONBENCH_TRITON_COMMIT_HASH}"
              export TRITONBENCH_TRITON_REPO="${TRITONBENCH_TRITON_REPO}"
              export TRITONBENCH_TRITON_COMMIT="${TRITONBENCH_TRITON_COMMIT}"
              export TRITONBENCH_TRITON_INSTALL_DIR="${TRITONBENCH_INSTALL_DIR}"
          fi
          EOF
      - name: Checkout TritonBench (Optional)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          PR_BODY_FILE="$(mktemp)"
          printf '%s' "${PR_BODY}" > "${PR_BODY_FILE}"
          bash ./.ci/tritonbench/checkout.sh "${PR_BODY_FILE}"
      - name: Select kernel-affected tests
        id: select
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/select-kernel-tests
      - name: Run TritonBench tests on H100 GPU
        id: tritonbench
        if: ${{ steps.select.outputs.run_tritonbench != 'false' }}
        env:
          TRITONBENCH_TEST_SKIP_FILE: ${{ github.workspace }}/.ci/tritonbench/fbtriton_skip_tests.yaml
        run: |
          . "${SETUP_SCRIPT}"
          export TRITONBENCH_ROOT="${TRITONBENCH_ROOT:-/workspace/tritonbench}"
          bash ./.ci/tritonbench/test-gpu.sh
      - name: Collect nightly failure (TritonBench)
        id: collect
        if: always() && github.event_name == 'schedule' && failure()
        run: |
          BUCKET="h100-tritonbench"
          TITLE="[nightly] ${NIGHTLY_WORKFLOW_NAME} / h100-meta-triton-test / ${BUCKET}"
          FAILURES='[{"normalized_failure_id":"'"${BUCKET}"'","raw_failure_ids":"","issue_title":"'"${TITLE}"'","job_name":"h100-meta-triton-test","summary":"TritonBench tests failed on H100 (see run log).","repro":"","external_dep":false,"external_dep_reason":""}]'
          echo "failures=${FAILURES}" >> "$GITHUB_OUTPUT"

  h100-tlx-test:
    if: "!cancelled() && github.repository_owner == 'facebookexperimental'"
    runs-on: linux-gcp-h100
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Download prebuilt Triton wheel from S3
        env:
          WHEEL_URL: ${{ inputs.wheel_url }}
          WHEEL_FILENAME: ${{ inputs.wheel_filename }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
        run: |
          mkdir -p "${RUNNER_TEMP}/prebuilt-wheel"
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/prebuilt-wheel/${WHEEL_FILENAME}" "${WHEEL_URL}"
          printf '%s  %s\n' "${WHEEL_SHA256}" "${RUNNER_TEMP}/prebuilt-wheel/${WHEEL_FILENAME}" | sha256sum --check
      - name: Install Triton
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install --force-reinstall --no-deps ${RUNNER_TEMP}/prebuilt-wheel/*.whl
          uv pip install pytest
      - name: Install torchao
        timeout-minutes: 10
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install --pre torchao --index-url https://download.pytorch.org/whl/nightly/cu128
          python -c 'from torchao.prototype.mx_formats.mx_tensor import MXTensor, ScaleCalculationMode'
      - name: Select kernel-affected tests
        id: select
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/select-kernel-tests
      - name: Run TLX core tests
        id: run_core_tests
        timeout-minutes: 60
        run: |
          . "${SETUP_SCRIPT}"
          shopt -s nullglob
          FILES=(
            python/test/unit/language/test_tlx_*_any.py
            python/test/unit/language/test_tlx_*sm90up*.py
            python/test/unit/language/test_tlx_*sm90.py
            python/test/unit/tlx_ops/test_*_sm90.py
          )
          [ ${#FILES[@]} -gt 0 ] || { echo "no TLX core test files matched"; exit 1; }
          if [ "${{ steps.select.outputs.kernel_only }}" = "true" ]; then
            mapfile -t FILES < <(printf '%s\n' "${FILES[@]}" | grep -Fxf /tmp/affected.txt || true)
            echo "kernel-only PR: ${#FILES[@]} TLX core file(s) touch the changed kernel(s)"
            [ ${#FILES[@]} -gt 0 ] || { echo "no affected TLX core tests; skipping"; exit 0; }
          fi
          echo "h100 collects:" "${FILES[@]}"
          python -m pytest "${FILES[@]}" -v --junitxml=/tmp/tlx-core.xml
      - name: Run TLX tutorial correctness tests
        id: run_correctness_tests
        timeout-minutes: 30
        run: |
          . "${SETUP_SCRIPT}"
          if [ "${{ steps.select.outputs.kernel_only }}" = "true" ]; then
            MODE="${{ steps.select.outputs.correctness_mode }}"
            if [ "$MODE" = "skip" ]; then
              echo "kernel-only PR: no tutorial correctness tests touch the changed kernel(s); skipping"
              exit 0
            fi
            if [ "$MODE" = "filtered" ]; then
              echo "kernel-only PR: correctness filter: ${{ steps.select.outputs.correctness_k }}"
              python -m pytest third_party/tlx/tutorials/testing/test_correctness.py -k "${{ steps.select.outputs.correctness_k }}" -v --junitxml=/tmp/tlx-correctness.xml
              exit 0
            fi
          fi
          python -m pytest third_party/tlx/tutorials/testing/test_correctness.py -v --junitxml=/tmp/tlx-correctness.xml
      - name: Run host-default TLX L2 perf
        id: run_perf_tests
        if: always() && github.event_name == 'schedule'
        timeout-minutes: 60
        run: |
          . "${SETUP_SCRIPT}"
          python -m pytest python/test/tlx_benchmark/test_ops_perf.py \
            -k "not torchtlx" -v --junitxml=/tmp/tlx-perf.xml
      - name: Upload TLX perf artifacts
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: h100-tlx-perf
          path: /tmp/tlx_benchmark/*.json
          if-no-files-found: ignore
      - name: Collect nightly failures (TLX)
        id: parse
        if: always() && github.event_name == 'schedule'
        run: |
          . "${SETUP_SCRIPT}"
          FAILED_FLAG=""
          if [[ "${{ steps.run_core_tests.outcome }}" != "success" || "${{ steps.run_correctness_tests.outcome }}" != "success" || "${{ steps.run_perf_tests.outcome }}" != "success" ]]; then
            FAILED_FLAG="--failed --bucket h100-tlx-job-failed"
          fi
          python3 .github/scripts/parse_junit_failures.py \
            --junit /tmp/tlx-core.xml /tmp/tlx-correctness.xml /tmp/tlx-perf.xml \
            --budget /tmp/tlx-core.xml=60 --budget /tmp/tlx-correctness.xml=30 --budget /tmp/tlx-perf.xml=60 \
            --workflow "${NIGHTLY_WORKFLOW_NAME}" \
            --job "h100-tlx-test" \
            ${FAILED_FLAG}

  h100-runtime-test:
    if: "!cancelled() && github.repository_owner == 'facebookexperimental'"
    runs-on: linux-gcp-h100
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Download prebuilt Triton wheel from S3
        env:
          WHEEL_URL: ${{ inputs.wheel_url }}
          WHEEL_FILENAME: ${{ inputs.wheel_filename }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
        run: |
          mkdir -p "${RUNNER_TEMP}/prebuilt-wheel"
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/prebuilt-wheel/${WHEEL_FILENAME}" "${WHEEL_URL}"
          printf '%s  %s\n' "${WHEEL_SHA256}" "${RUNNER_TEMP}/prebuilt-wheel/${WHEEL_FILENAME}" | sha256sum --check
      - name: Install Triton
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install --force-reinstall --no-deps ${RUNNER_TEMP}/prebuilt-wheel/*.whl
          uv pip install pytest
      - name: Select kernel-affected tests
        id: select
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/select-kernel-tests
      - name: Run runtime unit tests
        id: run_runtime_tests
        timeout-minutes: 30
        run: |
          . "${SETUP_SCRIPT}"
          . ./.ci/tritonbench/setup-ld-library.sh
          if [ "${{ steps.select.outputs.kernel_only }}" = "true" ] && ! grep -q "^python/test/unit/runtime/" /tmp/affected.txt; then
            echo "kernel-only PR: no runtime tests touch the changed kernel(s); skipping"
            exit 0
          fi
          python -m pytest python/test/unit/runtime/ -v --junitxml=/tmp/runtime-unit.xml
      - name: Collect nightly failures (runtime)
        id: parse
        if: always() && github.event_name == 'schedule'
        run: |
          . "${SETUP_SCRIPT}"
          FAILED_FLAG=""
          if [[ "${{ steps.run_runtime_tests.outcome }}" != "success" ]]; then
            FAILED_FLAG="--failed --bucket h100-runtime-job-failed"
          fi
          python3 .github/scripts/parse_junit_failures.py \
            --junit /tmp/runtime-unit.xml \
            --budget /tmp/runtime-unit.xml=30 \
            --workflow "${NIGHTLY_WORKFLOW_NAME}" \
            --job "h100-runtime-test" \
            ${FAILED_FLAG}

  report-h100-tritonbench:
    needs: h100-meta-triton-test
    if: always() && github.event_name == 'schedule' && needs.h100-meta-triton-test.outputs.failures != '' && needs.h100-meta-triton-test.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.h100-meta-triton-test.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: Meta Triton H100 Tests
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: ${{ github.ref }}
      sha: ${{ inputs.ref }}
      event_name: ${{ github.event_name }}
      run_attempt: ${{ github.run_attempt }}
      summary: ${{ matrix.item.summary }}
      repro: ${{ matrix.item.repro }}
      external_dep: ${{ matrix.item.external_dep }}
      external_dep_reason: ${{ matrix.item.external_dep_reason }}
      platform: h100

  report-h100-tlx:
    needs: h100-tlx-test
    if: always() && github.event_name == 'schedule' && needs.h100-tlx-test.outputs.failures != '' && needs.h100-tlx-test.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.h100-tlx-test.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: Meta Triton H100 Tests
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: ${{ github.ref }}
      sha: ${{ inputs.ref }}
      event_name: ${{ github.event_name }}
      run_attempt: ${{ github.run_attempt }}
      summary: ${{ matrix.item.summary }}
      repro: ${{ matrix.item.repro }}
      external_dep: ${{ matrix.item.external_dep }}
      external_dep_reason: ${{ matrix.item.external_dep_reason }}
      platform: h100

  report-h100-runtime:
    needs: h100-runtime-test
    if: always() && github.event_name == 'schedule' && needs.h100-runtime-test.outputs.failures != '' && needs.h100-runtime-test.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.h100-runtime-test.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: Meta Triton H100 Tests
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: ${{ github.ref }}
      sha: ${{ inputs.ref }}
      event_name: ${{ github.event_name }}
      run_attempt: ${{ github.run_attempt }}
      summary: ${{ matrix.item.summary }}
      repro: ${{ matrix.item.repro }}
      external_dep: ${{ matrix.item.external_dep }}
      external_dep_reason: ${{ matrix.item.external_dep_reason }}
      platform: h100

  reconcile-h100-tritonbench:
    needs: h100-meta-triton-test
    if: always() && github.event_name == 'schedule' && (needs.h100-meta-triton-test.result == 'success' || needs.h100-meta-triton-test.result == 'failure')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/reconcile-nightly-issues.yml
    with:
      workflow_name: Meta Triton H100 Tests
      job_name: h100-meta-triton-test
      failures: ${{ needs.h100-meta-triton-test.outputs.failures }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  reconcile-h100-tlx:
    needs: h100-tlx-test
    if: always() && github.event_name == 'schedule' && (needs.h100-tlx-test.result == 'success' || needs.h100-tlx-test.result == 'failure')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/reconcile-nightly-issues.yml
    with:
      workflow_name: Meta Triton H100 Tests
      job_name: h100-tlx-test
      failures: ${{ needs.h100-tlx-test.outputs.failures }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  reconcile-h100-runtime:
    needs: h100-runtime-test
    if: always() && github.event_name == 'schedule' && (needs.h100-runtime-test.result == 'success' || needs.h100-runtime-test.result == 'failure')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/reconcile-nightly-issues.yml
    with:
      workflow_name: Meta Triton H100 Tests
      job_name: h100-runtime-test
      failures: ${{ needs.h100-runtime-test.outputs.failures }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
