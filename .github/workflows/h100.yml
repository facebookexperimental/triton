name: Meta Triton H100 Tests
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit used to build the wheel
        required: true
        type: string
      wheel_url:
        required: true
        type: string
      wheel_filename:
        required: true
        type: string
      wheel_sha256:
        required: true
        type: string

env:
  GPU_WORKFLOW_NAME: Meta Triton H100 Tests
  MAX_JOBS: 16
  TORCHINDUCTOR_TLX_MODE: "off"
  CCACHE_DIR: /tmp/fbtriton-ccache
  CCACHE_MAXSIZE: 2G

jobs:
  h100-tritonbench-test:
    if: "!cancelled() && github.repository_owner == 'facebookexperimental'"
    runs-on: linux-gcp-h100
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        env:
          # Activate the runner environment in each composite-action shell.
          BASH_ENV: ${{ env.SETUP_SCRIPT }}
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Export TritonBench env
        run: |
          . "${SETUP_SCRIPT}"
          set -x
          TRITONBENCH_TRITON_COMMIT_HASH=$(git rev-parse --verify HEAD)
          TRITONBENCH_TRITON_REPO=$(git config --get remote.origin.url | sed -E 's|.*github.com[:/](.+)\.git|\1|')
          TRITONBENCH_TRITON_COMMIT=${GITHUB_REF_NAME}
          TRITONBENCH_INSTALL_DIR=${PWD}
          cat <<EOF >> "${SETUP_SCRIPT}"
          if [ \${CONDA_ENV} == "${CONDA_ENV}" ] ; then
              export TRITONBENCH_TRITON_COMMIT_HASH="${TRITONBENCH_TRITON_COMMIT_HASH}"
              export TRITONBENCH_TRITON_REPO="${TRITONBENCH_TRITON_REPO}"
              export TRITONBENCH_TRITON_COMMIT="${TRITONBENCH_TRITON_COMMIT}"
              export TRITONBENCH_TRITON_INSTALL_DIR="${TRITONBENCH_INSTALL_DIR}"
          fi
          EOF
      - name: Checkout TritonBench (Optional)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          PR_BODY_FILE="$(mktemp)"
          printf '%s' "${PR_BODY}" > "${PR_BODY_FILE}"
          bash ./.ci/tritonbench/checkout.sh "${PR_BODY_FILE}"
      - name: Run TritonBench tests on H100 GPU
        id: tritonbench
        env:
          TRITONBENCH_TEST_SKIP_FILE: ${{ github.workspace }}/.ci/tritonbench/fbtriton_skip_tests.yaml
        run: |
          . "${SETUP_SCRIPT}"
          export TRITONBENCH_ROOT="${TRITONBENCH_ROOT:-/workspace/tritonbench}"
          bash ./.ci/tritonbench/test-gpu.sh

  h100-tlx-test:
    if: "!cancelled() && github.repository_owner == 'facebookexperimental'"
    runs-on: linux-gcp-h100
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Install test dependencies
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install pytest
      - name: Install torchao
        timeout-minutes: 10
        uses: ./.github/actions/install-torchao
        with:
          platform: h100
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        env:
          # Activate the runner environment in each composite-action shell.
          BASH_ENV: ${{ env.SETUP_SCRIPT }}
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Run TLX unit tests
        id: run_unit_tests
        timeout-minutes: 60
        run: |
          . "${SETUP_SCRIPT}"
          # 3.8 keeps one TLX test file per feature, gated by arch inside the file.
          python -m pytest python/test/unit/language/test_tlx_*.py -v --junitxml=/tmp/tlx-unit.xml
      - name: Run TLX tutorial correctness tests
        id: run_correctness_tests
        timeout-minutes: 30
        run: |
          . "${SETUP_SCRIPT}"
          python -m pytest third_party/tlx/tutorials/testing/test_correctness.py -v --junitxml=/tmp/tlx-correctness.xml
