name: Runner Health
# Opens a "[runner] <labels> is not picking up jobs" issue when a GPU runner pool
# leaves test jobs queued with none of its jobs running, and closes it once the
# pool runs a job again. A sick runner that does pick up jobs fails its job's
# "Tune Nvidia GPU" step instead. On pull requests it only runs the tests.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/runner_health.py'
      - '.github/scripts/test_runner_health.py'
      - '.github/workflows/runner-health.yml'

permissions:
  contents: read

concurrency:
  group: runner-health-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'check' }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pytest
      - name: Run runner health tests
        working-directory: .github/scripts
        run: python3 -m pytest -q test_runner_health.py

  check:
    if: github.event_name != 'pull_request' && github.repository_owner == 'facebookexperimental'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Check GPU runner pools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/runner_health.py
