name: TLX.ops perf smoke
# PR smoke gate for bundle (reactor) PRs: benches a small tlx.ops subset on
# b200 and compares it against the nearest nightly baseline. Advisory only --
# posts a PR comment, never blocks. The full suite, the regression detector,
# and bisection stay on the nightly workflow.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to bench (defaults to the selected workflow ref)
        type: string
        required: false
        default: ''
      pr:
        description: PR number to comment on (blank = no comment)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: perf-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  TORCH_VERSION: "2.14.0"
  TORCH_INDEX: https://download.pytorch.org/whl/cu130

jobs:
  resolve:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'reactor/sync-train/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      head: ${{ steps.pick.outputs.head }}
      base_date: ${{ steps.pick.outputs.base_date }}
      pr: ${{ steps.pick.outputs.pr }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pick head, base date, and PR
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            HEAD="${HEAD_SHA}"; BASE="${BASE_SHA}"; PR="${PR_NUMBER}"
          elif [[ -n "${INPUT_PR}" ]]; then
            HEAD=$(gh pr view "${INPUT_PR}" --json headRefOid --jq .headRefOid)
            BASE=$(gh pr view "${INPUT_PR}" --json baseRefOid --jq .baseRefOid)
            PR="${INPUT_PR}"
          else
            HEAD=$(git rev-parse "${INPUT_REF:-HEAD}")
            BASE=$(git merge-base "${HEAD}" origin/main)
            PR=""
          fi
          [[ "${HEAD}" =~ ^[0-9a-f]{40}$ ]] || { echo "bad head: ${HEAD}"; exit 1; }
          [[ "${BASE}" =~ ^[0-9a-f]{40}$ ]] || { echo "bad base: ${BASE}"; exit 1; }
          {
            echo "head=${HEAD}"
            echo "base_date=$(git show -s --format=%cs "${BASE}")"
            echo "pr=${PR}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.head != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.head }}

  smoke:
    needs: [resolve, build]
    if: needs.resolve.outputs.head != ''
    runs-on: nvidia-dgx-b200
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout suite at PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head }}
      - name: Checkout CI actions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/actions
      - name: Set up test environment
        uses: ./.ci/.github/actions/setup-test-env
        with:
          backend: cuda
          arch: ''
          torch: torch==${{ env.TORCH_VERSION }}
          torch-index-url: ${{ env.TORCH_INDEX }}
          packages: numpy pytest pytest-timeout torchao
      - name: Refresh the linker cache
        run: sudo ldconfig
      - name: Install prebuilt Triton
        uses: ./.ci/.github/actions/install-prebuilt-triton
        with:
          wheel-url: ${{ needs.build.outputs.wheel_url }}
          wheel-filename: ${{ needs.build.outputs.wheel_filename }}
          wheel-sha256: ${{ needs.build.outputs.wheel_sha256 }}
      - name: Run smoke subset
        id: run_bench
        timeout-minutes: 30
        run: |
          rm -rf /tmp/tlx_benchmark
          # mm (380 nightly cases) and norm_fwd (101) are --head trimmed;
          # flash_attn* are small enough to run nearly whole. fwd-only keeps
          # the smoke in budget; backward coverage stays nightly.
          python -m pytest python/test/tlx_benchmark/test_ops_perf.py --import-mode=importlib \
            -k "bench_mm or bench_flash_attn or bench_norm" --fwd-only --head 8 \
            -v -s --timeout=1200 --junitxml="${RUNNER_TEMP}/perf-smoke.xml"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlx-ops-perf-smoke-${{ github.run_id }}
          path: |
            /tmp/tlx_benchmark/*.json
            ${{ runner.temp }}/perf-smoke.xml
          if-no-files-found: ignore
          retention-days: 14

  compare:
    needs: [resolve, build, smoke]
    if: always() && needs.resolve.outputs.head != '' && needs.smoke.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tlx-ops-perf-smoke-${{ github.run_id }}
          path: raw
      - name: Summarize and compare vs nightly baseline
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
          BASE_DATE: ${{ needs.resolve.outputs.base_date }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          if ! ls raw/*.json >/dev/null 2>&1; then
            printf '## TLX.ops perf smoke (b200, advisory)\n\nNo bench results (smoke job %s) — no signal.\n' \
              "${SMOKE_RESULT}" > verdict.md
            exit 0
          fi
          TODAY=$(date -u +%Y%m%d)
          python3 .github/scripts/tlx_ops_bench_dashboard.py summarize raw \
            --platform b200 --version "0.0.0.dev${TODAY}" --sha "${HEAD_SHA}" --out pr.json
          gh release download tlx-ops-bench --pattern '*.b200.json' --dir history
          python3 .github/scripts/tlx_ops_perf_smoke_compare.py pr.json history \
            --base-date "${BASE_DATE}" --head "${HEAD_SHA}" --out verdict.md
      - name: Comment on PR
        if: needs.resolve.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr }}
        run: gh pr comment "${PR}" --body-file verdict.md
