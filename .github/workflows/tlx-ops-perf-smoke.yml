name: TLX.ops perf smoke
# PR perf check for bundle (reactor) PRs. On each enabled GPU it benches a
# small tlx.ops subset for the PR's base and its merge commit, back to back on
# one GPU, and writes that platform's section of one PR comment as soon as its
# own runner finishes. Advisory only -- never blocks. The full suite, the
# regression detector, and bisection stay on the nightly workflow.
#
#   resolve ──► build-head ──┬──► h100   (_tlx-ops-perf-smoke-platform.yml: bench ──► report)
#           └─► build-base ──┼──► b200   (same)
#                            └──► mi350  (same)
#
# A platform named in the repository variable GPU_CI_SKIP_PLATFORMS (the switch
# gpu-tests.yml uses while a runner pool is offline) is skipped here too, and
# the comment says so.

on:
  # `branches` matches the PR's target branch. Bundle PRs go from
  # reactor/sync-train/plan-*/item-* into main, and GitHub has no
  # trigger-level source-branch filter, so the resolve job's `if:` picks them.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to bench (defaults to the selected workflow ref)
        type: string
        required: false
        default: ''
      pr:
        description: PR number to bench and comment on (blank = no comment)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: perf-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'reactor/sync-train/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      head: ${{ steps.pick.outputs.head }}
      pr_head: ${{ steps.pick.outputs.pr_head }}
      base: ${{ steps.pick.outputs.base }}
      base_date: ${{ steps.pick.outputs.base_date }}
      pr: ${{ steps.pick.outputs.pr }}
      note: ${{ steps.pick.outputs.note }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pick head, base, and PR
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PR: ${{ inputs.pr }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SKIP_PLATFORMS: ${{ vars.GPU_CI_SKIP_PLATFORMS }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # Bench GitHub's test merge commit against its first parent, the
            # main commit it merges into: the merge commit is what lands, and
            # Fast correctness builds it, so its wheel is a cache hit.
            git fetch --no-tags --quiet origin "${MERGE_SHA}"
            HEAD="${MERGE_SHA}"; BASE=$(git rev-parse "${MERGE_SHA}^1")
            PR_HEAD="${HEAD_SHA}"; PR="${PR_NUMBER}"
          elif [[ -n "${INPUT_PR}" ]]; then
            HEAD=$(gh pr view "${INPUT_PR}" --json headRefOid --jq .headRefOid)
            BASE=$(gh pr view "${INPUT_PR}" --json baseRefOid --jq .baseRefOid)
            PR_HEAD="${HEAD}"; PR="${INPUT_PR}"
          else
            HEAD=$(git rev-parse "${INPUT_REF:-HEAD}")
            BASE=$(git merge-base "${HEAD}" origin/main)
            PR_HEAD="${HEAD}"; PR=""
          fi
          [[ "${HEAD}" =~ ^[0-9a-f]{40}$ ]] || { echo "bad head: ${HEAD}"; exit 1; }
          [[ "${BASE}" =~ ^[0-9a-f]{40}$ ]] || { echo "bad base: ${BASE}"; exit 1; }
          NOTE=""
          for platform in b200 h100 mi350; do
            if [[ ",${SKIP_PLATFORMS// /}," == *",${platform},"* ]]; then
              NOTE="${NOTE:+${NOTE}, }${platform}"
            fi
          done
          [[ -z "${NOTE}" ]] || NOTE="Not run on ${NOTE}: its CI runners are paused (GPU_CI_SKIP_PLATFORMS)."
          {
            echo "head=${HEAD}"
            echo "pr_head=${PR_HEAD}"
            echo "base=${BASE}"
            # Nightly summaries are named YYYYMMDD.<platform>.json.
            echo "base_date=$(git show -s --format=%cd --date=format:%Y%m%d "${BASE}")"
            echo "pr=${PR}"
            echo "note=${NOTE}"
          } >> "$GITHUB_OUTPUT"

  build-head:
    needs: resolve
    if: needs.resolve.outputs.head != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.head }}
      build_id: perf-smoke-head

  # A failed base build leaves the platforms to compare the head with the
  # nightly only, as this smoke did before it had a same-runner base.
  build-base:
    needs: resolve
    if: needs.resolve.outputs.head != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.base }}
      build_id: perf-smoke-base

  # One job per platform rather than a matrix: a job cannot depend on a single
  # matrix leg, so a matrix would hold every platform's report until the
  # slowest runner finished.
  h100:
    needs: [resolve, build-head, build-base]
    if: ${{ !cancelled() && needs.build-head.result == 'success' && !contains(vars.GPU_CI_SKIP_PLATFORMS, 'h100') }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_tlx-ops-perf-smoke-platform.yml
    with:
      platform: h100
      runner: linux-gcp-h100
      torch_index: https://download.pytorch.org/whl/cu130
      head: ${{ needs.resolve.outputs.head }}
      pr_head: ${{ needs.resolve.outputs.pr_head }}
      base: ${{ needs.resolve.outputs.base }}
      base_date: ${{ needs.resolve.outputs.base_date }}
      pr: ${{ needs.resolve.outputs.pr }}
      note: ${{ needs.resolve.outputs.note }}
      head_wheel_url: ${{ needs.build-head.outputs.wheel_url }}
      head_wheel_filename: ${{ needs.build-head.outputs.wheel_filename }}
      head_wheel_sha256: ${{ needs.build-head.outputs.wheel_sha256 }}
      base_wheel_url: ${{ needs.build-base.result == 'success' && needs.build-base.outputs.wheel_url || '' }}
      base_wheel_filename: ${{ needs.build-base.outputs.wheel_filename }}
      base_wheel_sha256: ${{ needs.build-base.outputs.wheel_sha256 }}

  b200:
    needs: [resolve, build-head, build-base]
    if: ${{ !cancelled() && needs.build-head.result == 'success' && !contains(vars.GPU_CI_SKIP_PLATFORMS, 'b200') }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_tlx-ops-perf-smoke-platform.yml
    with:
      platform: b200
      runner: nvidia-dgx-b200
      torch_index: https://download.pytorch.org/whl/cu130
      head: ${{ needs.resolve.outputs.head }}
      pr_head: ${{ needs.resolve.outputs.pr_head }}
      base: ${{ needs.resolve.outputs.base }}
      base_date: ${{ needs.resolve.outputs.base_date }}
      pr: ${{ needs.resolve.outputs.pr }}
      note: ${{ needs.resolve.outputs.note }}
      head_wheel_url: ${{ needs.build-head.outputs.wheel_url }}
      head_wheel_filename: ${{ needs.build-head.outputs.wheel_filename }}
      head_wheel_sha256: ${{ needs.build-head.outputs.wheel_sha256 }}
      base_wheel_url: ${{ needs.build-base.result == 'success' && needs.build-base.outputs.wheel_url || '' }}
      base_wheel_filename: ${{ needs.build-base.outputs.wheel_filename }}
      base_wheel_sha256: ${{ needs.build-base.outputs.wheel_sha256 }}

  mi350:
    needs: [resolve, build-head, build-base]
    if: ${{ !cancelled() && needs.build-head.result == 'success' && !contains(vars.GPU_CI_SKIP_PLATFORMS, 'mi350') }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_tlx-ops-perf-smoke-platform.yml
    with:
      platform: mi350
      runner: linux-fb-triton-mi350-1
      torch_index: https://download.pytorch.org/whl/rocm7.2
      head: ${{ needs.resolve.outputs.head }}
      pr_head: ${{ needs.resolve.outputs.pr_head }}
      base: ${{ needs.resolve.outputs.base }}
      base_date: ${{ needs.resolve.outputs.base_date }}
      pr: ${{ needs.resolve.outputs.pr }}
      note: ${{ needs.resolve.outputs.note }}
      head_wheel_url: ${{ needs.build-head.outputs.wheel_url }}
      head_wheel_filename: ${{ needs.build-head.outputs.wheel_filename }}
      head_wheel_sha256: ${{ needs.build-head.outputs.wheel_sha256 }}
      base_wheel_url: ${{ needs.build-base.result == 'success' && needs.build-base.outputs.wheel_url || '' }}
      base_wheel_filename: ${{ needs.build-base.outputs.wheel_filename }}
      base_wheel_sha256: ${{ needs.build-base.outputs.wheel_sha256 }}
