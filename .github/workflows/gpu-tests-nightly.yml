name: Meta Triton GPU Tests (nightly)
# Slow GPU suites that PRs and pushes skip, run once a day and on demand.
# gpu-tests.yml stays the PR and push suite.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-tests-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner == 'facebookexperimental'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}

  h100:
    needs: build
    permissions:
      contents: read
      actions: read
      id-token: write
      issues: write
    uses: ./.github/workflows/tritonbench.yml
    with:
      platform: h100
      wheel_url: ${{ needs.build.outputs.wheel_url }}
      wheel_filename: ${{ needs.build.outputs.wheel_filename }}
      wheel_sha256: ${{ needs.build.outputs.wheel_sha256 }}

  b200:
    needs: build
    permissions:
      contents: read
      actions: read
      id-token: write
      issues: write
    uses: ./.github/workflows/tritonbench.yml
    with:
      platform: b200
      wheel_url: ${{ needs.build.outputs.wheel_url }}
      wheel_filename: ${{ needs.build.outputs.wheel_filename }}
      wheel_sha256: ${{ needs.build.outputs.wheel_sha256 }}

  mi350:
    needs: build
    permissions:
      contents: read
      actions: read
      id-token: write
      issues: write
    uses: ./.github/workflows/tritonbench.yml
    with:
      platform: mi350
      wheel_url: ${{ needs.build.outputs.wheel_url }}
      wheel_filename: ${{ needs.build.outputs.wheel_filename }}
      wheel_sha256: ${{ needs.build.outputs.wheel_sha256 }}
