name: Reconcile Nightly Issues

# Reusable workflow that CLOSES previously-filed nightly failure issues once the
# corresponding failure identity stops appearing. Complements
# report-nightly-failure.yml (which only creates/updates). Called once per test
# job on every nightly run, regardless of whether the job passed or failed, so a
# recovered test gets its issue closed (the report-* jobs are skipped when the
# failure set is empty and therefore can never close anything).

on:
  workflow_call:
    inputs:
      workflow_name:
        description: Name of the workflow (issue title scope).
        required: true
        type: string
      job_name:
        description: Name of the job (issue title scope).
        required: true
        type: string
      failures:
        description: JSON array of currently-failing items from the parser (may be empty).
        required: false
        type: string
        default: "[]"
      run_url:
        description: URL of the nightly run (for the close comment).
        required: true
        type: string
      title_prefix:
        description: Title prefix of this job's issues; defaults to "[nightly] <workflow_name> / <job_name> / ".
        required: false
        type: string
        default: ""
      labels:
        description: Comma-separated labels of this job's issues.
        required: false
        type: string
        default: ci_issues,nightly

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Close recovered nightly issues
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ inputs.title_prefix || format('[nightly] {0} / {1} / ', inputs.workflow_name, inputs.job_name) }}
          LABELS: ${{ inputs.labels }}
          FAILURES: ${{ inputs.failures }}
          RUN_URL: ${{ inputs.run_url }}
        run: |
          python3 .github/scripts/failure_issues.py reconcile --prefix "$PREFIX" --labels "$LABELS" \
            --failures "$FAILURES" --run-url "$RUN_URL"
