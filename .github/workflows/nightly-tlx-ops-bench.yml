name: Time sm100_ci_selected (one-off)
# Temporary branch-only replacement of nightly-tlx-ops-bench.yml, dispatched
# with --ref so this file runs instead of main's. It times a full-autotune
# bench_mm run over candidate sm100_ci_selected shapes on B200, using the latest
# published nightly wheel. It never publishes to the dashboard or files issues.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "unused; kept so the dispatch inputs match main's file"
        required: false
        default: ""
      sha:
        description: "unused; kept so the dispatch inputs match main's file"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: time-sm100-ci-selected
  cancel-in-progress: false

env:
  TORCH_VERSION: "2.14.0"

jobs:
  resolve:
    if: github.repository_owner == 'facebookexperimental'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pick.outputs.version }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Pick the latest published nightly
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download nightly --pattern latest.json --output latest.json
          VERSION=$(jq -r .version latest.json)
          SHA=$(jq -r .commit latest.json)
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "not a full commit sha: ${SHA}"; exit 1; }
          echo "Timing with ${VERSION} (${SHA})"
          { echo "version=${VERSION}"; echo "sha=${SHA}"; } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  time-b200:
    needs: [resolve, build]
    runs-on: nvidia-dgx-b200
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
      - name: Set up test environment
        uses: ./.github/actions/setup-test-env
        with:
          backend: cuda
          torch: torch==${{ env.TORCH_VERSION }}
          torch-index-url: https://download.pytorch.org/whl/cu130
          packages: numpy pytest pytest-timeout
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        with:
          wheel-url: ${{ needs.build.outputs.wheel_url }}
          wheel-filename: ${{ needs.build.outputs.wheel_filename }}
          wheel-sha256: ${{ needs.build.outputs.wheel_sha256 }}
      - name: Time full autotune on candidate shapes
        timeout-minutes: 170
        run: |
          rm -rf /tmp/tlx_benchmark
          mkdir -p "${RUNNER_TEMP}/timing"
          python python/test/tlx_benchmark/time_ci_selected.py \
            --space full --cold-compile first \
            --json "${RUNNER_TEMP}/timing/mm_full.json" 2>&1 | tee "${RUNNER_TEMP}/timing/time.log"
      - name: Per-case times
        if: always()
        run: grep -E "CASE_TIME|TOTAL_TIME" "${RUNNER_TEMP}/timing/time.log" || true
      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sm100-ci-selected
          path: ${{ runner.temp }}/timing/
          if-no-files-found: ignore
          retention-days: 14
