name: Bisect TLX throughput regression

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Benchmark workflow run containing regression evidence
        required: true
        default: '42759592380'
        type: string
      artifact_name:
        description: Regression evidence artifact from that run
        required: true
        default: issue-4888-h100-addmm
        type: string
      platform:
        description: Platform to bisect
        required: true
        default: h100
        type: choice
        options: [h100]
      state_run_id:
        description: Previous bisect round, empty for the first round
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: tlx-perf-bisect-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'facebookexperimental/triton'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      good: ${{ steps.plan.outputs.good }}
      bad: ${{ steps.plan.outputs.bad }}
      candidate: ${{ steps.plan.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the evidence producer
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          STATE_RUN_ID: ${{ inputs.state_run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          def read_run(number):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{int(number)}']))
          original = read_run(os.environ['SOURCE_RUN_ID'])
          assert original['path'].split('@', 1)[0] == '.github/workflows/nightly-tlx-ops-bench.yml'
          assert original['event'] in ('schedule', 'workflow_dispatch')
          assert original['head_repository']['full_name'] == repo
          if os.environ['STATE_RUN_ID']:
              previous = read_run(os.environ['STATE_RUN_ID'])
              path = os.environ['GITHUB_WORKFLOW_REF'].split('@', 1)[0].split('/', 2)[2]
              assert previous['path'].split('@', 1)[0] == path
              assert previous['event'] == 'workflow_dispatch'
              assert previous['head_repository']['full_name'] == repo
              assert previous['head_branch'] == os.environ['GITHUB_REF_NAME']
          PY
      - name: Prepare the detected H100 addmm case for issue 4888
        if: inputs.state_run_id == ''
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          evidence = pathlib.Path('evidence')
          evidence.mkdir(exist_ok=True)
          spec = {
              'op': 'addmm', 'direction': 'fwd',
              'key': 'addmm/sm90/float16/440x4096x1093x1093_1x1_1093x1',
              'platform': 'h100', 'space': 'heuristic', 'required_ratio': 0.7,
              'good_sha': '5426e3e1678bffd326eb1d502aeb4d07d9123ee4',
              'bad_sha': '193d60129c72cebd63efe64b74ea1d2ccaaf97fd'
          }
          (evidence / 'regressions.json').write_text(json.dumps([
              {'platform': 'h100', 'bisect_issue': 4888, 'bisect': spec}
          ]))
          PY
      - name: Download previous round state
        if: inputs.state_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: perf-bisect-state
          path: evidence
          run-id: ${{ inputs.state_run_id }}
          github-token: ${{ github.token }}
      - name: Select the next main-history commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          STATE_RUN_ID: ${{ inputs.state_run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import time

          repo = os.environ['GITHUB_REPOSITORY']
          evidence = pathlib.Path('evidence')
          context = {'source_run_id': os.environ['SOURCE_RUN_ID'], 'artifact_name': os.environ['ARTIFACT_NAME'],
                     'platform': os.environ['PLATFORM']}
          if os.environ['STATE_RUN_ID']:
              previous = json.loads((evidence / 'inputs.json').read_text())
              assert all(previous[key] == value for key, value in context.items())
              context = previous
          else:
              specs = []
              for alert in json.loads((evidence / 'regressions.json').read_text()):
                  number = alert.get('bisect_issue')
                  if not number or alert['platform'] != context['platform']:
                      continue
                  number = int(number)
                  issue = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/issues/{number}']))
                  if issue['state'] == 'open':
                      specs.append({'issue_number': number, **alert['bisect']})
              (evidence / 'state.json').write_text(json.dumps({'specs': specs}))
              context.update(started_at=time.time(), reported=0)
          state = json.loads((evidence / 'state.json').read_text())
          if time.time() - context['started_at'] > 300 * 60:
              for spec in state['specs'][state.get('index', 0):]:
                  state.setdefault('results', []).append({**spec, 'status': 'inconclusive',
                                                         'reason': 'Five-hour bisection budget expired.'})
              state['index'] = len(state['specs'])
              (evidence / 'state.json').write_text(json.dumps(state))
          (evidence / 'inputs.json').write_text(json.dumps(context))
          subprocess.run(['python3', 'tooling/.github/scripts/tlx_ops_bench_bisect_round.py', 'prepare',
                          '--state', str(evidence / 'state.json'), '--source', 'source',
                          '--out', str(evidence / 'prepared.json')], check=True)
          prepared = json.loads((evidence / 'prepared.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"ready={str(prepared['needs_measurement']).lower()}\n")
              if prepared['needs_measurement']:
                  out.write(f"good={prepared['spec']['good_sha']}\nbad={prepared['spec']['bad_sha']}\n")
                  out.write(f"candidate={prepared['candidate_sha'] or ''}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: perf-bisect-prepared
          path: |
            evidence/prepared.json
            evidence/inputs.json

  good-wheel:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.good }}
      build_id: perf-good

  bad-wheel:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.bad }}
      build_id: perf-bad

  candidate-wheel:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.candidate != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.candidate }}
      build_id: perf-candidate

  measure:
    needs: [prepare, good-wheel, bad-wheel, candidate-wheel]
    if: always() && needs.prepare.outputs.ready == 'true' && needs.good-wheel.result == 'success' && needs.bad-wheel.result == 'success'
    runs-on: ${{ fromJSON('{"b200":"nvidia-dgx-b200","h100":"linux-gcp-h100","mi350":"linux-fb-triton-mi350-1"}')[inputs.platform] }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: perf-bisect-prepared
          path: evidence
      - name: Verify wheel commits and preserve the benchmark
        env:
          GOOD_COMMIT: ${{ needs.good-wheel.outputs.commit }}
          BAD_COMMIT: ${{ needs.bad-wheel.outputs.commit }}
          CANDIDATE_COMMIT: ${{ needs.candidate-wheel.outputs.commit }}
          CANDIDATE_STATUS: ${{ needs.candidate-wheel.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess

          prepared = json.loads(pathlib.Path('evidence/prepared.json').read_text())
          spec = prepared['spec']
          assert os.environ['GOOD_COMMIT'] == spec['good_sha']
          assert os.environ['BAD_COMMIT'] == spec['bad_sha']
          if os.environ['CANDIDATE_STATUS'] == 'success':
              assert os.environ['CANDIDATE_COMMIT'] == prepared['candidate_sha']
          for sha in prepared['commits']:
              assert re.fullmatch(r'[0-9a-f]{40}', sha)
              subprocess.run(['git', '-C', 'source', 'merge-base', '--is-ancestor', sha, 'origin/main'], check=True)
          harness = pathlib.Path(os.environ['RUNNER_TEMP']) / 'perf-bisect-harness'
          harness.mkdir()
          archive = harness.parent / 'perf-bisect-benchmark.tar'
          with archive.open('wb') as out:
              subprocess.run(['git', '-C', 'source', 'archive', spec['bad_sha'], 'python/test/tlx_benchmark'], stdout=out, check=True)
          subprocess.run(['tar', '-xf', str(archive), '-C', str(harness)], check=True)
          PY
      - uses: ./tooling/.github/actions/setup-test-env
        with:
          backend: ${{ inputs.platform == 'mi350' && 'rocm' || 'cuda' }}
          arch: ${{ inputs.platform == 'mi350' && 'gfx950' || '' }}
          torch: torch==2.14.0
          torch-index-url: ${{ inputs.platform == 'mi350' && 'https://download.pytorch.org/whl/rocm7.2' || 'https://download.pytorch.org/whl/cu130' }}
          packages: numpy pytest torchao
          rocm-lib-path: ''
      - name: Refresh CUDA linker cache
        if: inputs.platform != 'mi350'
        run: sudo ldconfig
      - name: Install good endpoint wheel
        uses: ./tooling/.github/actions/install-prebuilt-triton
        with:
          wheel-url: ${{ needs.good-wheel.outputs.wheel_url }}
          wheel-filename: ${{ needs.good-wheel.outputs.wheel_filename }}
          wheel-sha256: ${{ needs.good-wheel.outputs.wheel_sha256 }}
      - name: Measure good endpoint
        run: |
          python tooling/.github/scripts/tlx_ops_bench_measure_round.py --prepared evidence/prepared.json --role good --source source --harness "${RUNNER_TEMP}/perf-bisect-harness/python/test/tlx_benchmark" --output measurements
          rm -f "${RUNNER_TEMP}"/prebuilt-wheel/*.whl
      - name: Install bad endpoint wheel
        uses: ./tooling/.github/actions/install-prebuilt-triton
        with:
          wheel-url: ${{ needs.bad-wheel.outputs.wheel_url }}
          wheel-filename: ${{ needs.bad-wheel.outputs.wheel_filename }}
          wheel-sha256: ${{ needs.bad-wheel.outputs.wheel_sha256 }}
      - name: Measure bad endpoint
        id: endpoints
        run: |
          python tooling/.github/scripts/tlx_ops_bench_measure_round.py --prepared evidence/prepared.json --role bad --source source --harness "${RUNNER_TEMP}/perf-bisect-harness/python/test/tlx_benchmark" --output measurements
          rm -f "${RUNNER_TEMP}"/prebuilt-wheel/*.whl
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          sys.path.insert(0, 'tooling/.github/scripts')
          from tlx_ops_bench_bisect import check_endpoints
          spec = json.loads(pathlib.Path('evidence/prepared.json').read_text())['spec']
          good = json.loads(pathlib.Path('measurements/good.json').read_text())
          bad = json.loads(pathlib.Path('measurements/bad.json').read_text())
          cutoff, reason = check_endpoints(good, bad, spec['required_ratio'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"reproduced={str(cutoff is not None).lower()}\n")
          if reason:
              print(reason)
          PY
      - name: Install candidate wheel
        if: steps.endpoints.outputs.reproduced == 'true' && needs.candidate-wheel.result == 'success'
        uses: ./tooling/.github/actions/install-prebuilt-triton
        with:
          wheel-url: ${{ needs.candidate-wheel.outputs.wheel_url }}
          wheel-filename: ${{ needs.candidate-wheel.outputs.wheel_filename }}
          wheel-sha256: ${{ needs.candidate-wheel.outputs.wheel_sha256 }}
      - name: Measure candidate
        if: steps.endpoints.outputs.reproduced == 'true' && needs.candidate-wheel.result == 'success'
        run: |
          python tooling/.github/scripts/tlx_ops_bench_measure_round.py --prepared evidence/prepared.json --role candidate --source source --harness "${RUNNER_TEMP}/perf-bisect-harness/python/test/tlx_benchmark" --output measurements
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-bisect-measurements
          path: measurements/*.json
          if-no-files-found: ignore

  advance:
    needs: [prepare, good-wheel, bad-wheel, candidate-wheel, measure]
    if: always() && !cancelled() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: perf-bisect-prepared
          path: evidence
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: perf-bisect-measurements
          path: measurements
      - name: Classify the round and persist the next state
        env:
          GOOD_BUILD: ${{ needs.good-wheel.result }}
          BAD_BUILD: ${{ needs.bad-wheel.result }}
          CANDIDATE_BUILD: ${{ needs.candidate-wheel.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          measurements = {}
          for role in ('good', 'bad', 'candidate'):
              path = pathlib.Path(f'measurements/{role}.json')
              if path.exists():
                  measurements[role] = json.loads(path.read_text())
              elif os.environ[f'{role.upper()}_BUILD'] == 'failure':
                  measurements[role] = {'status': 'build_failed'}
          pathlib.Path('evidence/measurements.json').write_text(json.dumps(measurements))
          subprocess.run(['python3', 'tooling/.github/scripts/tlx_ops_bench_bisect_round.py', 'advance',
                          '--state', 'evidence/prepared.json', '--measurements', 'evidence/measurements.json',
                          '--out', 'evidence/state.json'], check=True)
          PY
      - name: Write the Actions result summary
        run: |
          python3 tooling/.github/scripts/tlx_ops_bench_bisect_summary.py --prepared evidence/prepared.json --state evidence/state.json --measurements evidence/measurements.json
      - name: Report completed cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          state = json.loads(pathlib.Path('evidence/state.json').read_text())
          context_path = pathlib.Path('evidence/inputs.json')
          context = json.loads(context_path.read_text())
          for result in state['results'][context['reported']:]:
              number = int(result['issue_number'])
              lines = [f"Performance bisection result: {result['status']}. [Run and evidence]({run_url}).",
                       f"Case: `{result['key']}`."]
              if result.get('first_bad_sha'):
                  sha = result['first_bad_sha']
                  lines.append(f"First bad commit for the measured case: https://github.com/{repo}/commit/{sha}")
              if result.get('reason'):
                  lines.append(result['reason'])
              subprocess.run(['gh', 'api', f'repos/{repo}/issues/{number}/comments', '--method', 'POST', '--input', '-'],
                             input=json.dumps({'body': '\n\n'.join(lines)}), text=True, check=True)
              context['reported'] += 1
              context_path.write_text(json.dumps(context))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: perf-bisect-state
          path: |
            evidence/state.json
            evidence/inputs.json
            evidence/measurements.json
      - name: Dispatch the next round without holding a GPU runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          state = json.loads(pathlib.Path('evidence/state.json').read_text())
          if state['index'] >= len(state['specs']):
              print('All cases have a result.')
          else:
              context = json.loads(pathlib.Path('evidence/inputs.json').read_text())
              inputs = {key: context[key] for key in ('source_run_id', 'artifact_name', 'platform')}
              inputs['state_run_id'] = os.environ['GITHUB_RUN_ID']
              workflow = os.environ['GITHUB_WORKFLOW_REF'].split('@', 1)[0].rsplit('/', 1)[-1]
              repo = os.environ['GITHUB_REPOSITORY']
              subprocess.run(['gh', 'api', f'repos/{repo}/actions/workflows/{workflow}/dispatches', '--method', 'POST', '--input', '-'],
                             input=json.dumps({'ref': os.environ['GITHUB_REF_NAME'], 'inputs': inputs}), text=True, check=True)
          PY
