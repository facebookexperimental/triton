name: Nightly TLX.ops Bench
# Evidence-only run for the manually filed regression issues #4990-#4994. It runs no benchmark: it uploads their
# bisection specs so the production bisect workflow on main accepts this run as its evidence producer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: tlx-perf-regressions-manual
          path: .github/perf-bisect-evidence/regressions.json
