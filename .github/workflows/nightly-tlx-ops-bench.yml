name: Nightly TLX.ops Bench
# Runs the tlx.ops perf suite (python/test/tlx_benchmark) on B200, H100 and
# MI350 for a main commit picked from gpu-tests.yml's push runs
# (tlx_ops_bench_pick.py). It installs the wheel build.yml makes for that
# commit, usually the one its GPU tests ran on. The commit's TLX test results
# are recorded with each platform's summary, not required to be green.
# GPU_CI_SKIP_PLATFORMS (for example "b200") skips a platform here too.
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Night to bench, YYYYMMDD (blank = today); picks main as of that night's Pacific midnight"
        required: false
        default: ""
      sha:
        description: "Main commit to bench instead of picking one"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-tlx-ops-bench
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.repository_owner == 'facebookexperimental' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.pick.outputs.version }}
      sha: ${{ steps.pick.outputs.sha }}
      run_url: ${{ steps.pick.outputs.run_url }}
      ci_b200: ${{ steps.pick.outputs.ci_b200 }}
      ci_h100: ${{ steps.pick.outputs.ci_h100 }}
      ci_mi350: ${{ steps.pick.outputs.ci_mi350 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the commit to bench
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SHA: ${{ inputs.sha }}
          SKIP_PLATFORMS: ${{ vars.GPU_CI_SKIP_PLATFORMS }}
        run: python3 .github/scripts/tlx_ops_bench_pick.py

  build:
    needs: resolve
    if: needs.resolve.outputs.version != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  b200:
    needs: [resolve, build]
    if: needs.resolve.outputs.version != '' && !contains(vars.GPU_CI_SKIP_PLATFORMS, 'b200')
    permissions:
      id-token: write
      contents: write   # publish: the dashboard's release
      issues: write
      actions: write
    uses: ./.github/workflows/_tlx-ops-bench.yml
    with:
      platform: b200
      runner: nvidia-dgx-b200
      torch_index: https://download.pytorch.org/whl/cu130
      version: ${{ needs.resolve.outputs.version }}
      sha: ${{ needs.resolve.outputs.sha }}
      wheel_url: ${{ needs.build.outputs.wheel_url }}
      wheel_filename: ${{ needs.build.outputs.wheel_filename }}
      wheel_sha256: ${{ needs.build.outputs.wheel_sha256 }}
      ci_status: ${{ needs.resolve.outputs.ci_b200 }}
      ci_run: ${{ needs.resolve.outputs.run_url }}

  h100:
    needs: [resolve, build]
    if: needs.resolve.outputs.version != '' && !contains(vars.GPU_CI_SKIP_PLATFORMS, 'h100')
    permissions:
      id-token: write
      contents: write   # publish: the dashboard's release
      issues: write
      actions: write
    uses: ./.github/workflows/_tlx-ops-bench.yml
    with:
      platform: h100
      runner: linux-gcp-h100
      torch_index: https://download.pytorch.org/whl/cu130
      version: ${{ needs.resolve.outputs.version }}
      sha: ${{ needs.resolve.outputs.sha }}
      wheel_url: ${{ needs.build.outputs.wheel_url }}
      wheel_filename: ${{ needs.build.outputs.wheel_filename }}
      wheel_sha256: ${{ needs.build.outputs.wheel_sha256 }}
      ci_status: ${{ needs.resolve.outputs.ci_h100 }}
      ci_run: ${{ needs.resolve.outputs.run_url }}

  mi350:
    needs: [resolve, build]
    if: needs.resolve.outputs.version != '' && !contains(vars.GPU_CI_SKIP_PLATFORMS, 'mi350')
    permissions:
      id-token: write
      contents: write   # publish: the dashboard's release
      issues: write
      actions: write
    uses: ./.github/workflows/_tlx-ops-bench.yml
    with:
      platform: mi350
      runner: linux-fb-triton-mi350-1
      torch_index: https://download.pytorch.org/whl/rocm7.2
      version: ${{ needs.resolve.outputs.version }}
      sha: ${{ needs.resolve.outputs.sha }}
      wheel_url: ${{ needs.build.outputs.wheel_url }}
      wheel_filename: ${{ needs.build.outputs.wheel_filename }}
      wheel_sha256: ${{ needs.build.outputs.wheel_sha256 }}
      ci_status: ${{ needs.resolve.outputs.ci_mi350 }}
      ci_run: ${{ needs.resolve.outputs.run_url }}

  prune:
    needs: [resolve, b200, h100, mi350]
    if: always() && needs.resolve.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep the last 60 nights on the tlx-ops-bench release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/tlx_ops_bench_dashboard.py prune 60
