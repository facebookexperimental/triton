name: H100 measured result summaries

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Download the completed recovery test specification
        uses: actions/download-artifact@v4
        with:
          name: recovery-spec
          path: recovery
          run-id: 42787309659
          github-token: ${{ github.token }}
      - name: Download the completed recovery measurements
        uses: actions/download-artifact@v4
        with:
          name: recovery-measurements
          path: recovery
          run-id: 42787309659
          github-token: ${{ github.token }}
      - name: Download the completed bisect specification
        uses: actions/download-artifact@v4
        with:
          name: perf-bisect-prepared
          path: bisect
          run-id: 42781020562
          github-token: ${{ github.token }}
      - name: Download the completed bisect result
        uses: actions/download-artifact@v4
        with:
          name: perf-bisect-state
          path: bisect
          run-id: 42781020562
          github-token: ${{ github.token }}
      - name: Write the existing measured results to the Actions summary
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          recovery = pathlib.Path('recovery')
          (recovery / 'measurements.json').write_text(json.dumps({role: json.loads((recovery / f'{role}.json').read_text()) for role in ('good', 'bad')}))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('These summaries use artifacts from completed GPU runs. This run performed no builds or GPU measurements.\n\n')
              summary.write('[Original recovery run](https://github.com/facebookexperimental/triton/actions/runs/42787309659) and [original bisect run](https://github.com/facebookexperimental/triton/actions/runs/42781020562).\n\n')
          PY
          python3 tooling/.github/scripts/tlx_ops_bench_bisect_summary.py --prepared recovery/prepared.json --measurements recovery/measurements.json --recovery-baseline 330.69093014942086
          python3 tooling/.github/scripts/tlx_ops_bench_bisect_summary.py --prepared bisect/prepared.json --state bisect/state.json --measurements bisect/measurements.json
