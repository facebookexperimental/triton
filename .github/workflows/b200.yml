name: Meta Triton B200 Tests
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit used to build the wheel
        required: true
        type: string
      plan:
        description: Explicit test work selected by the CPU planner
        required: true
        type: string
      wheel_url:
        required: true
        type: string
      wheel_filename:
        required: true
        type: string
      wheel_sha256:
        required: true
        type: string

env:
  # Scopes the issue titles. Off main it names the branch, as ci-issues.yml does.
  GPU_WORKFLOW_NAME: Meta Triton B200 Tests${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
  MAX_JOBS: 32
  TORCHINDUCTOR_TLX_MODE: "off"
  CCACHE_DIR: /tmp/fbtriton-ccache
  CCACHE_MAXSIZE: 2G

jobs:
  b200-tlx-test:
    if: ${{ !cancelled() && github.repository_owner == 'facebookexperimental' && (fromJSON(inputs.plan).core.files[0] != null || fromJSON(inputs.plan).correctness.files[0] != null || fromJSON(inputs.plan).codegen.files[0] != null) }}
    runs-on: nvidia-dgx-b200
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 240
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Install test dependencies
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install pytest pytest-xdist
      - name: Install torchao
        timeout-minutes: 10
        uses: ./.github/actions/install-torchao
        with:
          platform: b200
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        env:
          # Activate the runner environment in each composite-action shell.
          BASH_ENV: ${{ env.SETUP_SCRIPT }}
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Run TLX core tests
        id: run_core_tests
        if: fromJSON(inputs.plan).core.files[0] != null
        timeout-minutes: 90
        uses: ./.github/actions/run-selected-tests
        with:
          suite: ${{ toJSON(fromJSON(inputs.plan).core) }}
          workers: "4"
          junit: /tmp/tlx-core.xml
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Run TLX tutorial correctness tests
        id: run_correctness_tests
        if: fromJSON(inputs.plan).correctness.files[0] != null
        timeout-minutes: 30
        uses: ./.github/actions/run-selected-tests
        with:
          suite: ${{ toJSON(fromJSON(inputs.plan).correctness) }}
          workers: "4"
          junit: /tmp/tlx-correctness.xml
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Run device-agnostic TLX codegen tests
        id: run_codegen_tests
        if: fromJSON(inputs.plan).codegen.files[0] != null
        timeout-minutes: 30
        uses: ./.github/actions/run-selected-tests
        with:
          suite: ${{ toJSON(fromJSON(inputs.plan).codegen) }}
          workers: "1"
          junit: /tmp/tlx-codegen.xml
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Parse test failures (TLX)
        id: parse
        if: always()
        uses: ./.github/actions/parse-test-failures
        with:
          workflow: ${{ env.GPU_WORKFLOW_NAME }}
          job: b200-tlx-test
          failed: ${{ job.status != 'success' }}
          bucket: b200-tlx-job-failed
          junit: ${{ fromJSON(inputs.plan).core.files[0] != null && '/tmp/tlx-core.xml' || '' }} ${{ fromJSON(inputs.plan).correctness.files[0] != null && '/tmp/tlx-correctness.xml' || '' }} ${{ fromJSON(inputs.plan).codegen.files[0] != null && '/tmp/tlx-codegen.xml' || '' }}
          budget: /tmp/tlx-core.xml=90 /tmp/tlx-correctness.xml=30 /tmp/tlx-codegen.xml=30
          setup-script: ${{ env.SETUP_SCRIPT }}

  b200-torchtlx-test:
    # Temporarily disabled because the TorchTLX environment is brittle.
    if: ${{ false }}
    runs-on: nvidia-dgx-b200
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
      TORCHINDUCTOR_TLX_MODE: "allow"
      TORCHTLX_ARCH: sm100
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Create isolated TorchTLX environment
        run: |
          set -eux
          . "${SETUP_SCRIPT}"
          BASE_PYTHON="$(command -v python3)"
          BASE_SITE="$("${BASE_PYTHON}" -c 'import site; print(site.getsitepackages()[0])')"
          TORCHTLX_VENV="${RUNNER_TEMP}/torchtlx-venv"

          # The runner's meta-triton environment carries Meta's refreshed PyTorch.
          # Expose it read-only to a job-local venv; installs below then land in the
          # venv and shadow bundled Triton without mutating the shared environment.
          uv venv --python "${BASE_PYTHON}" "${TORCHTLX_VENV}"
          TORCHTLX_PYTHON="${TORCHTLX_VENV}/bin/python"
          TORCHTLX_SITE="$("${TORCHTLX_PYTHON}" -c 'import site; print(site.getsitepackages()[0])')"
          printf '%s\n' "${BASE_SITE}" > "${TORCHTLX_SITE}/meta-triton.pth"

          "${TORCHTLX_PYTHON}" - <<'PY'
          import torch
          from torch._inductor import config

          print(f"torch -> {torch.__version__} ({torch.__file__})")
          if not hasattr(config.triton, "tlx_mode"):
              raise RuntimeError(
                  "the pre-provisioned meta-triton PyTorch has no TorchTLX "
                  "Inductor support (torch._inductor.config.triton.tlx_mode)"
              )
          PY
      - name: Compile Triton
        run: |
          set -eux
          . "${SETUP_SCRIPT}"
          TORCHTLX_PYTHON="${RUNNER_TEMP}/torchtlx-venv/bin/python"
          uv pip install --python "${TORCHTLX_PYTHON}" \
            -r python/requirements.txt -r python/test-requirements.txt
          uv pip install --python "${TORCHTLX_PYTHON}" --reinstall --no-deps \
            -e . --no-build-isolation
          uv pip install --python "${TORCHTLX_PYTHON}" pytest expecttest
          "${TORCHTLX_PYTHON}" - <<'PY'
          import torch
          import triton

          print(f"torch  -> {torch.__version__} ({torch.__file__})")
          print(f"triton -> {triton.__file__}")
          PY
      - name: Run TorchTLX template + fusion tests
        id: run_torchtlx_tests
        timeout-minutes: 40
        run: |
          . "${SETUP_SCRIPT}"
          export PYTHON="${RUNNER_TEMP}/torchtlx-venv/bin/python"
          bash scripts/run_torchtlx_tests.sh --junitxml=/tmp/torchtlx.xml
      - name: Run TorchTLX mm perf bench
        id: run_torchtlx_perf
        if: always() && github.event_name == 'schedule'
        timeout-minutes: 40
        run: |
          . "${SETUP_SCRIPT}"
          export PYTHON="${RUNNER_TEMP}/torchtlx-venv/bin/python"
          bash scripts/run_torchtlx_tests.sh --perf \
            --json /tmp/mm_torchtlx.json --junitxml=/tmp/torchtlx_perf.xml
      - name: Upload TorchTLX perf artifact
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: b200-torchtlx-mm-perf
          path: /tmp/mm_torchtlx.json
          if-no-files-found: ignore
      - name: Parse test failures (TorchTLX)
        id: parse
        if: always()
        uses: ./.github/actions/parse-test-failures
        with:
          workflow: ${{ env.GPU_WORKFLOW_NAME }}
          job: b200-torchtlx-test
          failed: ${{ steps.run_torchtlx_tests.outcome != 'success' || steps.run_torchtlx_perf.outcome != 'success' }}
          bucket: b200-torchtlx-job-failed
          junit: /tmp/torchtlx.xml /tmp/torchtlx_perf.xml
          setup-script: ${{ env.SETUP_SCRIPT }}

  b200-gluon-test:
    if: ${{ !cancelled() && github.repository_owner == 'facebookexperimental' && (fromJSON(inputs.plan).gluon.files[0] != null) }}
    runs-on: nvidia-dgx-b200
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Install test dependencies
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install pytest expecttest
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        env:
          # Activate the runner environment in each composite-action shell.
          BASH_ENV: ${{ env.SETUP_SCRIPT }}
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Run Gluon tests (python/test/gluon)
        id: run_gluon
        if: fromJSON(inputs.plan).gluon.files[0] != null
        timeout-minutes: 50
        uses: ./.github/actions/run-selected-tests
        with:
          suite: ${{ toJSON(fromJSON(inputs.plan).gluon) }}
          workers: "1"
          junit: /tmp/gluon.xml
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Parse test failures (Gluon)
        id: parse
        if: always()
        uses: ./.github/actions/parse-test-failures
        with:
          workflow: ${{ env.GPU_WORKFLOW_NAME }}
          job: b200-gluon-test
          failed: ${{ job.status != 'success' }}
          bucket: b200-gluon-job-failed
          junit: /tmp/gluon.xml
          budget: /tmp/gluon.xml=50
          setup-script: ${{ env.SETUP_SCRIPT }}

  # File and close failure issues; ci-issues.yml decides which runs file.
  issues-b200-tlx:
    needs: b200-tlx-test
    if: always()
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/ci-issues.yml
    with:
      workflow: Meta Triton B200 Tests
      job: b200-tlx-test
      result: ${{ needs.b200-tlx-test.result }}
      failures: ${{ needs.b200-tlx-test.outputs.failures }}
      sha: ${{ inputs.ref }}
      platform: b200

  issues-b200-torchtlx:
    needs: b200-torchtlx-test
    if: always()
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/ci-issues.yml
    with:
      workflow: Meta Triton B200 Tests
      job: b200-torchtlx-test
      result: ${{ needs.b200-torchtlx-test.result }}
      failures: ${{ needs.b200-torchtlx-test.outputs.failures }}
      sha: ${{ inputs.ref }}
      platform: b200

  issues-b200-gluon:
    needs: b200-gluon-test
    if: always()
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/ci-issues.yml
    with:
      workflow: Meta Triton B200 Tests
      job: b200-gluon-test
      result: ${{ needs.b200-gluon-test.result }}
      failures: ${{ needs.b200-gluon-test.outputs.failures }}
      sha: ${{ inputs.ref }}
      platform: b200
