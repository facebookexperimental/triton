name: Meta Triton B200 Tests
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit used to build the wheel
        required: true
        type: string
      wheel_url:
        required: true
        type: string
      wheel_filename:
        required: true
        type: string
      wheel_sha256:
        required: true
        type: string

env:
  # Issue-title scope. Off main it names the branch, so branches never share issues.
  GPU_WORKFLOW_NAME: Meta Triton B200 Tests${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
  MAX_JOBS: 32
  TORCHINDUCTOR_TLX_MODE: "off"
  CCACHE_DIR: /tmp/fbtriton-ccache
  CCACHE_MAXSIZE: 2G

jobs:
  b200-tlx-test:
    if: "!cancelled() && github.repository_owner == 'facebookexperimental'"
    runs-on: nvidia-dgx-b200
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 240
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Install test dependencies
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install pytest
      - name: Install torchao
        timeout-minutes: 10
        uses: ./.github/actions/install-torchao
        with:
          platform: b200
          setup-script: ${{ env.SETUP_SCRIPT }}
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        env:
          # Activate the runner environment in each composite-action shell.
          BASH_ENV: ${{ env.SETUP_SCRIPT }}
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Select kernel-affected tests
        id: select
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/select-kernel-tests
      - name: Run TLX core tests
        id: run_core_tests
        timeout-minutes: 90
        run: |
          . "${SETUP_SCRIPT}"
          shopt -s nullglob
          FILES=(
            python/test/unit/language/test_tlx_*_any.py
            python/test/unit/language/test_tlx_*sm90up*.py
            python/test/unit/language/test_tlx_*sm100*.py
            python/test/unit/tlx_ops/test_*_sm100.py
          )
          # TorchTLX depends on floating PyTorch Inductor APIs and runs in the
          # separate b200-torchtlx-test job below, not this pinned-PyTorch job.
          TLX_FILES=()
          for file in "${FILES[@]}"; do
            [[ "${file}" == */test_torchtlx_* ]] || TLX_FILES+=("${file}")
          done
          FILES=("${TLX_FILES[@]}")
          [ ${#FILES[@]} -gt 0 ] || { echo "no TLX core test files matched"; exit 1; }
          if [ "${{ steps.select.outputs.kernel_only }}" = "true" ]; then
            mapfile -t FILES < <(printf '%s\n' "${FILES[@]}" | grep -Fxf /tmp/affected.txt || true)
            echo "kernel-only PR: ${#FILES[@]} TLX core file(s) touch the changed kernel(s)"
            [ ${#FILES[@]} -gt 0 ] || { echo "no affected TLX core tests; skipping"; exit 0; }
          fi
          echo "b200 collects:" "${FILES[@]}"
          # Log runner size and the pod's memory peak, pass or fail.
          trap 'echo "runner: nproc=$(nproc) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null) memory.peak_mib=$(( $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0) / 1048576 ))"' EXIT
          PYTHONPATH="${GITHUB_WORKSPACE}/python/test/unit/tlx_ops${PYTHONPATH:+:${PYTHONPATH}}" python -m pytest "${FILES[@]}" --import-mode=importlib -v --durations=25 --junitxml=/tmp/tlx-core.xml
      - name: Run TLX tutorial correctness tests
        id: run_correctness_tests
        timeout-minutes: 30
        run: |
          . "${SETUP_SCRIPT}"
          if [ "${{ steps.select.outputs.kernel_only }}" = "true" ]; then
            MODE="${{ steps.select.outputs.correctness_mode }}"
            if [ "$MODE" = "skip" ]; then
              echo "kernel-only PR: no tutorial correctness tests touch the changed kernel(s); skipping"
              exit 0
            fi
            if [ "$MODE" = "filtered" ]; then
              echo "kernel-only PR: correctness filter: ${{ steps.select.outputs.correctness_k }}"
              python -m pytest third_party/tlx/tutorials/testing/test_correctness.py -k "${{ steps.select.outputs.correctness_k }}" -v --junitxml=/tmp/tlx-correctness.xml
              exit 0
            fi
          fi
          python -m pytest third_party/tlx/tutorials/testing/test_correctness.py -v --junitxml=/tmp/tlx-correctness.xml
      - name: Run device-agnostic TLX codegen tests
        id: run_codegen_tests
        timeout-minutes: 30
        run: |
          . "${SETUP_SCRIPT}"
          if [ "${{ steps.select.outputs.kernel_only }}" = "true" ] && ! grep -qxF "python/test/unit/language/test_tlx_codegen.py" /tmp/affected.txt; then
            echo "kernel-only PR: codegen tests do not touch the changed kernel(s); skipping"
            exit 0
          fi
          python -m pytest python/test/unit/language/test_tlx_codegen.py --import-mode=importlib -v --junitxml=/tmp/tlx-codegen.xml
      - name: Collect nightly failures (TLX)
        id: parse
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))))
        run: |
          . "${SETUP_SCRIPT}"
          FAILED_FLAG=""
          if [[ "${{ steps.run_core_tests.outcome }}" != "success" || "${{ steps.run_correctness_tests.outcome }}" != "success" || "${{ steps.run_codegen_tests.outcome }}" != "success" ]]; then
            FAILED_FLAG="--failed --bucket b200-tlx-job-failed"
          fi
          python3 .github/scripts/parse_junit_failures.py \
            --junit /tmp/tlx-core.xml /tmp/tlx-correctness.xml /tmp/tlx-codegen.xml \
            --budget /tmp/tlx-core.xml=90 --budget /tmp/tlx-correctness.xml=30 --budget /tmp/tlx-codegen.xml=30 \
            --workflow "${GPU_WORKFLOW_NAME}" \
            --job "b200-tlx-test" \
            ${FAILED_FLAG}

  b200-torchtlx-test:
    # Temporarily disabled because the TorchTLX environment is brittle.
    if: ${{ false }}
    runs-on: nvidia-dgx-b200
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
      TORCHINDUCTOR_TLX_MODE: "allow"
      TORCHTLX_ARCH: sm100
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Create isolated TorchTLX environment
        run: |
          set -eux
          . "${SETUP_SCRIPT}"
          BASE_PYTHON="$(command -v python3)"
          BASE_SITE="$("${BASE_PYTHON}" -c 'import site; print(site.getsitepackages()[0])')"
          TORCHTLX_VENV="${RUNNER_TEMP}/torchtlx-venv"

          # The runner's meta-triton environment carries Meta's refreshed PyTorch.
          # Expose it read-only to a job-local venv; installs below then land in the
          # venv and shadow bundled Triton without mutating the shared environment.
          uv venv --python "${BASE_PYTHON}" "${TORCHTLX_VENV}"
          TORCHTLX_PYTHON="${TORCHTLX_VENV}/bin/python"
          TORCHTLX_SITE="$("${TORCHTLX_PYTHON}" -c 'import site; print(site.getsitepackages()[0])')"
          printf '%s\n' "${BASE_SITE}" > "${TORCHTLX_SITE}/meta-triton.pth"

          "${TORCHTLX_PYTHON}" - <<'PY'
          import torch
          from torch._inductor import config

          print(f"torch -> {torch.__version__} ({torch.__file__})")
          if not hasattr(config.triton, "tlx_mode"):
              raise RuntimeError(
                  "the pre-provisioned meta-triton PyTorch has no TorchTLX "
                  "Inductor support (torch._inductor.config.triton.tlx_mode)"
              )
          PY
      - name: Compile Triton
        run: |
          set -eux
          . "${SETUP_SCRIPT}"
          TORCHTLX_PYTHON="${RUNNER_TEMP}/torchtlx-venv/bin/python"
          uv pip install --python "${TORCHTLX_PYTHON}" \
            -r python/requirements.txt -r python/test-requirements.txt
          uv pip install --python "${TORCHTLX_PYTHON}" --reinstall --no-deps \
            -e . --no-build-isolation
          uv pip install --python "${TORCHTLX_PYTHON}" pytest expecttest
          "${TORCHTLX_PYTHON}" - <<'PY'
          import torch
          import triton

          print(f"torch  -> {torch.__version__} ({torch.__file__})")
          print(f"triton -> {triton.__file__}")
          PY
      - name: Run TorchTLX template + fusion tests
        id: run_torchtlx_tests
        timeout-minutes: 40
        run: |
          . "${SETUP_SCRIPT}"
          export PYTHON="${RUNNER_TEMP}/torchtlx-venv/bin/python"
          bash scripts/run_torchtlx_tests.sh --junitxml=/tmp/torchtlx.xml
      - name: Run TorchTLX mm perf bench
        id: run_torchtlx_perf
        if: always() && github.event_name == 'schedule'
        timeout-minutes: 40
        run: |
          . "${SETUP_SCRIPT}"
          export PYTHON="${RUNNER_TEMP}/torchtlx-venv/bin/python"
          bash scripts/run_torchtlx_tests.sh --perf \
            --json /tmp/mm_torchtlx.json --junitxml=/tmp/torchtlx_perf.xml
      - name: Upload TorchTLX perf artifact
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: b200-torchtlx-mm-perf
          path: /tmp/mm_torchtlx.json
          if-no-files-found: ignore
      - name: Collect nightly failures (TorchTLX)
        id: parse
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))))
        run: |
          . "${SETUP_SCRIPT}"
          # The perf bench runs on scheduled runs only; on a push it is skipped and writes no XML.
          PERF="${{ steps.run_torchtlx_perf.outcome }}"
          JUNIT=(/tmp/torchtlx.xml)
          [[ "${PERF}" == skipped ]] || JUNIT+=(/tmp/torchtlx_perf.xml)
          FAILED_FLAG=""
          if [[ "${{ steps.run_torchtlx_tests.outcome }}" != "success" || \
                ( "${PERF}" != "success" && "${PERF}" != "skipped" ) ]]; then
            FAILED_FLAG="--failed --bucket b200-torchtlx-job-failed"
          fi
          python3 .github/scripts/parse_junit_failures.py \
            --junit "${JUNIT[@]}" \
            --workflow "${GPU_WORKFLOW_NAME}" \
            --job "b200-torchtlx-test" \
            ${FAILED_FLAG}

  b200-gluon-test:
    if: "!cancelled() && github.repository_owner == 'facebookexperimental'"
    runs-on: nvidia-dgx-b200
    env:
      CONDA_ENV: meta-triton
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
      - name: Tune Nvidia GPU
        run: |
          sudo nvidia-smi -pm 1
          sudo ldconfig
          nvidia-smi
      - name: Install test dependencies
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install pytest expecttest
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        env:
          # Activate the runner environment in each composite-action shell.
          BASH_ENV: ${{ env.SETUP_SCRIPT }}
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Select kernel-affected tests
        id: select
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/select-kernel-tests
      - name: Run Gluon tests (python/test/gluon)
        id: run_gluon
        timeout-minutes: 50
        run: |
          . "${SETUP_SCRIPT}"
          if [ "${{ steps.select.outputs.kernel_only }}" = "true" ] && ! grep -q "^python/test/gluon/" /tmp/affected.txt; then
            echo "kernel-only PR: no Gluon tests touch the changed kernel(s); skipping"
            exit 0
          fi
          python -m pytest python/test/gluon/ --import-mode=importlib -v --junitxml=/tmp/gluon.xml
      - name: Collect nightly failures (Gluon)
        id: parse
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))))
        run: |
          . "${SETUP_SCRIPT}"
          FAILED_FLAG=""
          if [[ "${{ steps.run_gluon.outcome }}" != "success" ]]; then
            FAILED_FLAG="--failed --bucket b200-gluon-job-failed"
          fi
          python3 .github/scripts/parse_junit_failures.py \
            --junit /tmp/gluon.xml \
            --budget /tmp/gluon.xml=50 \
            --workflow "${GPU_WORKFLOW_NAME}" \
            --job "b200-gluon-test" \
            ${FAILED_FLAG}

  report-b200-tlx:
    needs: b200-tlx-test
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))) && needs.b200-tlx-test.outputs.failures != '' && needs.b200-tlx-test.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.b200-tlx-test.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: Meta Triton B200 Tests${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: ${{ github.ref }}
      sha: ${{ inputs.ref }}
      event_name: ${{ github.event_name }}
      run_attempt: ${{ github.run_attempt }}
      summary: ${{ matrix.item.summary }}
      repro: ${{ matrix.item.repro }}
      external_dep: ${{ matrix.item.external_dep }}
      external_dep_reason: ${{ matrix.item.external_dep_reason }}
      platform: b200

  report-b200-torchtlx:
    needs: b200-torchtlx-test
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))) && needs.b200-torchtlx-test.outputs.failures != '' && needs.b200-torchtlx-test.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.b200-torchtlx-test.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: Meta Triton B200 Tests${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: ${{ github.ref }}
      sha: ${{ inputs.ref }}
      event_name: ${{ github.event_name }}
      run_attempt: ${{ github.run_attempt }}
      summary: ${{ matrix.item.summary }}
      repro: ${{ matrix.item.repro }}

  report-b200-gluon:
    needs: b200-gluon-test
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))) && needs.b200-gluon-test.outputs.failures != '' && needs.b200-gluon-test.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.b200-gluon-test.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: Meta Triton B200 Tests${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: ${{ github.ref }}
      sha: ${{ inputs.ref }}
      event_name: ${{ github.event_name }}
      run_attempt: ${{ github.run_attempt }}
      summary: ${{ matrix.item.summary }}
      repro: ${{ matrix.item.repro }}
      external_dep: ${{ matrix.item.external_dep }}
      external_dep_reason: ${{ matrix.item.external_dep_reason }}
      platform: b200

  reconcile-b200-tlx:
    needs: b200-tlx-test
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))) && (needs.b200-tlx-test.result == 'success' || needs.b200-tlx-test.result == 'failure')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/reconcile-nightly-issues.yml
    with:
      workflow_name: Meta Triton B200 Tests${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
      job_name: b200-tlx-test
      failures: ${{ needs.b200-tlx-test.outputs.failures }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  reconcile-b200-torchtlx:
    needs: b200-torchtlx-test
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))) && (needs.b200-torchtlx-test.result == 'success' || needs.b200-torchtlx-test.result == 'failure')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/reconcile-nightly-issues.yml
    with:
      workflow_name: Meta Triton B200 Tests${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
      job_name: b200-torchtlx-test
      failures: ${{ needs.b200-torchtlx-test.outputs.failures }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  reconcile-b200-gluon:
    needs: b200-gluon-test
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))) && (needs.b200-gluon-test.result == 'success' || needs.b200-gluon-test.result == 'failure')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/reconcile-nightly-issues.yml
    with:
      workflow_name: Meta Triton B200 Tests${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
      job_name: b200-gluon-test
      failures: ${{ needs.b200-gluon-test.outputs.failures }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
