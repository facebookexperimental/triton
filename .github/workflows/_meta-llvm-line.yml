name: Meta LLVM update (one line)
# Called by meta-llvm-update.yml once per release line. Pushing the bump branch
# starts the line's GPU workflows on it (their push trigger); the updater turns
# their result into the line's issue on a later run.
on:
  workflow_call:
    inputs:
      target:           { type: string, required: true }
      fork_branch:      { type: string, required: true }
      verify_workflows: { type: string, required: true }
      dry_run:          { type: boolean, required: false, default: false }

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check out updater scripts (default branch)
        uses: actions/checkout@v4
        with:
          path: updater
          sparse-checkout: .github/scripts

      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          path: target
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: cmake

      - name: Update bump and issue
        working-directory: target
        env:
          # git push uses the app token from the checkout above: its push starts the GPU
          # workflows, a GITHUB_TOKEN push would not. The app cannot comment on issues, so
          # gh (reads and issue/PR writes) uses GITHUB_TOKEN.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 ../updater/.github/scripts/meta_llvm_update.py \
            --target "${{ inputs.target }}" \
            --fork-branch "${{ inputs.fork_branch }}" \
            --verify-workflows "${{ inputs.verify_workflows }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
