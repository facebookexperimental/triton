name: Meta LLVM build requests

on:
  push:
    branches: [main]
    paths:
      - cmake/meta-llvm-build-info.json
      - cmake/meta-amd-llvm-build-info.json
  pull_request:
    paths:
      - cmake/meta-llvm-build-info.json
      - cmake/meta-amd-llvm-build-info.json
      - .github/workflows/meta-llvm-build-trigger.yml
      - .github/scripts/select_meta_llvm_builds.py
      - .github/scripts/test_select_meta_llvm_builds.py
  workflow_dispatch:
    inputs:
      kind:
        description: Build requests to run from the manifests
        type: choice
        default: all
        options: [all, core, amd]
      publish:
        description: Publish immutable GitHub Release assets
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      requests: ${{ steps.requests.outputs.requests }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test build-request selection
        run: python3 -m unittest discover -s .github/scripts -p test_select_meta_llvm_builds.py -v
      - name: Select build requests
        if: github.event_name != 'pull_request'
        id: requests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          KIND: ${{ inputs.kind }}
        run: python3 .github/scripts/select_meta_llvm_builds.py

  build:
    name: Build requested ${{ matrix.request.kind }} SDK
    needs: select
    if: github.event_name != 'pull_request' && needs.select.outputs.requests != '[]'
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        request: ${{ fromJSON(needs.select.outputs.requests) }}
    uses: ./.github/workflows/meta-llvm-build.yml
    with:
      kind: ${{ matrix.request.kind }}
      llvm_sha: ${{ matrix.request.llvm_sha }}
      build_number: ${{ matrix.request.build_number }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
