name: Pre-Commit Check

on:
  workflow_call:

jobs:
  pre-commit:
    name: pre-commit (code formatting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Compute hash of pre-commit config
        id: cache-key
        run: |
          echo "pre_commit_hash=$(sha256sum .pre-commit-config.yaml | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT
        shell: bash
      - name: Cache pre-commit's cache dir
        uses: actions/cache@v4
        with:
          # Note that we cannot use environment variables here given there is
          # no shell to interpret them in the paths.
          path: |
            ~/.cache/pre-commit
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.pre_commit_hash }}
      - name: Check pre-commit
        id: precommit
        # Formatting issues are reported as a warning, not a hard failure, so
        # they never block a PR. The "Pre-commit warning" step below is the
        # marker other workflows key off of (see pre-commit-autofix.yml).
        continue-on-error: true
        run: |
          python3 -m pip install --upgrade pre-commit
          python3 -m pre_commit run --all-files --verbose
      - name: Pre-commit warning
        if: steps.precommit.outcome == 'failure'
        run: |
          echo "::warning title=Pre-commit::Formatting issues detected. This is a warning, not a failure — comment /fix-precommit on the PR to fix automatically."
          {
            echo "### :warning: Pre-commit — formatting issues detected (non-blocking)"
            echo ""
            echo "To fix automatically, comment \`/fix-precommit\` on the PR."
            echo "To fix locally: \`pre-commit run --all-files && git add -A && git commit -m 'fix formatting' && git push\`"
            echo ""
            echo "<details><summary>Diff of required changes</summary>"
            echo ""
            echo '```diff'
            git diff
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
