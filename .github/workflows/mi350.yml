name: Meta Triton MI350 Tests
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit used to build the wheel
        required: true
        type: string
      plan:
        description: Explicit test work selected by the CPU planner
        required: true
        type: string
      wheel_url:
        required: true
        type: string
      wheel_filename:
        required: true
        type: string
      wheel_sha256:
        required: true
        type: string

env:
  # Scopes the issue titles. Off main it names the branch, as ci-issues.yml does.
  GPU_WORKFLOW_NAME: Meta Triton MI350 Tests${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
  TORCHINDUCTOR_TLX_MODE: "off"
  # Import test files by path, not by prepending their directories to
  # sys.path, so same-named test modules in different directories do not
  # collide (the perf suite failed with ImportError without it, #4001).
  PYTEST_ADDOPTS: --import-mode=importlib

jobs:
  mi350-tlx-test:
    if: ${{ !cancelled() && github.repository_owner == 'facebookexperimental' && (fromJSON(inputs.plan).core.files[0] != null || fromJSON(inputs.plan).correctness.files[0] != null || fromJSON(inputs.plan).codegen.files[0] != null) }}
    runs-on: linux-fb-triton-mi350-1
    timeout-minutes: 240
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up test environment
        timeout-minutes: 30
        uses: ./.github/actions/setup-test-env
        with:
          backend: rocm
          arch: gfx950
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Run TLX core tests
        id: run_core_tests
        if: fromJSON(inputs.plan).core.files[0] != null
        timeout-minutes: 90
        uses: ./.github/actions/run-selected-tests
        with:
          suite: ${{ toJSON(fromJSON(inputs.plan).core) }}
          workers: "4"
          junit: /tmp/tlx-core.xml
      - name: Run TLX tutorial correctness tests
        id: run_correctness_tests
        if: fromJSON(inputs.plan).correctness.files[0] != null
        timeout-minutes: 30
        uses: ./.github/actions/run-selected-tests
        with:
          suite: ${{ toJSON(fromJSON(inputs.plan).correctness) }}
          workers: "4"
          junit: /tmp/tlx-correctness.xml
      - name: Parse test failures (TLX)
        id: parse
        if: always()
        uses: ./.github/actions/parse-test-failures
        with:
          workflow: ${{ env.GPU_WORKFLOW_NAME }}
          job: mi350-tlx-test
          failed: ${{ job.status != 'success' }}
          bucket: mi350-tlx-job-failed
          junit: ${{ fromJSON(inputs.plan).core.files[0] != null && '/tmp/tlx-core.xml' || '' }} ${{ fromJSON(inputs.plan).correctness.files[0] != null && '/tmp/tlx-correctness.xml' || '' }}
          budget: /tmp/tlx-core.xml=90 /tmp/tlx-correctness.xml=30

  mi350-torchtlx-test:
    # Temporarily disabled because the TorchTLX environment is brittle.
    if: ${{ false }}
    runs-on: linux-fb-triton-mi350-1
    env:
      TORCHINDUCTOR_TLX_MODE: "allow"
      TORCHTLX_ARCH: gfx950
      # This job builds Triton from source.
      MAX_JOBS: 16
      CCACHE_DIR: /tmp/fbtriton-ccache
      CCACHE_MAXSIZE: 2G
      # This job has always run with pytest's default import mode.
      PYTEST_ADDOPTS: ""
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Create isolated TorchTLX environment
        run: |
          set -eux
          BASE_PYTHON="$(command -v python3)"
          TORCHTLX_VENV="${RUNNER_TEMP}/torchtlx-venv"
          uv venv --python "${BASE_PYTHON}" "${TORCHTLX_VENV}"
          TORCHTLX_PYTHON="${TORCHTLX_VENV}/bin/python"

          # Force the freshest floating ROCm nightly. A stable release sorts
          # above a nightly with the same version in a pre-existing environment;
          # this clean job-local venv has no installed release to outrank it.
          uv pip install --python "${TORCHTLX_PYTHON}" --pre torch \
            --index-url https://download.pytorch.org/whl/nightly/rocm7.2
          "${TORCHTLX_PYTHON}" - <<'PY'
          import torch
          from torch._inductor import config

          print(f"torch -> {torch.__version__} ({torch.__file__})")
          if not hasattr(config.triton, "tlx_mode"):
              raise RuntimeError(
                  "the ROCm PyTorch nightly has no TorchTLX Inductor support "
                  "(torch._inductor.config.triton.tlx_mode)"
              )
          PY
      - name: Compile Triton
        run: |
          set -eux
          TORCHTLX_PYTHON="${RUNNER_TEMP}/torchtlx-venv/bin/python"
          uv pip install --python "${TORCHTLX_PYTHON}" \
            -r python/requirements.txt -r python/test-requirements.txt
          uv pip uninstall --python "${TORCHTLX_PYTHON}" \
            pytorch-triton pytorch-triton-rocm triton-rocm triton || true
          for attempt in 1 2 3; do
            if uv pip install --python "${TORCHTLX_PYTHON}" --reinstall --no-deps \
              -e . --no-build-isolation; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            echo "Triton build failed; retrying so partial dependency downloads can resume"
          done
          "${TORCHTLX_PYTHON}" - <<'PY'
          import torch
          import triton

          print(f"torch  -> {torch.__version__} ({torch.__file__})")
          print(f"triton -> {triton.__file__}")
          PY
      - name: Run TorchTLX template + fusion tests
        id: run_torchtlx_tests
        timeout-minutes: 120
        run: |
          export PYTHON="${RUNNER_TEMP}/torchtlx-venv/bin/python"
          bash scripts/run_torchtlx_tests.sh --junitxml=/tmp/torchtlx.xml
      - name: Run TorchTLX L2 perf
        id: run_torchtlx_perf
        if: always() && github.event_name == 'schedule'
        timeout-minutes: 50
        run: |
          export PYTHON="${RUNNER_TEMP}/torchtlx-venv/bin/python"
          bash scripts/run_torchtlx_tests.sh --perf \
            --junitxml=/tmp/torchtlx_perf.xml
      - name: Upload TorchTLX perf artifacts
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: mi350-torchtlx-gemm-perf
          path: /tmp/tlx_benchmark/*_torchtlx.gfx950.json
          if-no-files-found: ignore
      - name: Parse test failures (TorchTLX)
        id: parse
        if: always()
        uses: ./.github/actions/parse-test-failures
        with:
          workflow: ${{ env.GPU_WORKFLOW_NAME }}
          job: mi350-torchtlx-test
          failed: ${{ steps.run_torchtlx_tests.outcome != 'success' || steps.run_torchtlx_perf.outcome != 'success' }}
          bucket: mi350-torchtlx-job-failed
          junit: /tmp/torchtlx.xml /tmp/torchtlx_perf.xml

  mi350-gluon-test:
    if: ${{ !cancelled() && github.repository_owner == 'facebookexperimental' && (fromJSON(inputs.plan).gluon.files[0] != null) }}
    runs-on: linux-fb-triton-mi350-1
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up test environment
        timeout-minutes: 30
        uses: ./.github/actions/setup-test-env
        with:
          backend: rocm
          arch: gfx950
          packages: numpy pytest expecttest
      - name: Install prebuilt Triton
        uses: ./.github/actions/install-prebuilt-triton
        with:
          wheel-url: ${{ inputs.wheel_url }}
          wheel-filename: ${{ inputs.wheel_filename }}
          wheel-sha256: ${{ inputs.wheel_sha256 }}
      - name: Run Gluon tests (python/test/gluon)
        id: run_gluon
        if: fromJSON(inputs.plan).gluon.files[0] != null
        timeout-minutes: 50
        uses: ./.github/actions/run-selected-tests
        with:
          suite: ${{ toJSON(fromJSON(inputs.plan).gluon) }}
          workers: "1"
          junit: /tmp/gluon.xml
      - name: Parse test failures (Gluon)
        id: parse
        if: always()
        uses: ./.github/actions/parse-test-failures
        with:
          workflow: ${{ env.GPU_WORKFLOW_NAME }}
          job: mi350-gluon-test
          failed: ${{ job.status != 'success' }}
          bucket: mi350-gluon-job-failed
          junit: /tmp/gluon.xml
          budget: /tmp/gluon.xml=50

  # File and close failure issues; ci-issues.yml decides which runs file.
  issues-mi350-tlx:
    needs: mi350-tlx-test
    if: always()
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/ci-issues.yml
    with:
      workflow: Meta Triton MI350 Tests
      job: mi350-tlx-test
      result: ${{ needs.mi350-tlx-test.result }}
      failures: ${{ needs.mi350-tlx-test.outputs.failures }}
      sha: ${{ inputs.ref }}
      platform: mi350

  issues-mi350-torchtlx:
    needs: mi350-torchtlx-test
    if: always()
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/ci-issues.yml
    with:
      workflow: Meta Triton MI350 Tests
      job: mi350-torchtlx-test
      result: ${{ needs.mi350-torchtlx-test.result }}
      failures: ${{ needs.mi350-torchtlx-test.outputs.failures }}
      sha: ${{ inputs.ref }}
      platform: mi350

  issues-mi350-gluon:
    needs: mi350-gluon-test
    if: always()
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/ci-issues.yml
    with:
      workflow: Meta Triton MI350 Tests
      job: mi350-gluon-test
      result: ${{ needs.mi350-gluon-test.result }}
      failures: ${{ needs.mi350-gluon-test.outputs.failures }}
      sha: ${{ inputs.ref }}
      platform: mi350
