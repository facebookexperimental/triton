name: Meta Triton MI350 Tests
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!website/**'
      - '!python/test/unit/language/test_tlx_codegen.py'
      - '!third_party/nvidia/**'
      - '!third_party/tlx/tutorials/blackwell-*/**'
      - '!third_party/tlx/tutorials/blackwell-*'
      - '!third_party/tlx/tutorials/testing/test_correctness_autows.py'
      - '!python/test/unit/cuda/**'
      - '!python/test/unit/language/test_tlx_*_sm90.py'
      - 'python/test/unit/language/test_tlx_dot_hip_or_sm90.py'
      - '!python/test/unit/language/test_tlx_*_sm90up.py'
      - '!python/test/unit/language/test_tlx_*_sm100.py'
      - '!python/test/unit/tlx_ops/*_sm90.py'
      - '!python/test/unit/tlx_ops/*_sm100.py'
      - '!python/test/unit/tlx_ops/*_gfx942.py'
      - '!python/test/unit/tlx_ops/*_gfx1250.py'
      - '!third_party/proton/test/**'
      # Agent instructions and skills do not affect generated code.
      - '!.agents/**'
      - '!.claude/**'
      - '!.llms/**'
      - '!AGENTS.md'
      - '!third_party/tlx/tools/agents/skills/**'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!website/**'
      - '!python/test/unit/language/test_tlx_codegen.py'
      - '!third_party/nvidia/**'
      - '!third_party/tlx/tutorials/blackwell-*/**'
      - '!third_party/tlx/tutorials/blackwell-*'
      - '!third_party/tlx/tutorials/testing/test_correctness_autows.py'
      - '!python/test/unit/cuda/**'
      - '!python/test/unit/language/test_tlx_*_sm90.py'
      - 'python/test/unit/language/test_tlx_dot_hip_or_sm90.py'
      - '!python/test/unit/language/test_tlx_*_sm90up.py'
      - '!python/test/unit/language/test_tlx_*_sm100.py'
      - '!python/test/unit/tlx_ops/*_sm90.py'
      - '!python/test/unit/tlx_ops/*_sm100.py'
      - '!python/test/unit/tlx_ops/*_gfx942.py'
      - '!python/test/unit/tlx_ops/*_gfx1250.py'
      - '!third_party/proton/test/**'
      # Agent instructions and skills do not affect generated code.
      - '!.agents/**'
      - '!.claude/**'
      - '!.llms/**'
      - '!AGENTS.md'
      - '!third_party/tlx/tools/agents/skills/**'
  schedule:
    - cron: '0 */6 * * *'

env:
  MAX_JOBS: 32
  CCACHE_DIR: /tmp/fbtriton-ccache
  CCACHE_MAXSIZE: 2G
  TORCHINDUCTOR_TLX_MODE: "off"

jobs:
  mi350-build:
    if: github.repository_owner == 'facebookexperimental'
    runs-on: linux-fb-triton-mi350-1
    env:
      WORKSPACE_DIR: /workspace
      CONDA_ENV: pytorch
      UV_VENV_DIR: /workspace/uv_venvs
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Checkout Tritonbench
        uses: actions/checkout@v3
        with:
          repository: meta-pytorch/tritonbench
          path: tritonbench
          submodules: recursive
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/fbtriton-ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.job }}-
            ccache-
      - name: Setup Tritonbench environment
        working-directory: tritonbench
        run: |
          set -eux
          bash ./.ci/tritonbench/setup-env.sh --hip --custom-triton "${GITHUB_WORKSPACE}"
      - name: Build wheel
        run: |
          . "${SETUP_SCRIPT}"
          uv build --wheel --no-build-isolation --out-dir dist/
          ls -la dist/
          python3 -c "import glob,sys,zipfile; w=glob.glob('dist/*.whl'); sys.exit('no wheel built') if len(w)!=1 else None; zipfile.ZipFile(w[0]).testzip(); print('wheel ok:', w[0])"
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: triton-wheel-mi350-${{ github.sha }}
          path: dist/*.whl
          retention-days: 1

  mi350-meta-triton-test:
    needs: mi350-build
    if: "!cancelled() && github.repository_owner == 'facebookexperimental'"
    runs-on: linux-fb-triton-mi350-1
    env:
      WORKSPACE_DIR: /workspace
      CONDA_ENV: meta-triton
      UV_VENV_DIR: /workspace/uv_venvs
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.collect.outputs.failures }}
    steps:
      - name: Fail if the build job did not succeed
        if: needs.mi350-build.result != 'success'
        run: |
          echo "mi350-build result: ${{ needs.mi350-build.result }}"
          exit 1
      - name: Checkout
        uses: actions/checkout@v3
      - name: Checkout TritonBench (Optional)
        id: tritonbench_pr
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          PR_BODY_FILE="$(mktemp)"
          printf '%s' "${PR_BODY}" > "${PR_BODY_FILE}"
          bash ./.ci/tritonbench/checkout.sh "${PR_BODY_FILE}" --ref-only
      - name: Checkout Tritonbench
        uses: actions/checkout@v3
        with:
          repository: meta-pytorch/tritonbench
          path: tritonbench
          ref: ${{ steps.tritonbench_pr.outputs.ref }}
          submodules: recursive
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/fbtriton-ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.job }}-
            ccache-
      - name: Setup Tritonbench environment
        working-directory: tritonbench
        run: |
          set -eux
          bash ./.ci/tritonbench/setup-env.sh --hip --custom-triton "${GITHUB_WORKSPACE}" --no-build
      - name: Download prebuilt Triton wheel
        uses: actions/download-artifact@v4
        with:
          name: triton-wheel-mi350-${{ github.sha }}
          path: ${{ runner.temp }}/prebuilt-wheel
      - name: Install Triton
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install --force-reinstall --no-deps ${RUNNER_TEMP}/prebuilt-wheel/*.whl
      - name: Run TritonBench
        id: tritonbench
        env:
          TRITONBENCH_TEST_SKIP_FILE: ${{ github.workspace }}/.ci/tritonbench/fbtriton_skip_tests.yaml
          TRITONBENCH_ROOT: ${{ github.workspace }}/tritonbench
        run: |
          . "${SETUP_SCRIPT}"
          bash ./.ci/tritonbench/test-gpu.sh
      - name: Collect nightly failure (TritonBench)
        id: collect
        if: always() && github.event_name == 'schedule' && failure()
        run: |
          BUCKET="amd-tritonbench"
          TITLE="[nightly] ${GITHUB_WORKFLOW} / mi350-meta-triton-test / ${BUCKET}"
          FAILURES='[{"normalized_failure_id":"'"${BUCKET}"'","raw_failure_ids":"","issue_title":"'"${TITLE}"'","job_name":"mi350-meta-triton-test","summary":"TritonBench tests failed on MI350 (see run log).","repro":"","external_dep":false,"external_dep_reason":""}]'
          echo "failures=${FAILURES}" >> "$GITHUB_OUTPUT"

  mi350-tlx-test:
    needs: mi350-build
    if: "!cancelled() && github.repository_owner == 'facebookexperimental'"
    runs-on: linux-fb-triton-mi350-1
    env:
      WORKSPACE_DIR: /workspace
      CONDA_ENV: pytorch
      UV_VENV_DIR: /workspace/uv_venvs
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 240
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Fail if the build job did not succeed
        if: needs.mi350-build.result != 'success'
        run: |
          echo "mi350-build result: ${{ needs.mi350-build.result }}"
          exit 1
      - name: Checkout
        uses: actions/checkout@v3
      - name: Checkout Tritonbench
        uses: actions/checkout@v3
        with:
          repository: meta-pytorch/tritonbench
          path: tritonbench
          submodules: recursive
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/fbtriton-ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.job }}-
            ccache-
      - name: Setup Tritonbench environment
        working-directory: tritonbench
        run: |
          set -eux
          bash ./.ci/tritonbench/setup-env.sh --hip --custom-triton "${GITHUB_WORKSPACE}" --no-build
      - name: Download prebuilt Triton wheel
        uses: actions/download-artifact@v4
        with:
          name: triton-wheel-mi350-${{ github.sha }}
          path: ${{ runner.temp }}/prebuilt-wheel
      - name: Install Triton
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install --force-reinstall --no-deps ${RUNNER_TEMP}/prebuilt-wheel/*.whl
      - name: Install torchao
        timeout-minutes: 10
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install --pre torchao --index-url https://download.pytorch.org/whl/nightly/rocm7.2
          python -c 'from torchao.prototype.mx_formats.mx_tensor import MXTensor, ScaleCalculationMode'
      - name: Run TLX core tests
        id: run_core_tests
        timeout-minutes: 90
        run: |
          set -eux
          . "${SETUP_SCRIPT}"
          uv pip install pytest
          shopt -s nullglob
          FILES=(
            python/test/unit/language/test_tlx_*_any.py
            python/test/unit/language/test_tlx_*hip*.py
            python/test/unit/language/test_tlx_*gfx950*.py
            python/test/unit/tlx_ops/test_*_hip.py
            python/test/unit/tlx_ops/test_*_gfx950.py
          )
          # TorchTLX depends on floating PyTorch Inductor APIs and runs in the
          # separate mi350-torchtlx-test job below, not this pinned-PyTorch job.
          TLX_FILES=()
          for file in "${FILES[@]}"; do
            [[ "${file}" == */test_torchtlx_* ]] || TLX_FILES+=("${file}")
          done
          FILES=("${TLX_FILES[@]}")
          [ ${#FILES[@]} -gt 0 ] || { echo "no TLX core test files matched"; exit 1; }
          echo "mi350 collects:" "${FILES[@]}"
          pytest "${FILES[@]}" -v --junitxml=/tmp/tlx-core.xml
      - name: Run TLX tutorial correctness tests
        id: run_correctness_tests
        timeout-minutes: 30
        run: |
          set -eux
          . "${SETUP_SCRIPT}"
          pytest third_party/tlx/tutorials/testing/test_correctness.py -v --durations=25 --junitxml=/tmp/tlx-correctness.xml
      - name: Run host-default TLX L2 perf
        id: run_perf_tests
        if: always() && github.event_name == 'schedule'
        timeout-minutes: 60
        run: |
          . "${SETUP_SCRIPT}"
          pytest python/test/tlx_benchmark/test_ops_perf.py \
            -k "not torchtlx" -v --junitxml=/tmp/tlx-perf.xml
      - name: Upload TLX perf artifacts
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: mi350-tlx-perf
          path: /tmp/tlx_benchmark/*.json
          if-no-files-found: ignore
      - name: Collect nightly failures (TLX)
        id: parse
        if: always() && github.event_name == 'schedule'
        run: |
          . "${SETUP_SCRIPT}"
          FAILED_FLAG=""
          if [[ "${{ steps.run_core_tests.outcome }}" != "success" || "${{ steps.run_correctness_tests.outcome }}" != "success" || "${{ steps.run_perf_tests.outcome }}" != "success" ]]; then
            FAILED_FLAG="--failed --bucket mi350-tlx-job-failed"
          fi
          python3 .github/scripts/parse_junit_failures.py \
            --junit /tmp/tlx-core.xml /tmp/tlx-correctness.xml /tmp/tlx-perf.xml \
            --budget /tmp/tlx-core.xml=90 --budget /tmp/tlx-correctness.xml=30 --budget /tmp/tlx-perf.xml=60 \
            --workflow "${GITHUB_WORKFLOW}" \
            --job "mi350-tlx-test" \
            ${FAILED_FLAG}

  mi350-torchtlx-test:
    # Temporarily disabled because the TorchTLX environment is brittle.
    if: ${{ false }}
    runs-on: linux-fb-triton-mi350-1
    env:
      TORCHINDUCTOR_TLX_MODE: "allow"
      TORCHTLX_ARCH: gfx950
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Create isolated TorchTLX environment
        run: |
          set -eux
          BASE_PYTHON="$(command -v python3)"
          TORCHTLX_VENV="${RUNNER_TEMP}/torchtlx-venv"
          uv venv --python "${BASE_PYTHON}" "${TORCHTLX_VENV}"
          TORCHTLX_PYTHON="${TORCHTLX_VENV}/bin/python"

          # Force the freshest floating ROCm nightly. A stable release sorts
          # above a nightly with the same version in a pre-existing environment;
          # this clean job-local venv has no installed release to outrank it.
          uv pip install --python "${TORCHTLX_PYTHON}" --pre torch \
            --index-url https://download.pytorch.org/whl/nightly/rocm7.2
          "${TORCHTLX_PYTHON}" - <<'PY'
          import torch
          from torch._inductor import config

          print(f"torch -> {torch.__version__} ({torch.__file__})")
          if not hasattr(config.triton, "tlx_mode"):
              raise RuntimeError(
                  "the ROCm PyTorch nightly has no TorchTLX Inductor support "
                  "(torch._inductor.config.triton.tlx_mode)"
              )
          PY
      - name: Compile Triton
        run: |
          set -eux
          TORCHTLX_PYTHON="${RUNNER_TEMP}/torchtlx-venv/bin/python"
          uv pip install --python "${TORCHTLX_PYTHON}" \
            -r python/requirements.txt -r python/test-requirements.txt
          uv pip uninstall --python "${TORCHTLX_PYTHON}" \
            pytorch-triton pytorch-triton-rocm triton-rocm triton || true
          for attempt in 1 2 3; do
            if uv pip install --python "${TORCHTLX_PYTHON}" --reinstall --no-deps \
              -e . --no-build-isolation; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            echo "Triton build failed; retrying so partial dependency downloads can resume"
          done
          "${TORCHTLX_PYTHON}" - <<'PY'
          import torch
          import triton

          print(f"torch  -> {torch.__version__} ({torch.__file__})")
          print(f"triton -> {triton.__file__}")
          PY
      - name: Run TorchTLX template + fusion tests
        id: run_torchtlx_tests
        timeout-minutes: 120
        run: |
          export PYTHON="${RUNNER_TEMP}/torchtlx-venv/bin/python"
          bash scripts/run_torchtlx_tests.sh --junitxml=/tmp/torchtlx.xml
      - name: Run TorchTLX L2 perf
        id: run_torchtlx_perf
        if: always() && github.event_name == 'schedule'
        timeout-minutes: 50
        run: |
          export PYTHON="${RUNNER_TEMP}/torchtlx-venv/bin/python"
          bash scripts/run_torchtlx_tests.sh --perf \
            --junitxml=/tmp/torchtlx_perf.xml
      - name: Upload TorchTLX perf artifacts
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: mi350-torchtlx-gemm-perf
          path: /tmp/tlx_benchmark/*_torchtlx.gfx950.json
          if-no-files-found: ignore
      - name: Collect nightly failures (TorchTLX)
        id: parse
        if: always() && github.event_name == 'schedule'
        run: |
          FAILED_FLAG=""
          if [[ "${{ steps.run_torchtlx_tests.outcome }}" != "success" || \
                "${{ steps.run_torchtlx_perf.outcome }}" != "success" ]]; then
            FAILED_FLAG="--failed --bucket mi350-torchtlx-job-failed"
          fi
          python3 .github/scripts/parse_junit_failures.py \
            --junit /tmp/torchtlx.xml /tmp/torchtlx_perf.xml \
            --workflow "${GITHUB_WORKFLOW}" \
            --job "mi350-torchtlx-test" \
            ${FAILED_FLAG}

  mi350-gluon-test:
    needs: mi350-build
    if: "!cancelled() && github.repository_owner == 'facebookexperimental'"
    runs-on: linux-fb-triton-mi350-1
    env:
      WORKSPACE_DIR: /workspace
      CONDA_ENV: pytorch
      UV_VENV_DIR: /workspace/uv_venvs
      SETUP_SCRIPT: /workspace/setup_instance.sh
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      failures: ${{ steps.parse.outputs.failures }}
    steps:
      - name: Fail if the build job did not succeed
        if: needs.mi350-build.result != 'success'
        run: |
          echo "mi350-build result: ${{ needs.mi350-build.result }}"
          exit 1
      - name: Checkout
        uses: actions/checkout@v3
      - name: Checkout Tritonbench
        uses: actions/checkout@v3
        with:
          repository: meta-pytorch/tritonbench
          path: tritonbench
          submodules: recursive
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/fbtriton-ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.job }}-
            ccache-
      - name: Setup Tritonbench environment
        working-directory: tritonbench
        run: |
          set -eux
          bash ./.ci/tritonbench/setup-env.sh --hip --custom-triton "${GITHUB_WORKSPACE}" --no-build
      - name: Download prebuilt Triton wheel
        uses: actions/download-artifact@v4
        with:
          name: triton-wheel-mi350-${{ github.sha }}
          path: ${{ runner.temp }}/prebuilt-wheel
      - name: Install Triton
        run: |
          . "${SETUP_SCRIPT}"
          uv pip install --force-reinstall --no-deps ${RUNNER_TEMP}/prebuilt-wheel/*.whl
      - name: Run Gluon tests (python/test/gluon)
        id: run_gluon
        timeout-minutes: 50
        run: |
          set -eux
          . "${SETUP_SCRIPT}"
          uv pip install pytest expecttest
          pytest python/test/gluon/ -v --junitxml=/tmp/gluon.xml
      - name: Collect nightly failures (Gluon)
        id: parse
        if: always() && github.event_name == 'schedule'
        run: |
          . "${SETUP_SCRIPT}"
          FAILED_FLAG=""
          if [[ "${{ steps.run_gluon.outcome }}" != "success" ]]; then
            FAILED_FLAG="--failed --bucket mi350-gluon-job-failed"
          fi
          python3 .github/scripts/parse_junit_failures.py \
            --junit /tmp/gluon.xml \
            --budget /tmp/gluon.xml=50 \
            --workflow "${GITHUB_WORKFLOW}" \
            --job "mi350-gluon-test" \
            ${FAILED_FLAG}

  report-mi350-tritonbench:
    needs: mi350-meta-triton-test
    if: always() && github.event_name == 'schedule' && needs.mi350-meta-triton-test.outputs.failures != '' && needs.mi350-meta-triton-test.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.mi350-meta-triton-test.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: ${{ github.workflow }}
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}
      event_name: ${{ github.event_name }}
      run_attempt: ${{ github.run_attempt }}
      summary: ${{ matrix.item.summary }}
      repro: ${{ matrix.item.repro }}
      external_dep: ${{ matrix.item.external_dep }}
      external_dep_reason: ${{ matrix.item.external_dep_reason }}
      platform: mi350

  report-mi350-tlx:
    needs: mi350-tlx-test
    if: always() && github.event_name == 'schedule' && needs.mi350-tlx-test.outputs.failures != '' && needs.mi350-tlx-test.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.mi350-tlx-test.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: ${{ github.workflow }}
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}
      event_name: ${{ github.event_name }}
      run_attempt: ${{ github.run_attempt }}
      summary: ${{ matrix.item.summary }}
      repro: ${{ matrix.item.repro }}
      external_dep: ${{ matrix.item.external_dep }}
      external_dep_reason: ${{ matrix.item.external_dep_reason }}
      platform: mi350

  report-mi350-torchtlx:
    needs: mi350-torchtlx-test
    if: always() && github.event_name == 'schedule' && needs.mi350-torchtlx-test.outputs.failures != '' && needs.mi350-torchtlx-test.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.mi350-torchtlx-test.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: ${{ github.workflow }}
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}
      event_name: ${{ github.event_name }}
      run_attempt: ${{ github.run_attempt }}
      summary: ${{ matrix.item.summary }}
      repro: ${{ matrix.item.repro }}

  report-mi350-gluon:
    needs: mi350-gluon-test
    if: always() && github.event_name == 'schedule' && needs.mi350-gluon-test.outputs.failures != '' && needs.mi350-gluon-test.outputs.failures != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.mi350-gluon-test.outputs.failures) }}
    uses: ./.github/workflows/report-nightly-failure.yml
    with:
      issue_title: ${{ matrix.item.issue_title }}
      normalized_failure_id: ${{ matrix.item.normalized_failure_id }}
      raw_failure_ids: ${{ matrix.item.raw_failure_ids }}
      workflow_name: ${{ github.workflow }}
      job_name: ${{ matrix.item.job_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}
