name: PR 4745 SDK build canary
on:
  workflow_dispatch:
    inputs:
      llvm_sha:
        required: true
        type: string
      kind:
        required: true
        type: choice
        options: [core, amd]
      build_number:
        default: '9902'
        type: string
permissions:
  contents: read
jobs:
  canary:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/meta-llvm-build.yml
    with:
      llvm_sha: ${{ inputs.llvm_sha }}
      kind: ${{ inputs.kind }}
      build_number: ${{ inputs.build_number }}
      publish: false
