name: CI Health
# Collects runs, jobs, steps and failing tests of gpu-tests.yml,
# gpu-tests-nightly.yml, nightly-tlx-ops-bench.yml and the push runs of
# compiler.yml (LIT), runs of nightly-fbtriton.yml, and each tracked
# branch's Meta LLVM pin, into the
# 'ci-health' release, for the /ci/ dashboard
# that pages.yml renders after each successful collection. Never deploys. It also
# opens an issue when a GPU runner pool stops picking up jobs, and cancels test runs left
# waiting only on that pool (runner_health.py).
# On pull requests it only runs the tests.
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Re-collect runs created at or after this ISO time, e.g. 2026-10-01T00:00:00Z (blank = from the saved cursor)'
        required: false
  pull_request:
    paths:
      - '.github/scripts/ci_health.py'
      - '.github/scripts/ci_health_rules.py'
      - '.github/scripts/ci_health_logs.py'
      - '.github/scripts/ci_health_sanitizer.py'
      - '.github/workflows/cutracer.yml'
      - '.github/scripts/ci_health_dashboard.html'
      - '.github/scripts/runner_health.py'
      - '.github/scripts/test_ci_health.py'
      - '.github/scripts/test_ci_health_rules.py'
      - '.github/scripts/test_ci_health_logs.py'
      - '.github/scripts/test_runner_health.py'
      - '.github/scripts/test_gpu_ci.py'
      - '.github/scripts/test_kernel_test_selection.py'
      - '.github/scripts/wheel_cache.py'
      - '.github/scripts/gpu_test_selection.py'
      - '.github/scripts/fast_tests.py'
      - '.github/fast-test-suites.json'
      - '.github/workflows/fast-gpu-tests.yml'
      - '.github/workflows/_fast-gpu-tests.yml'
      - '.github/gpu-test-paths.json'
      - '.github/gpu-test-suites.json'
      - '.github/scripts/run_selected_tests.py'
      - '.github/actions/run-selected-tests/action.yml'
      - '.github/scripts/meta_llvm_bump.py'
      - '.github/scripts/test_meta_llvm_bump.py'
      - '.github/workflows/ci-health.yml'
      - '.github/workflows/gpu-tests.yml'
      - '.github/workflows/gpu-tests-nightly.yml'
      - '.github/workflows/nightly-tlx-ops-bench.yml'
      - '.github/workflows/tritonbench.yml'
      - '.github/workflows/compiler.yml'
      - '.github/workflows/nightly-fbtriton.yml'
      - '.github/workflows/mi350.yml'
      - '.github/workflows/b200.yml'
      - '.github/workflows/h100.yml'
      - '.github/workflows/_tlx-ops-bench.yml'
      - '.github/workflows/bisect-tlx-ops-regression.yml'
      - '.github/scripts/tlx_ops_bench*.py'
      - '.github/scripts/test_tlx_ops_bench*.py'
      - '.github/scripts/failure_issues.py'
      - '.github/scripts/test_failure_issues.py'

permissions:
  contents: read

# One collection at a time; never cancel one mid-upload.
concurrency:
  group: ci-health-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'collect' }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pytest PyYAML boto3
      # Also checks that every test step in the GPU workflows maps to a dashboard group.
      - name: Run dashboard tests
        working-directory: .github/scripts
        run: python3 -m pytest -s --tb=short test_ci_health.py test_ci_health_rules.py test_ci_health_logs.py test_runner_health.py test_meta_llvm_bump.py test_gpu_ci.py test_kernel_test_selection.py
      - name: Run throughput regression tests
        working-directory: .github/scripts
        run: python3 -m pytest -s --tb=short test_tlx_ops_bench_regressions.py test_tlx_ops_bench_bisect_round.py test_tlx_ops_bench_bisect.py test_tlx_ops_bench_dashboard.py test_tlx_ops_bench_ir_diff.py test_failure_issues.py

  collect:
    if: github.event_name != 'pull_request' && github.repository_owner == 'facebookexperimental'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload to the ci-health release
      actions: read     # list runs and jobs
    steps:
      - uses: actions/checkout@v4
      - name: Download stored data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          gh release view ci-health >/dev/null 2>&1 \
            || gh release create ci-health --prerelease --latest=false --title "CI health data" \
                 --notes "Runs, jobs, steps and failing tests of gpu-tests.yml behind the /ci/ dashboard." \
            || gh release view ci-health >/dev/null
          gh release download ci-health --dir data --pattern '*' || echo "no stored data yet"
      - name: Collect
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.since }}
        run: python3 .github/scripts/ci_health.py collect data ${SINCE:+--since "$SINCE"}
      - name: Upload changed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          gh release upload ci-health data/state.json $(cat data/changed.txt) --clobber

  runners:
    if: github.event_name != 'pull_request' && github.repository_owner == 'facebookexperimental'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write    # list queued and running jobs, cancel runs stuck on a down pool
      issues: write     # open and close runner pool issues
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Check GPU runner pools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/runner_health.py
