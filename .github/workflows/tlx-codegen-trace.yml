name: TLX codegen trace
# CPU-only codegen gate for bundle (reactor) PRs and PRs that change the
# compiler or tlx.ops kernels: compiles a fixed kernel corpus, including
# tlx.ops kernels recorded from benchmark launches, with the base wheel and
# the head wheel, diffs TTGIR ops, PTX features + instruction mix + ptxas
# stats (regs/smem/spills), and posts the verdict with TTGIR and PTX diffs as
# a PR comment. Advisory only -- posts, never blocks. Deterministic, no GPU.

on:
  # `branches` matches the PR's target branch. Bundle PRs go from
  # reactor/sync-train/plan-*/item-* into main. Other PRs run only when they
  # change compiler or kernel paths; the pick step decides.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to bench (defaults to the selected workflow ref)
        type: string
        required: false
        default: ''
      pr:
        description: PR number to comment on (blank = no comment)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: codegen-trace-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      head: ${{ steps.pick.outputs.head }}
      pr_head: ${{ steps.pick.outputs.pr_head }}
      base: ${{ steps.pick.outputs.base }}
      pr: ${{ steps.pick.outputs.pr }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pick head, base, and PR
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PR: ${{ inputs.pr }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # Compare GitHub's test merge commit with its first parent: exactly
            # what landing changes on main, and the head is the commit Fast
            # correctness builds, so its wheel is a cache hit.
            git fetch --no-tags --quiet origin "${MERGE_SHA}"
            HEAD="${MERGE_SHA}"; BASE=$(git rev-parse "${MERGE_SHA}^1")
            PR_HEAD="${HEAD_SHA}"; PR="${PR_NUMBER}"
            CODEGEN_PATHS='^(lib/|include/|python/src/|python/triton/|third_party/(nvidia|tlx)/|cmake/|CMakeLists\.txt$|setup\.py$|\.github/scripts/(tlx_codegen_snapshot|tlx_ops_bench_ir_diff)\.py$|\.github/workflows/tlx-codegen-trace\.yml$)'
            if [[ "${HEAD_REF}" != reactor/sync-train/* ]] && ! git diff --name-only "${BASE}" "${HEAD}" | grep -qE "${CODEGEN_PATHS}"; then
              echo "No compiler or kernel changes; skipping."
              exit 0
            fi
          elif [[ -n "${INPUT_PR}" ]]; then
            HEAD=$(gh pr view "${INPUT_PR}" --json headRefOid --jq .headRefOid)
            BASE=$(gh pr view "${INPUT_PR}" --json baseRefOid --jq .baseRefOid)
            PR_HEAD="${HEAD}"; PR="${INPUT_PR}"
          else
            HEAD=$(git rev-parse "${INPUT_REF:-HEAD}")
            BASE=$(git merge-base "${HEAD}" origin/main)
            PR_HEAD="${HEAD}"; PR=""
          fi
          [[ "${HEAD}" =~ ^[0-9a-f]{40}$ ]] || { echo "bad head: ${HEAD}"; exit 1; }
          [[ "${BASE}" =~ ^[0-9a-f]{40}$ ]] || { echo "bad base: ${BASE}"; exit 1; }
          {
            echo "head=${HEAD}"
            echo "pr_head=${PR_HEAD}"
            echo "base=${BASE}"
            echo "pr=${PR}"
          } >> "$GITHUB_OUTPUT"
      - name: Pick the tlx.ops corpus
        # The nightly B200 and MI350 benchmarks publish the corpora recorded from main. Both sides of this trace use
        # the copies picked here; without one the trace covers only the built-in kernels.
        if: steps.pick.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tlx-ops-bench --repo "${GITHUB_REPOSITORY}" --pattern 'codegen-corpus.*.json' --dir corpus \
            || echo "No codegen corpus published yet; tracing the built-in kernels only."
      - name: Upload the tlx.ops corpus
        if: steps.pick.outputs.head != ''
        uses: actions/upload-artifact@v4
        with:
          name: codegen-corpus-${{ github.run_id }}
          path: corpus/codegen-corpus.*.json
          if-no-files-found: ignore

  build-head:
    needs: resolve
    if: needs.resolve.outputs.head != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.head }}
      build_id: head

  build-base:
    needs: resolve
    if: needs.resolve.outputs.head != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.base }}
      build_id: base

  snapshot:
    needs: [resolve, build-head, build-base]
    if: needs.resolve.outputs.head != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: head
          - side: base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout CI actions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/actions
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Create venv
        run: |
          uv venv "${RUNNER_TEMP}/venv" --python 3.12
          echo "VIRTUAL_ENV=${RUNNER_TEMP}/venv" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"
      - name: Install prebuilt Triton (${{ matrix.side }})
        uses: ./.ci/.github/actions/install-prebuilt-triton
        with:
          wheel-url: ${{ matrix.side == 'head' && needs.build-head.outputs.wheel_url || needs.build-base.outputs.wheel_url }}
          wheel-filename: ${{ matrix.side == 'head' && needs.build-head.outputs.wheel_filename || needs.build-base.outputs.wheel_filename }}
          wheel-sha256: ${{ matrix.side == 'head' && needs.build-head.outputs.wheel_sha256 || needs.build-base.outputs.wheel_sha256 }}
      - name: Download the tlx.ops corpus
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: codegen-corpus-${{ github.run_id }}
          path: corpus
      - name: Install CPU torch
        # tlx.ops kernel modules import torch; compiling them needs no GPU.
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Snapshot corpus
        # Advisory: a corpus that fails to compile on one side shows up as
        # "no signal" in the diff comment instead of failing the workflow.
        continue-on-error: true
        run: |
          shopt -s nullglob
          CORPUS=()
          for f in corpus/codegen-corpus.*.json; do CORPUS+=(--corpus "$f"); done
          python3 .github/scripts/tlx_codegen_snapshot.py snapshot "${CORPUS[@]}" --jobs "$(nproc)" \
            --ir-dir "ir-${{ matrix.side }}" --out "snap-${{ matrix.side }}.json"
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: codegen-snap-${{ matrix.side }}-${{ github.run_id }}
          path: |
            snap-${{ matrix.side }}.json
            ir-${{ matrix.side }}
          retention-days: 90

  diff:
    needs: [resolve, snapshot]
    if: ${{ !cancelled() && needs.resolve.outputs.head != '' && needs.snapshot.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: codegen-snap-*-${{ github.run_id }}
          path: snaps
          merge-multiple: true
      - name: Diff snapshots
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
          PR_HEAD: ${{ needs.resolve.outputs.pr_head }}
          BASE_SHA: ${{ needs.resolve.outputs.base }}
          SNAPSHOT_RESULT: ${{ needs.snapshot.result }}
        run: |
          set -euo pipefail
          if [[ ! -f snaps/snap-head.json || ! -f snaps/snap-base.json ]]; then
            printf '## TLX codegen trace (advisory)\n\nMissing snapshots (snapshot job %s) — no signal.\n' \
              "${SNAPSHOT_RESULT}" > verdict.md
            exit 0
          fi
          python3 .github/scripts/tlx_codegen_snapshot.py diff \
            --base snaps/snap-base.json --head snaps/snap-head.json \
            --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}" --pr-head-sha "${PR_HEAD}" \
            --base-ir snaps/ir-base --head-ir snaps/ir-head --out verdict.md
      - name: Comment on PR
        if: needs.resolve.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          # One comment per PR, edited in place on later pushes.
          MARKER='<!-- tlx-codegen-trace -->'
          { echo "${MARKER}"; cat verdict.md; } > comment.md
          CID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${MARKER}\"))) | .id" | tail -n 1)
          if [[ -n "${CID}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${CID}" -F body=@comment.md > /dev/null
          else
            gh pr comment "${PR}" --body-file comment.md
          fi
