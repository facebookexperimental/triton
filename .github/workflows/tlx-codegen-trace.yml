name: TLX codegen trace
# CPU-only codegen gate for bundle (reactor) PRs and PRs that change the
# compiler or tlx.ops kernels: compiles a fixed kernel corpus, including
# tlx.ops kernels recorded from benchmark launches, with the base wheel and
# the head wheel, diffs TTGIR ops, PTX features + instruction mix + ptxas
# stats (regs/smem/spills), and posts the verdict with TTGIR and PTX diffs as
# a PR comment. Advisory only -- posts, never blocks. Deterministic, no GPU.

on:
  # Fast correctness calls this for PRs into main that codegen_trace.py selects (bundle PRs and compiler or kernel
  # changes), passing the wheels it built. A missing or non-matching wheel is built here.
  workflow_call:
    inputs:
      head_wheel:
        description: build.yml `wheel` output for the PR's test merge commit (blank = build it here)
        type: string
        required: false
        default: ''
      base_wheel:
        description: build.yml `wheel` output for that merge commit's first parent (blank = build it here)
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to bench (defaults to the selected workflow ref)
        type: string
        required: false
        default: ''
      pr:
        description: PR number to comment on (blank = no comment)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      head: ${{ steps.pick.outputs.head }}
      pr_head: ${{ steps.pick.outputs.pr_head }}
      base: ${{ steps.pick.outputs.base }}
      pr: ${{ steps.pick.outputs.pr }}
      head_wheel: ${{ steps.supplied.outputs.head_wheel }}
      base_wheel: ${{ steps.supplied.outputs.base_wheel }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          # The revision whose build.yml would build the wheels, so supplied wheels are checked against its recipe.
          ref: ${{ github.workflow_sha }}
          path: .ci
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/codegen_trace.py
            .github/scripts/wheel_cache.py
            .github/workflows/build.yml
      - name: Pick head, base, and PR
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PR: ${{ inputs.pr }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # Compare GitHub's test merge commit with its first parent: exactly
            # what landing changes on main, and the head is the commit Fast
            # correctness builds.
            git fetch --no-tags --quiet origin "${MERGE_SHA}"
            HEAD="${MERGE_SHA}"; BASE=$(git rev-parse "${MERGE_SHA}^1")
            PR_HEAD="${HEAD_SHA}"; PR="${PR_NUMBER}"
            TRACE=$(python3 .ci/.github/scripts/codegen_trace.py "${BASE}" "${HEAD}")
            if [[ "${TRACE}" != true ]]; then
              echo "No compiler or kernel changes; skipping."
              exit 0
            fi
          elif [[ -n "${INPUT_PR}" ]]; then
            HEAD=$(gh pr view "${INPUT_PR}" --json headRefOid --jq .headRefOid)
            BASE=$(gh pr view "${INPUT_PR}" --json baseRefOid --jq .baseRefOid)
            PR_HEAD="${HEAD}"; PR="${INPUT_PR}"
          else
            HEAD=$(git rev-parse "${INPUT_REF:-HEAD}")
            BASE=$(git merge-base "${HEAD}" origin/main)
            PR_HEAD="${HEAD}"; PR=""
          fi
          [[ "${HEAD}" =~ ^[0-9a-f]{40}$ ]] || { echo "bad head: ${HEAD}"; exit 1; }
          [[ "${BASE}" =~ ^[0-9a-f]{40}$ ]] || { echo "bad base: ${BASE}"; exit 1; }
          {
            echo "head=${HEAD}"
            echo "pr_head=${PR_HEAD}"
            echo "base=${BASE}"
            echo "pr=${PR}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.pick.outputs.head != '' && (inputs.head_wheel != '' || inputs.base_wheel != '')
        with:
          python-version: '3.12'
      - name: Reuse the supplied wheels
        # A supplied wheel replaces a build here only if it is exactly this side's commit, repository, Python ABI,
        # platform and build recipe, with a filename, checksum and download source; anything else is built.
        if: steps.pick.outputs.head != '' && (inputs.head_wheel != '' || inputs.base_wheel != '')
        id: supplied
        env:
          HEAD: ${{ steps.pick.outputs.head }}
          BASE: ${{ steps.pick.outputs.base }}
          HEAD_WHEEL: ${{ inputs.head_wheel }}
          BASE_WHEEL: ${{ inputs.base_wheel }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'boto3>=1.36.0'
          SUPPLIED_WHEEL="${HEAD_WHEEL}" python .ci/.github/scripts/wheel_cache.py supplied --sha "${HEAD}" --output head_wheel
          SUPPLIED_WHEEL="${BASE_WHEEL}" python .ci/.github/scripts/wheel_cache.py supplied --sha "${BASE}" --output base_wheel
      - name: Pick the tlx.ops corpus
        # The nightly B200 and MI350 benchmarks publish the corpora recorded from main. Both sides of this trace use
        # the copies picked here; without one the trace covers only the built-in kernels.
        if: steps.pick.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tlx-ops-bench --repo "${GITHUB_REPOSITORY}" --pattern 'codegen-corpus.*.json' --dir corpus \
            || echo "No codegen corpus published yet; tracing the built-in kernels only."
      - name: Upload the tlx.ops corpus
        if: steps.pick.outputs.head != ''
        uses: actions/upload-artifact@v4
        with:
          name: codegen-corpus-${{ github.run_id }}
          path: corpus/codegen-corpus.*.json
          if-no-files-found: ignore

  build-head:
    needs: resolve
    if: needs.resolve.outputs.head != '' && needs.resolve.outputs.head_wheel == ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.head }}
      build_id: head

  build-base:
    needs: resolve
    if: needs.resolve.outputs.head != '' && needs.resolve.outputs.base_wheel == ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.base }}
      build_id: base

  snapshot:
    name: snapshot (${{ matrix.side }})
    needs: [resolve, build-head, build-base]
    # A reused wheel skips its build, so this runs unless a needed build failed.
    if: >-
      ${{ !cancelled() && needs.resolve.outputs.head != '' &&
      needs.build-head.result != 'failure' && needs.build-base.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        # Each side installs only its own wheel object: the supplied wheel, else the one built here.
        include:
          - side: head
            wheel: ${{ needs.resolve.outputs.head_wheel || needs.build-head.outputs.wheel }}
          - side: base
            wheel: ${{ needs.resolve.outputs.base_wheel || needs.build-base.outputs.wheel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout CI actions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/actions
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Create venv
        run: |
          uv venv "${RUNNER_TEMP}/venv" --python 3.12
          echo "VIRTUAL_ENV=${RUNNER_TEMP}/venv" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"
      - name: Install prebuilt Triton (${{ matrix.side }})
        uses: ./.ci/.github/actions/install-prebuilt-triton
        with:
          artifact-name: ${{ fromJSON(matrix.wheel).artifact }}
          wheel-url: ${{ fromJSON(matrix.wheel).url }}
          wheel-filename: ${{ fromJSON(matrix.wheel).filename }}
          wheel-sha256: ${{ fromJSON(matrix.wheel).sha256 }}
      - name: Download the tlx.ops corpus
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: codegen-corpus-${{ github.run_id }}
          path: corpus
      - name: Install CPU torch
        # tlx.ops kernel modules import torch; compiling them needs no GPU.
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Snapshot corpus
        # Advisory: a corpus that fails to compile on one side shows up as
        # "no signal" in the diff comment instead of failing the workflow.
        continue-on-error: true
        run: |
          shopt -s nullglob
          CORPUS=()
          for f in corpus/codegen-corpus.*.json; do CORPUS+=(--corpus "$f"); done
          python3 .github/scripts/tlx_codegen_snapshot.py snapshot "${CORPUS[@]}" --jobs "$(nproc)" \
            --ir-dir "ir-${{ matrix.side }}" --out "snap-${{ matrix.side }}.json"
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: codegen-snap-${{ matrix.side }}-${{ github.run_id }}
          path: |
            snap-${{ matrix.side }}.json
            ir-${{ matrix.side }}
          retention-days: 90

  diff:
    needs: [resolve, snapshot]
    if: ${{ !cancelled() && needs.resolve.outputs.head != '' && needs.snapshot.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: codegen-snap-*-${{ github.run_id }}
          path: snaps
          merge-multiple: true
      - name: Diff snapshots
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
          PR_HEAD: ${{ needs.resolve.outputs.pr_head }}
          BASE_SHA: ${{ needs.resolve.outputs.base }}
          SNAPSHOT_RESULT: ${{ needs.snapshot.result }}
        run: |
          set -euo pipefail
          if [[ ! -f snaps/snap-head.json || ! -f snaps/snap-base.json ]]; then
            printf '## TLX codegen trace (advisory)\n\nMissing snapshots (snapshot job %s) — no signal.\n' \
              "${SNAPSHOT_RESULT}" > verdict.md
            exit 0
          fi
          python3 .github/scripts/tlx_codegen_snapshot.py diff \
            --base snaps/snap-base.json --head snaps/snap-head.json \
            --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}" --pr-head-sha "${PR_HEAD}" \
            --base-ir snaps/ir-base --head-ir snaps/ir-head --out verdict.md
      - name: Write job summary
        run: cat verdict.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        if: >-
          needs.resolve.outputs.pr != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          # One comment per PR, edited in place on later pushes.
          MARKER='<!-- tlx-codegen-trace -->'
          { echo "${MARKER}"; cat verdict.md; } > comment.md
          CID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${MARKER}\"))) | .id" | tail -n 1)
          if [[ -n "${CID}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${CID}" -F body=@comment.md > /dev/null
          else
            gh pr comment "${PR}" --body-file comment.md
          fi
