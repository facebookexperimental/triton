<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">TLX agent panel organization</title>
  <desc id="description">The general panel governs the R and D, build, and performance benchmark panels. The R and D panel contains profiler, technical lead, worker, manager, and knowledge roles. The execution flow starts with profiling, passes through a profiler-guided technical lead finding and worker implementation, invokes build and performance validation, and ends with manager review and curated knowledge.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17223a" stroke-width="1"/>
      <rect x="30" y="30" width="3" height="3" fill="#25334f"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1H6V0L12 6 6 12V11H0Z" fill="#4599ff"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1H6V0L12 6 6 12V11H0Z" fill="#7f8ba3"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { fill: #f2f6ff; font-size: 34px; font-weight: 800; letter-spacing: 2px; }
      .subtitle { fill: #94a2ba; font-size: 16px; }
      .panel-title { fill: #f2f6ff; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
      .section-label { fill: #8d9bb3; font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
      .body { fill: #c8d2e5; font-size: 15px; }
      .small { fill: #9eabc1; font-size: 13px; }
      .path { fill: #b9c7df; font-size: 13px; }
      .node-title { fill: #f6f8fc; font-size: 16px; font-weight: 800; }
      .node-detail { fill: #aab7cd; font-size: 12px; }
      .flow-title { fill: #f2f6ff; font-size: 14px; font-weight: 750; }
      .flow-detail { fill: #8998b2; font-size: 11px; }
      .connector { fill: none; stroke: #3d4b67; stroke-width: 3; shape-rendering: crispEdges; }
      .flow-line { fill: none; stroke: #4599ff; stroke-width: 3; shape-rendering: crispEdges; }
      .pixel-border { shape-rendering: crispEdges; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#080c17"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.72"/>

  <!-- Ambient pixel cloud -->
  <g fill="#173158" opacity="0.45" class="pixel-border">
    <rect x="30" y="88" width="32" height="32"/>
    <rect x="62" y="56" width="64" height="64"/>
    <rect x="126" y="40" width="96" height="80"/>
    <rect x="222" y="72" width="48" height="48"/>
    <rect x="1360" y="48" width="64" height="64"/>
    <rect x="1424" y="80" width="96" height="48"/>
    <rect x="1520" y="112" width="32" height="32"/>
  </g>

  <text x="64" y="65" class="sans title">TLX AGENT PANELS</text>
  <text x="64" y="94" class="sans subtitle">policy, ownership, and evidence flow</text>
  <g transform="translate(1370 52)" class="pixel-border">
    <rect width="20" height="20" fill="#4599ff"/>
    <rect x="24" width="20" height="20" fill="#8a6cff"/>
    <rect x="48" width="20" height="20" fill="#40c58a"/>
    <rect x="72" width="20" height="20" fill="#f3a846"/>
    <rect x="96" width="20" height="20" fill="#ef6f91"/>
  </g>

  <!-- General panel -->
  <path d="M64 126H96V114H1504V126H1536V250H1504V262H96V250H64Z" fill="#101a2f" stroke="#4599ff" stroke-width="2" class="pixel-border"/>
  <rect x="64" y="126" width="10" height="124" fill="#4599ff"/>
  <text x="102" y="164" class="sans section-label" fill="#77b6ff">ROOT POLICY</text>
  <text x="102" y="199" class="sans panel-title">GENERAL PANEL</text>
  <text x="348" y="166" class="sans body">Harness decides correctness and promotion</text>
  <text x="348" y="194" class="sans body">Claims resolve to artifacts</text>
  <text x="348" y="222" class="sans body">Agent definitions are human-owned</text>
  <path d="M906 150H1474V226H906Z" fill="#0b1325" stroke="#263a5b" stroke-width="2" class="pixel-border"/>
  <text x="936" y="181" class="mono path">general_panel/README.md</text>
  <text x="936" y="207" class="sans small">Inherited by every specialized panel</text>

  <!-- Hierarchy connectors -->
  <path d="M800 262V288H448V310" class="connector"/>
  <path d="M800 288H1036V310" class="connector"/>
  <path d="M1036 288H1376V310" class="connector"/>
  <rect x="793" y="281" width="14" height="14" fill="#4599ff" class="pixel-border"/>

  <!-- R&D panel -->
  <path d="M64 326H76V310H812V326H828V796H812V812H76V796H64Z" fill="#111829" stroke="#8a6cff" stroke-width="2" class="pixel-border"/>
  <rect x="64" y="326" width="10" height="470" fill="#8a6cff"/>
  <text x="100" y="359" class="sans section-label" fill="#aa97ff">DISCOVER + DECIDE</text>
  <text x="100" y="392" class="sans panel-title">R&amp;D PANEL</text>
  <text x="100" y="417" class="mono path">rd_panel/kernel_optimization/</text>

  <!-- R&D role nodes -->
  <g class="pixel-border">
    <path d="M100 454H286V550H100Z" fill="#171e35" stroke="#6c79a1" stroke-width="2"/>
    <rect x="100" y="454" width="8" height="96" fill="#4599ff"/>
    <path d="M316 454H502V550H316Z" fill="#171e35" stroke="#6c79a1" stroke-width="2"/>
    <rect x="316" y="454" width="8" height="96" fill="#8a6cff"/>
    <path d="M532 454H792V550H532Z" fill="#171e35" stroke="#6c79a1" stroke-width="2"/>
    <rect x="532" y="454" width="8" height="96" fill="#40c58a"/>
    <path d="M100 586H348V684H100Z" fill="#171e35" stroke="#6c79a1" stroke-width="2"/>
    <rect x="100" y="586" width="8" height="98" fill="#ef6f91"/>
    <path d="M378 586H624V684H378Z" fill="#171e35" stroke="#6c79a1" stroke-width="2"/>
    <rect x="378" y="586" width="8" height="98" fill="#f3a846"/>
    <path d="M654 586H792V684H654Z" fill="#171e35" stroke="#6c79a1" stroke-width="2"/>
    <rect x="654" y="586" width="8" height="98" fill="#b4c1d8"/>
  </g>

  <text x="124" y="488" class="sans node-title">PROFILER</text>
  <text x="124" y="513" class="sans node-detail">raw ATT evidence</text>
  <text x="124" y="533" class="mono node-detail">&lt;arch&gt;/</text>

  <text x="340" y="488" class="sans node-title">TL</text>
  <text x="340" y="513" class="sans node-detail">causal finding</text>
  <text x="340" y="533" class="mono node-detail">targets/&lt;kernel&gt;/</text>

  <text x="556" y="488" class="sans node-title">WORKER + CLI</text>
  <text x="556" y="513" class="sans node-detail">implements one hypothesis</text>
  <text x="556" y="533" class="mono node-detail">cli.py · harness.py</text>

  <text x="124" y="620" class="sans node-title">KNOWLEDGE</text>
  <text x="124" y="645" class="sans node-detail">reviewed, durable insight</text>
  <text x="124" y="665" class="mono node-detail">knowledge.md</text>

  <text x="402" y="620" class="sans node-title">MANAGER</text>
  <text x="402" y="645" class="sans node-detail">accepts CLI verdict</text>
  <text x="402" y="665" class="sans node-detail">checks predicted signal</text>

  <text x="678" y="620" class="sans node-title">BUNDLE</text>
  <text x="678" y="645" class="mono node-detail">cases.json</text>
  <text x="678" y="665" class="mono node-detail">target.json</text>

  <path d="M286 502H306" class="flow-line" marker-end="url(#arrow-blue)"/>
  <path d="M502 502H522" class="flow-line" marker-end="url(#arrow-blue)"/>
  <path d="M378 635H358" class="flow-line" marker-end="url(#arrow-blue)"/>

  <path d="M100 730H792V778H100Z" fill="#0b1325" stroke="#332b63" stroke-width="2" class="pixel-border"/>
  <text x="124" y="751" class="sans section-label">PLACEMENT</text>
  <text x="124" y="770" class="mono path">harnesses/&lt;arch&gt;/  →  targets/&lt;kernel&gt;/</text>

  <!-- Build panel -->
  <path d="M864 326H876V310H1196V326H1208V796H1196V812H876V796H864Z" fill="#101c24" stroke="#40c58a" stroke-width="2" class="pixel-border"/>
  <rect x="864" y="326" width="10" height="470" fill="#40c58a"/>
  <text x="900" y="359" class="sans section-label" fill="#70dfa9">REBUILD + VERIFY</text>
  <text x="900" y="392" class="sans panel-title">BUILD PANEL</text>
  <text x="900" y="419" class="mono path">build_panel/</text>

  <path d="M900 454H1172V528H900Z" fill="#102a27" stroke="#317b65" stroke-width="2" class="pixel-border"/>
  <text x="924" y="484" class="sans node-title">COMPILER CHANGE?</text>
  <text x="924" y="509" class="sans node-detail">rebuild before evaluation</text>

  <path d="M900 550H1030V620H900Z" fill="#13251f" stroke="#317b65" stroke-width="2" class="pixel-border"/>
  <path d="M1042 550H1172V620H1042Z" fill="#13251f" stroke="#317b65" stroke-width="2" class="pixel-border"/>
  <text x="924" y="582" class="mono node-title">make</text>
  <text x="924" y="603" class="sans node-detail">when required</text>
  <text x="1066" y="582" class="mono node-title">pytest</text>
  <text x="1066" y="603" class="sans node-detail">or lit</text>

  <path d="M900 646H1172V730H900Z" fill="#0b1717" stroke="#245347" stroke-width="2" class="pixel-border"/>
  <text x="924" y="676" class="sans node-title">ACTIONABLES</text>
  <text x="924" y="701" class="mono node-detail">test_*.py · testdata/</text>
  <text x="924" y="720" class="sans node-detail">emits a build report</text>

  <!-- Perf panel -->
  <path d="M1244 326H1256V310H1524V326H1536V796H1524V812H1256V796H1244Z" fill="#221a13" stroke="#f3a846" stroke-width="2" class="pixel-border"/>
  <rect x="1244" y="326" width="10" height="470" fill="#f3a846"/>
  <text x="1280" y="359" class="sans section-label" fill="#ffc46e">MEASURE + GATE</text>
  <text x="1280" y="392" class="sans panel-title">PERF-BENCH</text>
  <text x="1280" y="419" class="mono path">perf_bench_panel/</text>

  <path d="M1280 454H1500V528H1280Z" fill="#2b2015" stroke="#875b27" stroke-width="2" class="pixel-border"/>
  <text x="1304" y="484" class="sans node-title">CORRECTNESS FIRST</text>
  <text x="1304" y="509" class="sans node-detail">never infer from timing</text>

  <path d="M1280 550H1500V634H1280Z" fill="#2b2015" stroke="#875b27" stroke-width="2" class="pixel-border"/>
  <text x="1304" y="580" class="sans node-title">CONTROLLED RUN</text>
  <text x="1304" y="605" class="sans node-detail">pinned idle GPU</text>
  <text x="1304" y="624" class="mono node-detail">denoise.sh</text>

  <path d="M1280 656H1500V730H1280Z" fill="#21170e" stroke="#68471f" stroke-width="2" class="pixel-border"/>
  <text x="1304" y="686" class="sans node-title">FULL SHAPE GATE</text>
  <text x="1304" y="711" class="sans node-detail">emits a perf report</text>

  <!-- Worker invokes validation panels -->
  <path d="M792 526H844V490H854" class="flow-line" marker-end="url(#arrow-blue)"/>
  <path d="M1208 592H1234" class="flow-line" marker-end="url(#arrow-blue)"/>
  <text x="834" y="474" class="mono node-detail">invoke</text>
  <text x="1209" y="576" class="mono node-detail">then</text>

  <!-- Bottom handoff ribbon -->
  <text x="64" y="858" class="sans section-label">EVIDENCE HANDOFF</text>
  <g class="pixel-border">
    <path d="M64 878H250V948H64Z" fill="#101a2f" stroke="#4599ff" stroke-width="2"/>
    <path d="M278 878H464V948H278Z" fill="#17162e" stroke="#8a6cff" stroke-width="2"/>
    <path d="M492 878H678V948H492Z" fill="#10231f" stroke="#40c58a" stroke-width="2"/>
    <path d="M706 878H892V948H706Z" fill="#241b10" stroke="#f3a846" stroke-width="2"/>
    <path d="M920 878H1106V948H920Z" fill="#1c202c" stroke="#aab7cd" stroke-width="2"/>
    <path d="M1134 878H1320V948H1134Z" fill="#291722" stroke="#ef6f91" stroke-width="2"/>
    <path d="M1348 878H1536V948H1348Z" fill="#17162e" stroke="#8a6cff" stroke-width="2"/>
  </g>
  <text x="86" y="908" class="sans flow-title">PROFILE</text>
  <text x="86" y="930" class="sans flow-detail">valid ATT trace</text>
  <text x="300" y="908" class="sans flow-title">TL FINDING</text>
  <text x="300" y="930" class="sans flow-detail">bubble + cause</text>
  <text x="514" y="908" class="sans flow-title">IMPLEMENT</text>
  <text x="514" y="930" class="sans flow-detail">one hypothesis</text>
  <text x="728" y="908" class="sans flow-title">VALIDATE</text>
  <text x="728" y="930" class="sans flow-detail">build + perf</text>
  <text x="942" y="908" class="sans flow-title">CLI VERDICT</text>
  <text x="942" y="930" class="sans flow-detail">deterministic gate</text>
  <text x="1156" y="908" class="sans flow-title">MANAGER</text>
  <text x="1156" y="930" class="sans flow-detail">signal review</text>
  <text x="1370" y="908" class="sans flow-title">KNOWLEDGE</text>
  <text x="1370" y="930" class="sans flow-detail">human approved</text>

  <path d="M250 913H268" class="flow-line" marker-end="url(#arrow-blue)"/>
  <path d="M464 913H482" class="flow-line" marker-end="url(#arrow-blue)"/>
  <path d="M678 913H696" class="flow-line" marker-end="url(#arrow-blue)"/>
  <path d="M892 913H910" class="flow-line" marker-end="url(#arrow-blue)"/>
  <path d="M1106 913H1124" class="flow-line" marker-end="url(#arrow-blue)"/>
  <path d="M1320 913H1338" class="flow-line" marker-end="url(#arrow-blue)"/>

  <text x="64" y="982" class="mono small">profile first · optimize bubbles · rebuild compiler changes · promote only measured wins</text>
</svg>
