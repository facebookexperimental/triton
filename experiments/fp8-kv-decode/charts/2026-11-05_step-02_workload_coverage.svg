<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="756" viewBox="0 0 1370 756" role="img" aria-labelledby="title desc">
<title id="title">FP8 decode target workload coverage</title>
<desc id="desc">Seven reported workload cases compared to the existing component tests; exact acceptance pending.</desc>
<rect width="1370" height="756" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="26" fill="#0f172a" font-weight="bold">FP8 decode: target workloads versus existing evidence</text>
<text x="28" y="67" font-size="16" fill="#0f172a" font-weight="normal">2026-11-05 | Seven cases, 15 T/L combinations | Exact target acceptance remains pending</text>
<text x="28" y="95" font-size="15" fill="#92400e" font-weight="normal">Evidence refers to the 2026-10-27 component suite. No new GPU run or performance measurement.</text>
<text x="28" y="140" font-size="15" fill="#0f172a" font-weight="bold">Case</text>
<text x="205" y="140" font-size="15" fill="#0f172a" font-weight="bold">T</text>
<text x="385" y="140" font-size="15" fill="#0f172a" font-weight="bold">L</text>
<text x="540" y="140" font-size="15" fill="#0f172a" font-weight="bold">Prior component evidence</text>
<text x="1020" y="140" font-size="15" fill="#0f172a" font-weight="bold">Unresolved / gap</text>
<rect x="20" y="160" width="1325" height="62" rx="5" fill="#fef3c7"/>
<text x="28" y="186" font-size="16" fill="#0f172a" font-weight="bold">1. Base parity</text>
<text x="205" y="186" font-size="14" fill="#0f172a" font-weight="normal">1</text>
<text x="385" y="186" font-size="14" fill="#0f172a" font-weight="normal">2304</text>
<text x="540" y="184" font-size="14" fill="#475569" font-weight="normal">L=2304, Hq=Hkv=128, D=64 passed.</text>
<text x="540" y="206" font-size="14" fill="#475569" font-weight="normal">Dense width matches under this provisional mapping.</text>
<text x="1020" y="184" font-size="14" fill="#92400e" font-weight="normal">Head mapping / O</text>
<text x="1020" y="206" font-size="14" fill="#92400e" font-weight="normal">contract unconfirmed.</text>
<rect x="20" y="230" width="1325" height="62" rx="5" fill="#fef3c7"/>
<text x="28" y="256" font-size="16" fill="#0f172a" font-weight="bold">2. Full FP8</text>
<text x="205" y="256" font-size="14" fill="#0f172a" font-weight="normal">1</text>
<text x="385" y="256" font-size="14" fill="#0f172a" font-weight="normal">2304</text>
<text x="540" y="254" font-size="14" fill="#475569" font-weight="normal">Same provisional width; FP8 Q test passed.</text>
<text x="540" y="276" font-size="14" fill="#475569" font-weight="normal">Per-query-head Q and KV-head scales used.</text>
<text x="1020" y="254" font-size="14" fill="#92400e" font-weight="normal">Head mapping / O</text>
<text x="1020" y="276" font-size="14" fill="#92400e" font-weight="normal">contract unconfirmed.</text>
<rect x="20" y="300" width="1325" height="62" rx="5" fill="#fef3c7"/>
<text x="28" y="326" font-size="16" fill="#0f172a" font-weight="bold">3. T-sweep</text>
<text x="205" y="326" font-size="14" fill="#0f172a" font-weight="normal">8..8192 (6 values)</text>
<text x="385" y="326" font-size="14" fill="#0f172a" font-weight="normal">2304</text>
<text x="540" y="324" font-size="14" fill="#475569" font-weight="normal">All six T values passed with Hq=16/Hkv=2/D=64.</text>
<text x="540" y="346" font-size="14" fill="#475569" font-weight="normal">Q width was 1024; one shared noncausal cache.</text>
<text x="1020" y="324" font-size="14" fill="#92400e" font-weight="normal">Width / T semantics / mask</text>
<text x="1020" y="346" font-size="14" fill="#92400e" font-weight="normal">and Q dtype pending.</text>
<rect x="20" y="370" width="1325" height="62" rx="5" fill="#fef3c7"/>
<text x="28" y="396" font-size="16" fill="#0f172a" font-weight="bold">4. KV-sweep</text>
<text x="205" y="396" font-size="14" fill="#0f172a" font-weight="normal">1</text>
<text x="385" y="396" font-size="14" fill="#0f172a" font-weight="normal">1K/8K/32K</text>
<text x="540" y="394" font-size="14" fill="#475569" font-weight="normal">8192/32768 passed at Hq=4/Hkv=2/D=64.</text>
<text x="540" y="416" font-size="14" fill="#475569" font-weight="normal">No explicit 1024-token test in the prior suite.</text>
<text x="1020" y="394" font-size="14" fill="#92400e" font-weight="normal">Full width / 1K gap;</text>
<text x="1020" y="416" font-size="14" fill="#92400e" font-weight="normal">K units / Q dtype pending.</text>
<rect x="20" y="440" width="1325" height="62" rx="5" fill="#fef3c7"/>
<text x="28" y="466" font-size="16" fill="#0f172a" font-weight="bold">5. Long context</text>
<text x="205" y="466" font-size="14" fill="#0f172a" font-weight="normal">1</text>
<text x="385" y="466" font-size="14" fill="#0f172a" font-weight="normal">128K/256K</text>
<text x="540" y="464" font-size="14" fill="#475569" font-weight="normal">131072/262144 passed at Hq=2/Hkv=1/D=64.</text>
<text x="540" y="486" font-size="14" fill="#475569" font-weight="normal">These checks used reduced Q/KV widths.</text>
<text x="1020" y="464" font-size="14" fill="#92400e" font-weight="normal">Full head mapping / width;</text>
<text x="1020" y="486" font-size="14" fill="#92400e" font-weight="normal">K units / Q dtype pending.</text>
<rect x="20" y="510" width="1325" height="62" rx="5" fill="#fef3c7"/>
<text x="28" y="536" font-size="16" fill="#0f172a" font-weight="bold">6. GQA folded</text>
<text x="205" y="536" font-size="14" fill="#0f172a" font-weight="normal">1</text>
<text x="385" y="536" font-size="14" fill="#0f172a" font-weight="normal">2304</text>
<text x="540" y="534" font-size="14" fill="#475569" font-weight="normal">Q=[1,16,64] exercised with Hkv=2 at L=2304.</text>
<text x="540" y="556" font-size="14" fill="#475569" font-weight="normal">Paged layout and unequal head scales tested.</text>
<text x="1020" y="534" font-size="14" fill="#92400e" font-weight="normal">KV heads / folding map</text>
<text x="1020" y="556" font-size="14" fill="#92400e" font-weight="normal">and page size pending.</text>
<rect x="20" y="580" width="1325" height="62" rx="5" fill="#fef3c7"/>
<text x="28" y="606" font-size="16" fill="#0f172a" font-weight="bold">7. SWA</text>
<text x="205" y="606" font-size="14" fill="#0f172a" font-weight="normal">1</text>
<text x="385" y="606" font-size="14" fill="#0f172a" font-weight="normal">2304</text>
<text x="540" y="604" font-size="14" fill="#475569" font-weight="normal">Windows 37/127 passed on component shapes.</text>
<text x="540" y="626" font-size="14" fill="#475569" font-weight="normal">No exact target window was supplied.</text>
<text x="1020" y="604" font-size="14" fill="#92400e" font-weight="normal">Window size / full width</text>
<text x="1020" y="626" font-size="14" fill="#92400e" font-weight="normal">and Q dtype pending.</text>
<text x="28" y="676" font-size="15" fill="#0f172a" font-weight="normal">Dense Q/KV widths: 8192. Folded Q: [1,16,64]. Reported O: [T,1024] x [1024,8192].</text>
<text x="28" y="702" font-size="15" fill="#0f172a" font-weight="normal">Packed E4M3 cache: K [block,head,D/16,page,16]; V [block,head,page/16,D,16].</text>
<text x="28" y="728" font-size="15" fill="#92400e" font-weight="normal">Amber rows require contract resolution; passing component tests does not establish exact workload acceptance.</text>
</g></svg>
