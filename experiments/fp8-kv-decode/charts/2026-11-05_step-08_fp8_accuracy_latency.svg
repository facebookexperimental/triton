<text x="24" y="66" font-size="14" fill="#0f172a" font-weight="normal">Same quantized QKV/unit scales; orange fails the unchanged project gate. Scalar controls, not native per-head parity.</text>
<text x="24" y="92" font-size="14" fill="#0f172a" font-weight="normal">gfx1250 DPX / 96 CUs | E4M3 | numerical gate: atol=5e-4, rtol=1e-2</text>
<text x="24" y="119" font-size="13" fill="#92400e" font-weight="normal">Orange: failed numerical gate; latency shown for diagnosis and ineligible for performance wins.</text>
