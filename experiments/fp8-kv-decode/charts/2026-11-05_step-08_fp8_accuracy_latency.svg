<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="601" viewBox="0 0 1280 601" role="img" aria-labelledby="title desc">
<title id="title">Full-FP8 controls: latency and numerical eligibility</title>
<desc id="desc">Same quantized QKV/unit scales; orange fails the unchanged project gate. Scalar controls, not native per-head parity.</desc>
<rect width="1280" height="601" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif">
